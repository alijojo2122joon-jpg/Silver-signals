<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3ef">
<title>Market Analysts</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#eef2fb; --bg2:#dfe7f8; --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.85);
    --stroke:rgba(255,255,255,.95); --text:#0f1733; --muted:#6b7593; --soft:#8f99b5;
    --blue:#3566ff; --blue2:#1b3fd1; --glow:rgba(53,102,255,.35);
    --buy:#12a46b; --buy-bg:rgba(18,164,107,.12); --sell:#e5484d; --sell-bg:rgba(229,72,77,.12); --amber:#d8911c; --amber-bg:rgba(216,145,28,.13);
    --sh:0 12px 32px rgba(46,72,160,.13), 0 2px 6px rgba(46,72,160,.06);
    --sh-in:inset 0 2px 6px rgba(46,72,160,.08), inset 0 -1px 0 rgba(255,255,255,.9);
    --blob1:#c9d7ff; --blob2:#d9e3ff;
  }
  :root[data-theme="dark"]{
    --bg:#0c1122; --bg2:#121a33; --glass:rgba(28,37,66,.62); --glass2:rgba(34,45,80,.85);
    --stroke:rgba(255,255,255,.08); --text:#edf1ff; --muted:#97a2c3; --soft:#7480a3;
    --sh:0 12px 32px rgba(0,0,0,.35); --sh-in:inset 0 2px 6px rgba(0,0,0,.3), inset 0 -1px 0 rgba(255,255,255,.04);
    --blob1:#1d2d66; --blob2:#18234d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:var(--bg2)}
  body{background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
  .blob{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(2px);animation:float 14s ease-in-out infinite}
  .b1{width:260px;height:260px;top:-90px;right:-90px;background:radial-gradient(circle at 30% 30%,#fff,var(--blob1) 70%);opacity:.8}
  .b2{width:170px;height:170px;top:38%;left:-70px;background:radial-gradient(circle at 60% 40%,#fff,var(--blob2) 70%);opacity:.7;animation-delay:-5s}
  .b3{width:220px;height:220px;bottom:-80px;right:-60px;background:radial-gradient(circle at 40% 30%,#fff,var(--blob1) 70%);opacity:.6;animation-delay:-9s}
  :root[data-theme="dark"] .blob{opacity:.5}
  @keyframes float{50%{transform:translate(14px,-18px) scale(1.04)}}

  .app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--stroke);box-shadow:var(--sh)}
  .num{font-variant-numeric:tabular-nums}
  .ltr{direction:ltr;unicode-bidi:isolate}

  /* motion */
  .rise{opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 70ms)}
  @keyframes rise{to{opacity:1;transform:none}}
  .press{transition:transform .18s cubic-bezier(.3,.7,.4,1.4),box-shadow .2s,background .2s}
  .press:active{transform:scale(.96)}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(3.2);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}

  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 8px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
  .coin{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--glass2);box-shadow:var(--sh);border:1px solid var(--stroke)}
  .coin span{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c3cad6 45%,#7c8698);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6),0 2px 6px rgba(60,70,100,.3)}
  .icons{display:flex;gap:8px}
  .ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:13px;border:1px solid var(--stroke);background:var(--glass2);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .ib svg{width:19px;height:19px}

  /* subscription */
  .sub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 14px;padding:12px 16px;border-radius:18px;font-size:13px;color:var(--muted)}
  .sub b{color:var(--text)}
  .live{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--buy)}
  .live i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
  .sub.warn .live{color:var(--amber)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,164,107,.45)}70%{box-shadow:0 0 0 9px rgba(18,164,107,0)}100%{box-shadow:0 0 0 0 rgba(18,164,107,0)}}

  /* segmented */
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;border-radius:999px;margin-bottom:16px}
  .seg .pill{position:absolute;top:5px;bottom:5px;width:calc((100% - 10px)/3);right:5px;border-radius:999px;background:var(--glass2);box-shadow:0 4px 14px rgba(46,72,160,.16);border:1px solid var(--stroke);transition:transform .45s cubic-bezier(.3,1.3,.4,1)}
  .seg button{position:relative;z-index:1;border:0;background:none;font-family:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:9px 0;cursor:pointer;transition:color .3s}
  .seg button.on{color:var(--text)}

  h3{font-size:13px;color:var(--muted);font-weight:700;margin:4px 6px 10px;letter-spacing:.3px}

  /* hero */
  .hero{position:relative;border-radius:28px;padding:20px;margin-bottom:22px;overflow:hidden}
  .hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-110px;left:-80px;background:radial-gradient(circle,var(--cg),transparent 70%);opacity:.9;pointer-events:none}
  .hero.buy{--c:var(--buy);--cb:var(--buy-bg);--cg:rgba(18,164,107,.18)} .hero.sell{--c:var(--sell);--cb:var(--sell-bg);--cg:rgba(229,72,77,.18)}
  .hh{display:flex;align-items:center;justify-content:space-between}
  .side{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:var(--c)}
  .arrow{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--cb);box-shadow:var(--sh-in)}
  .arrow svg{width:22px;height:22px}
  .st{font-size:12px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--glass2);color:var(--muted);border:1px solid var(--stroke)}
  .st.active{color:var(--c);background:var(--cb);border-color:transparent}
  .st.tp1,.st.tp2{color:var(--buy);background:var(--buy-bg);border-color:transparent}
  .st.sl{color:var(--sell);background:var(--sell-bg);border-color:transparent}
  .entry{margin:18px 2px 2px;color:var(--muted);font-size:13px}
  .entry b{display:block;font-size:38px;font-weight:900;color:var(--text);line-height:1.25;letter-spacing:-.5px}
  .lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .lv{border-radius:18px;padding:12px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:var(--sh-in)}
  .lv small{display:block;font-size:11px;color:var(--muted)}
  .lv b{font-size:19px;font-weight:800}
  .lv.tp b{color:var(--buy)} .lv.sl b{color:var(--sell)}
  .note{margin-top:14px;padding:12px 14px;border-radius:16px;background:var(--glass2);border:1px solid var(--stroke);font-size:14px;white-space:pre-wrap}
  .when{margin-top:12px;font-size:12px;color:var(--soft)}

  /* history */
  .list{border-radius:24px;padding:6px}
  .it{position:relative;overflow:hidden;border-radius:18px;cursor:pointer;transition:background .25s}
  .it:hover{background:rgba(255,255,255,.35)}
  .it.open{background:var(--glass2);box-shadow:0 6px 18px rgba(46,72,160,.1)}
  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px}
  .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:var(--sh-in)}
  .av svg{width:20px;height:20px}
  .av.buy{background:var(--buy-bg);color:var(--buy)} .av.sell{background:var(--sell-bg);color:var(--sell)}
  .row .t{font-weight:800;font-size:15px}
  .row .s{font-size:12px;color:var(--muted)}
  .row .e{text-align:left;font-size:11px;color:var(--soft)}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;margin-bottom:2px}
  .chip.buy{background:var(--buy-bg);color:var(--buy)} .chip.sell{background:var(--sell-bg);color:var(--sell)} .chip.mute{background:rgba(120,130,160,.12);color:var(--muted)}
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.2,.8,.2,1)}
  .it.open .more{grid-template-rows:1fr}
  .more>div{overflow:hidden}
  .more .lvls{margin:0 12px 12px}
  .more .note{margin:0 12px 12px}

  .empty{text-align:center;padding:40px 20px;border-radius:26px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:6px}
  .empty h2{color:var(--text);font-size:18px;margin:0 0 4px}

  /* skeleton */
  .sk{border-radius:26px;height:250px;margin-bottom:22px;background:linear-gradient(100deg,var(--glass) 30%,var(--glass2) 50%,var(--glass) 70%);background-size:300% 100%;animation:shim 1.4s infinite;border:1px solid var(--stroke)}
  @keyframes shim{to{background-position:-150% 0}}

  /* login */
  .login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 6px}
  .logo{width:116px;height:116px;margin:0 auto 22px;border-radius:34px;display:grid;place-items:center}
  .logo span{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#c6cdd9 45%,#717b8e);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 10px 22px rgba(60,70,110,.35);animation:bob 4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .login h1{text-align:center;font-size:30px;font-weight:900;margin:0}
  .login .tag{text-align:center;color:var(--muted);font-size:14px;margin:2px 0 26px;letter-spacing:.5px}
  .field{position:relative;display:flex;align-items:center;gap:10px;padding:0 16px;height:60px;border-radius:20px;margin-bottom:14px;transition:box-shadow .3s,border-color .3s}
  .field:focus-within{border-color:rgba(53,102,255,.5);box-shadow:0 0 0 4px rgba(53,102,255,.12),var(--sh)}
  .field svg{width:21px;height:21px;color:var(--soft);flex:none}
  .field input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-family:inherit;font-size:16px;color:var(--text);direction:ltr;text-align:right}
  .field input::placeholder{color:var(--soft);direction:rtl}
  .eye{background:none;border:0;padding:4px;cursor:pointer;color:var(--soft);display:grid}
  .cta{position:relative;overflow:hidden;width:100%;height:60px;margin-top:8px;border:0;border-radius:22px;cursor:pointer;font-family:inherit;font-size:18px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4a7bff,var(--blue2));box-shadow:0 14px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
  .cta .go{position:absolute;left:10px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;transition:transform .3s}
  .cta:hover .go{transform:translateX(-4px)}
  .cta .go svg{width:20px;height:20px}
  .cta:disabled{opacity:.75}
  .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .err{min-height:24px;text-align:center;color:var(--sell);font-size:13px;margin-top:10px}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .foot{text-align:center;color:var(--soft);font-size:11px;letter-spacing:2px;margin-top:30px}
  .disc{text-align:center;color:var(--soft);font-size:11px;margin:24px 10px 0}

  /* voice player */
  .vp{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:18px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:var(--sh-in)}
  .vplay{position:relative;overflow:hidden;flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4a7bff,#1b3fd1);box-shadow:0 8px 18px rgba(53,102,255,.35);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}
  .vplay:active{transform:scale(.9)}
  .vplay svg{width:18px;height:18px}
  .vwave{flex:1;height:34px;display:flex;align-items:center;gap:3px;direction:ltr;cursor:pointer;position:relative}
  .vwave i{flex:1;border-radius:3px;background:rgba(120,130,160,.35);transition:background .2s}
  .vwave i.on{background:var(--blue,#3566ff)}
  .vp.playing .vwave i.on{animation:vb 1s ease-in-out infinite alternate}
  @keyframes vb{to{opacity:.6}}
  .vt{font-size:12px;color:var(--muted);min-width:38px;text-align:left;font-variant-numeric:tabular-nums}
  .vlab{font-size:11px;font-weight:800;color:var(--muted);margin:14px 4px -8px}

  /* ===== عمق سه‌بعدی ===== */
  :root{
    --sh:0 22px 44px -14px rgba(38,64,160,.30),0 8px 18px -8px rgba(38,64,160,.20),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -3px 6px rgba(38,64,160,.07);
    --raise:7px 9px 18px rgba(78,98,170,.20),-5px -5px 12px rgba(255,255,255,.95),inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(78,98,170,.08);
    --sh-in:inset 3px 4px 8px rgba(78,98,170,.14),inset -3px -3px 7px rgba(255,255,255,.95);
    --tile:linear-gradient(145deg,#ffffff,#e7edfb);
    --gl:linear-gradient(160deg,rgba(255,255,255,.92),rgba(236,242,255,.58));
  }
  :root[data-theme="dark"]{
    --sh:0 22px 44px -14px rgba(0,0,0,.6),0 8px 18px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -3px 6px rgba(0,0,0,.25);
    --raise:6px 8px 16px rgba(0,0,0,.45),-4px -4px 10px rgba(255,255,255,.035),inset 0 1px 0 rgba(255,255,255,.08);
    --sh-in:inset 3px 4px 8px rgba(0,0,0,.4),inset -2px -2px 6px rgba(255,255,255,.04);
    --tile:linear-gradient(145deg,#26315a,#18203d);
    --gl:linear-gradient(160deg,rgba(40,52,92,.85),rgba(22,30,58,.6));
  }
  .glass{background:var(--gl)}
  .ib,.coin,.lv,.av,.arrow,.chips button,.stlist button,.ghost,.vp,.note,.box,.st{background:var(--tile);box-shadow:var(--raise);border:1px solid rgba(255,255,255,.7)}
  :root[data-theme="dark"] .ib,:root[data-theme="dark"] .coin,:root[data-theme="dark"] .lv,:root[data-theme="dark"] .av,:root[data-theme="dark"] .arrow,:root[data-theme="dark"] .vp,:root[data-theme="dark"] .note,:root[data-theme="dark"] .ghost,:root[data-theme="dark"] .box{border-color:rgba(255,255,255,.06)}
  .av.buy,.arrow.buy,.hero.buy .arrow{background:linear-gradient(145deg,#e9fbf3,#c9f0dd);color:var(--buy)}
  .av.sell,.hero.sell .arrow{background:linear-gradient(145deg,#fff0f0,#fbd5d6);color:var(--sell)}
  :root[data-theme="dark"] .av.buy,:root[data-theme="dark"] .hero.buy .arrow{background:linear-gradient(145deg,#1c4a3a,#123327)}
  :root[data-theme="dark"] .av.sell,:root[data-theme="dark"] .hero.sell .arrow{background:linear-gradient(145deg,#4f2229,#35161b)}
  .av svg,.arrow svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  .lv b,.entry b,.stat b{text-shadow:0 2px 0 rgba(255,255,255,.8),0 6px 14px rgba(38,64,160,.18)}
  :root[data-theme="dark"] .lv b,:root[data-theme="dark"] .entry b,:root[data-theme="dark"] .stat b{text-shadow:0 4px 14px rgba(0,0,0,.5)}
  .in,.field input,.search input{color:var(--text)}
  .in,.tog,.seg,.search{box-shadow:var(--sh-in)}
  .seg{background:rgba(226,233,250,.65)} :root[data-theme="dark"] .seg{background:rgba(10,14,30,.5)}
  .seg .pill,.nav .pill{box-shadow:var(--raise)}
  .seg .pill{background:var(--tile)}
  .cta,.add,.vplay,.mark,.chips button.on{background:linear-gradient(180deg,#5b8aff 0%,#3566ff 45%,#1b3fd1 100%);
    box-shadow:0 16px 28px -8px rgba(40,80,240,.55),0 4px 0 #1530a8,inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,30,.25);transition:transform .15s,box-shadow .15s}
  .cta:active,.add:active,.vplay:active{transform:translateY(3px);box-shadow:0 8px 16px -8px rgba(40,80,240,.55),0 1px 0 #1530a8,inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,30,.25)}
  .cta{margin-bottom:4px}
  .nav .pill{background:linear-gradient(180deg,#5b8aff,#1b3fd1);box-shadow:0 10px 20px -6px rgba(40,80,240,.55),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,30,.25)}
  .mic{background:linear-gradient(180deg,#ff8285,#e5484d 55%,#bf2f35);box-shadow:0 14px 24px -8px rgba(229,72,77,.6),0 4px 0 #a52429,inset 0 2px 0 rgba(255,255,255,.4)}
  .tog .k{box-shadow:0 8px 16px -6px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35)}
  .tog .k{background:linear-gradient(180deg,#2fd08c,#12a46b)} .tog.sell .k{background:linear-gradient(180deg,#ff7a7e,#d93a40)}
  .hero{transform:perspective(900px) rotateX(0deg);transition:transform .5s}
  .hero{background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 38%),var(--gl)}
  :root[data-theme="dark"] .hero{background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 38%),var(--gl)}
  .coin span,.logo span{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),inset -4px -6px 10px rgba(0,0,0,.22),0 8px 16px rgba(60,70,110,.35)}
  .logo{box-shadow:var(--sh),0 30px 60px -20px rgba(38,64,160,.35)}

  /* ===== نور سوییپ ===== */
  .sw{position:relative;overflow:hidden;isolation:isolate}
  .sw>.shine{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;overflow:hidden}
  .sw>.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;
    background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,0) 20%,rgba(255,255,255,.42) 50%,rgba(255,255,255,0) 80%,transparent 100%);
    transform:skewX(-18deg);animation:sweep 3.6s cubic-bezier(.4,0,.2,1) infinite;animation-delay:var(--sd,0s)}
  :root[data-theme="dark"] .sw>.shine::after{background:linear-gradient(105deg,transparent,rgba(255,255,255,.14) 50%,transparent)}
  @keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
  .chip,.st{position:relative;overflow:hidden}
  .chip::after,.st::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:chipsw 2.8s ease-in-out infinite}
  @keyframes chipsw{0%{transform:translateX(120%)}50%,100%{transform:translateX(-120%)}}

  /* ===== نوار زنده و هشدار ===== */
  .livebar{display:flex;align-items:center;gap:10px;margin:-4px 0 16px;padding:10px 14px;border-radius:18px;font-size:12px;color:var(--muted)}
  .livebar b{color:var(--buy);font-weight:900;font-size:13px}
  .ldot{width:10px;height:10px;border-radius:50%;background:var(--buy);box-shadow:0 0 0 0 rgba(18,164,107,.5);animation:pulse 1.6s infinite;flex:none}
  .livebar.busy .ldot{background:var(--blue);animation:pulseb 0.9s infinite}
  @keyframes pulseb{0%{box-shadow:0 0 0 0 rgba(53,102,255,.5)}100%{box-shadow:0 0 0 10px rgba(53,102,255,0)}}
  .livebar.off b{color:var(--sell)} .livebar.off .ldot{background:var(--sell);animation:none}
  .lbt{flex:1}
  .ring{width:26px;height:26px;flex:none;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:3}
  .ring .bg{stroke:rgba(120,130,160,.2)}
  .ring .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:63;stroke-dashoffset:0}
  .ring.run .fg{animation:cd var(--poll,8s) linear forwards}
  @keyframes cd{to{stroke-dashoffset:63}}
  .livebar.busy .ring{animation:rot .8s linear infinite}

  /* ===== نتیجه‌ی معامله ===== */
  .res{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:18px;box-shadow:var(--raise);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden}
  .res .ri{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900}

  .res.win{background:linear-gradient(145deg,#ecfbf4,#d2f3e3)} .res.win b{color:var(--buy)}
  .res.win .ri{background:linear-gradient(180deg,#34d896,#0e8f5b);box-shadow:0 8px 16px -6px rgba(18,164,107,.6),inset 0 2px 0 rgba(255,255,255,.4)}

  .res.lose .ri{background:linear-gradient(180deg,#ff7a7e,#c93036);box-shadow:0 8px 16px -6px rgba(229,72,77,.6),inset 0 2px 0 rgba(255,255,255,.4)}
  .res.neutral{background:var(--tile)} .res.neutral .ri{background:linear-gradient(180deg,#9aa4bd,#6b7593)}
  :root[data-theme="dark"] .res.win{background:linear-gradient(145deg,#173d30,#0f2a21)}
  :root[data-theme="dark"] .res.lose{background:linear-gradient(145deg,#45202a,#2d141a)}
  .res::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(130%);animation:resw 4.5s cubic-bezier(.45,0,.2,1) infinite}
  @keyframes resw{0%{transform:translateX(130%)}45%,100%{transform:translateX(-130%)}}
  .resgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .rb{position:relative;overflow:hidden;border:0;border-radius:18px;padding:14px 10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,box-shadow .15s}
  .rb span{font-size:22px;line-height:1}
  .rb small{font-size:11px;font-weight:600;opacity:.9}
  .rb.g{background:linear-gradient(180deg,#34d896,#12a46b 55%,#0b7d50);box-shadow:0 14px 24px -10px rgba(18,164,107,.7),0 4px 0 #0a6a44,inset 0 2px 0 rgba(255,255,255,.4)}
  .rb.r{background:linear-gradient(180deg,#ff8286,#e5484d 55%,#b92b31);box-shadow:0 14px 24px -10px rgba(229,72,77,.7),0 4px 0 #9b2227,inset 0 2px 0 rgba(255,255,255,.4)}
  .rb.n{background:linear-gradient(180deg,#a7b0c7,#7a84a1 55%,#5d6683);box-shadow:0 14px 24px -10px rgba(90,100,130,.6),0 4px 0 #4d5571,inset 0 2px 0 rgba(255,255,255,.35)}
  .rb:active{transform:translateY(3px)}
  .rb.cur{outline:3px solid rgba(255,255,255,.9);outline-offset:-6px}

  /* ===== برند Market Analysts ===== */
  :root{
    --bg:#eef3ef; --bg2:#dfe9e2; --text:#0c120e; --muted:#5f6d64; --soft:#8b978f;
    --blue:#00963f; --blue2:#006b2c; --glow:rgba(0,150,63,.35); --brand:#00963f; --ink:#0c120e;
    --buy:#00963f; --buy-bg:rgba(0,150,63,.12);
    --blob1:#cfe8d7; --blob2:#e3efe6;
    --sh:0 22px 44px -14px rgba(20,50,32,.28),0 8px 18px -8px rgba(20,50,32,.18),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -3px 6px rgba(20,50,32,.06);
    --raise:7px 9px 18px rgba(40,70,52,.18),-5px -5px 12px rgba(255,255,255,.95),inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(40,70,52,.08);
    --sh-in:inset 3px 4px 8px rgba(40,70,52,.13),inset -3px -3px 7px rgba(255,255,255,.95);
    --tile:linear-gradient(145deg,#ffffff,#e6eee8);
    --gl:linear-gradient(160deg,rgba(255,255,255,.93),rgba(234,243,237,.6));
  }
  :root[data-theme="dark"]{
    --bg:#0b100d; --bg2:#111a14; --text:#eef5f0; --muted:#98a89d; --soft:#748479;
    --blob1:#123d22; --blob2:#0f2a19;
    --tile:linear-gradient(145deg,#1f2b23,#151e18); --gl:linear-gradient(160deg,rgba(32,44,36,.88),rgba(18,26,21,.62));
  }
  .cta,.add,.vplay,.chips button.on,.nav .pill,.banner .bi{background:linear-gradient(180deg,#22c466 0%,#00963f 50%,#006b2c 100%);
    box-shadow:0 16px 28px -8px rgba(0,120,50,.5),0 4px 0 #004d20,inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,30,10,.3)}

  .lgo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tile);box-shadow:var(--raise);border:1px solid rgba(255,255,255,.7)}

  :root[data-theme="dark"] .lgo img,:root[data-theme="dark"] .logo img{filter:invert(1) hue-rotate(180deg) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .wm{display:flex;flex-direction:column;line-height:1.05}

  .login h1{font-size:22px;margin-top:14px}

  /* ===== حرکت نرم و روان ===== */
  .rise{animation:rise .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0) * 80ms);transform:translateY(22px) scale(.98)}
  @keyframes rise{to{opacity:1;transform:none}}
  .blob{animation:morph 18s ease-in-out infinite;will-change:transform,border-radius}
  .b2{animation-duration:22s;animation-delay:-7s} .b3{animation-duration:26s;animation-delay:-13s}
  @keyframes morph{
    0%,100%{transform:translate(0,0) rotate(0) scale(1);border-radius:50% 50% 50% 50%/50% 50% 50% 50%}
    25%{transform:translate(18px,-22px) rotate(25deg) scale(1.06);border-radius:58% 42% 55% 45%/45% 58% 42% 55%}
    50%{transform:translate(-10px,14px) rotate(-10deg) scale(.96);border-radius:42% 58% 45% 55%/58% 42% 58% 42%}
    75%{transform:translate(12px,8px) rotate(15deg) scale(1.03);border-radius:55% 45% 60% 40%/40% 60% 45% 55%}}
  .hero{animation:rise .9s cubic-bezier(.16,1,.3,1) forwards, drift 7s ease-in-out 1s infinite}
  @keyframes drift{0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}33%{transform:translateY(-4px) rotateX(1.2deg) rotateY(-1deg)}66%{transform:translateY(-1px) rotateX(-.8deg) rotateY(1.2deg)}}
  .hero{transform-style:preserve-3d;will-change:transform}
  .stat:nth-child(1){animation:rise .9s cubic-bezier(.16,1,.3,1) .08s forwards, bobs 6s ease-in-out 1s infinite}
  .stat:nth-child(2){animation:rise .9s cubic-bezier(.16,1,.3,1) .16s forwards, bobs 6s ease-in-out 1.8s infinite}
  .stat:nth-child(3){animation:rise .9s cubic-bezier(.16,1,.3,1) .24s forwards, bobs 6s ease-in-out 2.6s infinite}
  @keyframes bobs{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .lv{animation:bobs 5s ease-in-out infinite}
  .lv:nth-child(2){animation-delay:-1.6s} .lv:nth-child(3){animation-delay:-3.2s}
  .av,.arrow{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  .it:hover .av,.it:active .av{transform:scale(1.1) rotate(-6deg)}

  /* نور منحنی و روان */
  .sw>.shine::after{top:-60%;bottom:auto;height:220%;width:55%;left:0;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 35%,transparent 65%);
    transform:none;animation:arc 6.5s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--sd,0s);opacity:0}

    12%{opacity:1}
    30%{transform:translate(40%,-10%) rotate(-8deg)}
    50%{transform:translate(120%,8%) rotate(10deg)}
    68%{transform:translate(210%,-14%) rotate(22deg);opacity:1}
    80%,100%{transform:translate(260%,20%) rotate(30deg);opacity:0}}

  /* ===== ترجمه ===== */
  .note.tr{padding:10px 12px 12px;white-space:normal}
  .trbar{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;margin-bottom:10px;border-radius:14px;background:rgba(120,130,160,.10);box-shadow:var(--sh-in)}

  @keyframes shim{to{background-position:-150% 0}}
  .trsrc{display:block;margin-top:8px;font-size:11px;color:var(--soft)}

  /* ===== بازارها: طلا / نقره / دالر ===== */

  /* قطره‌ی مذاب روی کارت اصلی */
  .hero .drip{position:absolute;top:-2px;left:0;right:0;height:120px;z-index:0;pointer-events:none;background-repeat:no-repeat;background-size:100% auto;background-position:top center;

/* مترجم: اول Google مستقیم از مرورگر، بعد MyMemory، بعد سرور */
async function gTranslate(text, tl){
  const parts = []; let cur = "";
  for (const line of String(text).split(/(\n)/)) { if ((cur + line).length > 1500 && cur) { parts.push(cur); cur = ""; } cur += line; }
  if (cur) parts.push(cur);
  const one = async p => {
    try {
      const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl=" + tl + "&q=" + encodeURIComponent(p));
      if (r.ok) { const j = await r.json(); const t = (j[0] || []).map(x => x[0]).join(""); if (t) return t; }
    } catch {}
    try {
      const src = /[؀-ۿ]/.test(p) ? (tl === "fa" ? "ps" : "fa") : "en";
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(p) + "&langpair=" + src + "|" + (tl === "ps" ? "ps-AF" : tl));
      if (r.ok) { const j = await r.json(); const t = j?.responseData?.translatedText; if (t && !/MYMEMORY WARNING|INVALID/i.test(t)) return t; }
    } catch {}
    throw new Error("tr_failed");
  };
  const out = []; for (const p of parts) out.push(await one(p));
  return out.join("");
}

      el.setAttribute("dir", dir); src.textContent = note; requestAnimationFrame(() => el.classList.remove("fade")); }, 200); };
  if (lang === "fa") return show(el.dataset.orig, "auto", "");
  const key = id + ":" + lang;
  if (trCache[key]) return show(trCache[key], lang === "en" ? "ltr" : "rtl", "ترجمه‌ی خودکار");
  const rec = (typeof all !== "undefined" ? all : signals).find(x => String(x.id) === id);
  const stored = rec?.translations?.[lang];
  if (stored) { trCache[key] = stored; return show(stored, lang === "en" ? "ltr" : "rtl", "ترجمه‌ی خودکار"); }
  el.classList.add("load"); box.dataset.want = lang;

  const fail = () => { if (box.dataset.want !== lang) return; el.classList.remove("load"); src.textContent = "ترجمه ممکن نشد؛ دوباره بزنید"; };
  gTranslate(el.dataset.orig, lang).then(done).catch(() =>
    sb.functions.invoke("translate", { body: { id: Number(id), lang } }).then(({ data }) => data?.text ? done(data.text) : fail()).catch(fail));
}

  <div class="lv tp"><small>تارگت 1</small><b class="num">${s.tp1!=null?fa(s.tp1):"—"}</b></div>
  <div class="lv tp"><small>تارگت 2</small><b class="num">${s.tp2!=null?fa(s.tp2):"—"}</b></div>
  <div class="lv sl"><small>حد ضرر</small><b class="num">${s.sl!=null?fa(s.sl):"—"}</b></div></div>`;
function hero(s){
  const b = s.type === "buy";
  const m = s.market || "xag", drip = m === "xau" || m === "xag";
  return `<div class="hero glass sw ${b?"buy":"sell"} rise ${s.id===freshId?"fresh":""}" style="--i:1"><span class="shine"></span>
    <div class="hh"><div class="side"><span class="arrow">${b?I.up:I.down}</span>${b?"خرید":"فروش"}</div>
      <span class="st ${esc(s.status)}">${STATUS[s.status]||""}</span></div>
    <div style="margin-top:10px">${symTag(m)}</div>
    <div class="entry">${b?"قیمت خرید":"قیمت فروش"} (${(MARKETS[m]||MARKETS.xag).unit})<b class="num">${range(s)}</b></div>
    ${lv(s)}
    ${resultHTML(s)}
    ${noteHTML(s)}
    ${s.voice_path?voiceHTML(s.voice_path):""}
    <div class="when">ثبت سیگنال: ${fmtFull(s.created_at)}</div></div>`;
}
function item(s, i){
  const b = s.type === "buy";
  const chip = s.status==="active" ? (b?"buy":"sell") : (s.status==="sl"?"sell":s.status.startsWith("tp")?"buy":"mute");
  return `<div class="it rise" data-id="${s.id}" style="--i:${i+2}">
    <div class="row"><span class="av ${b?"buy":"sell"}">${b?I.up:I.down}</span>
      <div><div class="t num">${b?"خرید":"فروش"} ${range(s)}</div><div class="s"><span class="ltr" style="font-family:Montserrat,Arial,sans-serif;font-size:10.5px;font-weight:700">${(MARKETS[s.market]||MARKETS.xag).sym}</span>${s.tp1!=null?` · هدف ${fa(s.tp1)}`:""}${s.sl!=null?` · ضرر ${fa(s.sl)}`:""}${s.voice_path?" · 🎙":""}</div></div>
      <div class="e"><span class="chip ${chip}">${STATUS[s.status]||""}</span><br>${fmtFull(s.created_at)}</div></div>
    <div class="more"><div>${lv(s)}${resultHTML(s)?`<div style="margin:0 12px 12px">${resultHTML(s)}</div>`:""}${s.note?`<div style="margin:0 12px 12px">${noteHTML(s)}</div>`:""}${s.voice_path?`<div style="margin:0 12px 12px">${voiceHTML(s.voice_path)}</div>`:""}</div></div></div>`;
}

let all = [], filter = "all";
function drawFeed(){
  const el = $("feed"); if (!el) return;
  const inM = all.filter(s => (s.market || "xag") === market);
  const list = filter === "all" ? inM : inM.filter(s => s.type === filter);
  const M = MARKETS[market];
  if (!list.length) { el.innerHTML = `<div class="empty glass rise"><div class="big"><img src="${M.th}" alt="" style="width:64px;height:64px;border-radius:18px;object-fit:cover;box-shadow:var(--raise)"></div><h2>${inM.length?"سیگنالی در این بخش نیست":"هنوز تحلیلی برای " + M.name + " منتشر نشده"}</h2><div>به‌محض انتشار، همین‌جا نمایش داده می‌شود.</div></div>`; return; }
  const [first, ...rest] = list;
  el.innerHTML = `<h3 class="rise">آخرین تحلیل</h3>${hero(first)}`
    + (rest.length ? `<h3 class="rise" style="--i:2">تحلیل‌های قبلی</h3><div class="list glass sw rise" style="--i:2;--sd:1.2s"><span class="shine"></span>${rest.map(item).join("")}</div>` : "");
  applyNoteLang(el);
}
/* به‌روزرسانی زنده */
const POLL = 8000;
let sig = null, topId = null, freshId = null, lastAt = 0, pollT = null, tickT = null, loading = false, failCount = 0, titleT = null;
let actx = null;
document.addEventListener("pointerdown", () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }, {once:false, passive:true});
function ding(){
  try { if (!actx) return; const t = actx.currentTime;
    [[880,0],[1320,.16]].forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.25, t + d + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + d + .45); o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + .5); });
  } catch {}
}
function banner(icon, title, sub){
  let b = $("banner");
  if (!b) { b = document.createElement("div"); b.id = "banner"; b.className = "banner glass"; document.body.appendChild(b);
    b.onclick = () => { b.classList.remove("show"); const nb = document.querySelector(".mk button.new"); if (nb) nb.click(); window.scrollTo({top: 0, behavior: "smooth"}); }; }
  b.innerHTML = `<span class="bi">${icon}</span><div><b>${title}</b><span>${sub}</span></div>`;
  requestAnimationFrame(() => b.classList.add("show"));
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("show"), 6000);
  try { navigator.vibrate && navigator.vibrate([220, 90, 220]); } catch {}
  ding();
  if (document.hidden) { const base = "Market Analysts"; let on = false; clearInterval(titleT);
    titleT = setInterval(() => { document.title = (on = !on) ? "🔔 " + title : base; }, 1000); }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { clearInterval(titleT); document.title = "Market Analysts"; if ($("feed")) loadFeed(); }
});
function liveUI(state){
  const lb = $("lb"); if (!lb) return;
  lb.classList.toggle("busy", state === "busy"); lb.classList.toggle("off", state === "off");
  lb.querySelector("b").textContent = state === "off" ? "قطع" : "زنده";
  const r = lb.querySelector(".ring"); r.classList.remove("run");
  if (state === "idle") { void r.getBoundingClientRect(); r.classList.add("run"); }
  tickLabel();
}
function tickLabel(){
  const el = $("lbt"); if (!el) return;
  const lb = $("lb");
  if (lb.classList.contains("busy")) return el.textContent = "· در حال به‌روزرسانی";
  if (lb.classList.contains("off")) return el.textContent = "· تلاش دوباره…";
  el.textContent = "";
}
async function loadFeed(){
  if (loading) return; loading = true; liveUI("busy");
  const started = Date.now();
  const { data, error } = await sb.from("signals").select("*").order("created_at",{ascending:false}).limit(40);
  await new Promise(r => setTimeout(r, Math.max(0, 450 - (Date.now() - started))));
  loading = false;
  if (error) { failCount++; liveUI("off"); if (failCount > 3) renderMsg("⚠️", "دسترسی ممکن نیست", esc(CONTACT)); return; }
  failCount = 0; lastAt = Date.now();
  const list = data || [];
  const nsig = list.map(x => x.id + ":" + (x.market || "") + ":" + Object.keys(x.translations || {}).join("") + ":" + x.status + ":" + (x.result_at || "") + ":" + (x.note || "").length + ":" + (x.voice_path || "")).join("|");
  if (sig !== null && list[0] && list[0].id !== topId && !all.some(x => x.id === list[0].id)) {
    const n = list[0], b = n.type === "buy", nm = n.market || "xag";
    freshId = n.id;
    if (nm !== market) document.querySelector(`.mk button[data-m="${nm}"]`)?.classList.add("new");
    banner("🔔", `${MARKETS[nm].name} (${MARKETS[nm].sym}): ${b ? "خرید" : "فروش"} ${range(n)}`, `${n.tp1 != null ? "تارگت " + fa(n.tp1) : ""}${n.sl != null ? " · حد ضرر " + fa(n.sl) : ""} — برای دیدن بزنید`);
  } else if (sig !== null && nsig !== sig) {
    const ch = list.find(x => { const o = all.find(y => y.id === x.id); return o && o.status !== x.status; });
    if (ch) banner("📣", `وضعیت سیگنال: ${STATUS[ch.status]}`, `${ch.type === "buy" ? "خرید" : "فروش"} ${range(ch)}`);
  }
  topId = list[0]?.id ?? null;
  if (nsig !== sig) {
    const open = [...document.querySelectorAll(".it.open")].map(e => e.dataset.id);
    all = list; sig = nsig; drawFeed();
    open.forEach(id => document.querySelector(`.it[data-id="${id}"]`)?.classList.add("open"));
    setTimeout(() => { freshId = null; }, 4000);
  }
  liveUI("idle");
}
function startPolling(){
  clearInterval(pollT); clearInterval(tickT);
  pollT = setInterval(() => { if (!document.hidden) loadFeed(); }, POLL);
  tickT = setInterval(tickLabel, 1000);
}

function renderFeed(me){
  const strip = { txt: "", warn: false };
  if (me.role !== "admin") {
    const days = Math.ceil((new Date(me.expires_at) - Date.now()) / DAY);
    strip.txt = `اشتراک: <b class="num">${fa(days)}</b> روز`; strip.warn = days <= 5;
  }
  $app.innerHTML = topbar() + `
    <div class="mk rise" style="--i:1"><span class="mkpill" id="mkp"></span>${Object.entries(MARKETS).map(([k, v]) => `<button data-m="${k}" class="${k===market?"on":""}"><span class="dot"></span>${k==="usd"?`<span class="dual"><img src="${v.th}" alt=""><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/1000_Afghanis_%282022_-_top%29.jpg/960px-1000_Afghanis_%282022_-_top%29.jpg" alt=""></span>`:`<img src="${v.th}" alt="">`}<span class="t2"><b>${v.name}</b><small>${v.sym}</small></span></button>`).join("")}</div>
    <div class="status-line ${strip.warn?"warn":""}" id="lb"><span class="lv2"><span class="ldot"></span><b>زنده</b><span class="lbt" id="lbt">در حال دریافت…</span></span><span class="subtxt">${strip.txt}</span>
      <svg class="ring" viewBox="0 0 24 24" style="display:none"><circle class="bg" cx="12" cy="12" r="10"/><circle class="fg" cx="12" cy="12" r="10"/></svg></div>
    <div id="feed"><div class="sk"></div><div class="sk" style="height:180px"></div></div>
    <div class="disc">این تحلیل‌ها نظر کارشناسی است و تضمین سود نیست؛ مسئولیت هر معامله با خود شماست.</div>`;
  bindTop();
  document.querySelectorAll(".seg button").forEach((b, i) => b.onclick = () => { /* removed */
    filter = b.dataset.f;
    document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
    $("pill").style.transform = `translateX(${-i * 100}%)`;
    drawFeed();
  });
  document.querySelectorAll(".mk button").forEach(b => b.onclick = () => {
    if (b.dataset.m === market) return;
    market = b.dataset.m; try { localStorage.setItem("mk", market); } catch {}
    document.querySelectorAll(".mk button").forEach(x => x.classList.toggle("on", x === b)); b.classList.remove("new");
    movePill();
    applyMarket(); drawFeed();
  });
  const movePill = () => { const i = Object.keys(MARKETS).indexOf(market); $("mkp").style.transform = `translateX(${-i * 100}%)`; };
  movePill();
  applyMarket();
  $("feed").onclick = e => { if (e.target.closest(".vp,.trbar")) return; const it = e.target.closest(".it"); if (it) it.classList.toggle("open"); };
  stopLive();
  sig = null; topId = null; all = [];
  loadFeed(); startPolling();
  $("lb").onclick = () => loadFeed();
  channel = sb.channel("feed").on("postgres_changes", {event:"*", schema:"public", table:"signals"}, () => loadFeed()).subscribe();
}

async function route(session){
  stopLive();
  if (!session) return renderLogin();
  const { data: me, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) return renderMsg("📡", "خطا در اتصال", "لطفاً صفحه را دوباره باز کنید.");
  if (!me) return renderMsg("🔒", "حساب فعال نیست", esc(CONTACT));
  if (me.role === "admin") return renderFeed(me);
  if (me.disabled) return renderMsg("⛔", "حساب شما غیرفعال است", esc(CONTACT));
  if (!me.expires_at || new Date(me.expires_at) < Date.now())
    return renderMsg("⏳", "اشتراک شما تمام شده است", `${me.expires_at ? "تاریخ پایان: " + fmtDate(me.expires_at) + "<br>" : ""}${esc(CONTACT)}`);
  renderFeed(me);
}
let lastUid;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session?.user?.id ?? null;
  if (event === "TOKEN_REFRESHED" && uid === lastUid) return;
  lastUid = uid;
  setTimeout(() => route(session), 0);
});
</script>
</body>
</html>
