<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8ebf0">
<title>Market Analysts</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Market Analysts">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ===== رنگ‌ها: روشن ===== */
  :root{
    --bg:#eef2f0; --text:#0f1512; --muted:#5f6b65; --soft:#8a958f;
    --gl:linear-gradient(160deg,rgba(255,255,255,.92),rgba(244,248,246,.78));
    --tile:linear-gradient(145deg,#ffffff,#eef2f0);
    --line:rgba(20,40,30,.09); --stroke:rgba(255,255,255,.85); --field:rgba(255,255,255,.8);
    --sh:0 18px 40px -16px rgba(20,45,30,.28),0 4px 12px -6px rgba(20,45,30,.12),inset 0 1px 0 #fff;
    --raise:5px 7px 14px rgba(40,70,52,.14),-4px -4px 10px rgba(255,255,255,.9),inset 0 1px 0 #fff;
    --sh-in:inset 2px 3px 7px rgba(40,70,52,.12),inset -2px -2px 6px rgba(255,255,255,.9);
    --buy:#0f9d58; --buy-bg:rgba(15,157,88,.12); --sell:#e5484d; --sell-bg:rgba(229,72,77,.12); --amber:#c98a12;
    --ov:linear-gradient(180deg,rgba(240,244,242,.42),rgba(236,241,238,.72));
    --a1:#f9e3a0; --a2:#d4a53b; --a3:#93650f; --aText:#2a1c03; --brand:#b8861f; --beam:#e2b44c;
  }
  /* ===== رنگ‌ها: تاریک ===== */
  :root[data-theme="dark"]{
    --bg:#0b0f14; --text:#edf1f6; --muted:#9aa5b3; --soft:#6f7a88;
    --gl:linear-gradient(160deg,rgba(28,35,47,.86),rgba(18,23,32,.80));
    --tile:linear-gradient(145deg,#1d2532,#151b25);
    --line:rgba(255,255,255,.07); --stroke:rgba(255,255,255,.07); --field:rgba(255,255,255,.05);
    --sh:0 18px 40px -16px rgba(0,0,0,.7),0 4px 12px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
    --raise:0 6px 14px -4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
    --sh-in:inset 0 2px 6px rgba(0,0,0,.45);
    --buy:#34d17f; --buy-bg:rgba(52,209,127,.14); --sell:#ff6b70; --sell-bg:rgba(255,107,112,.14); --amber:#f0b44a;
    --ov:linear-gradient(180deg,rgba(8,11,16,.55),rgba(8,11,16,.82));
  }
  :root[data-market="xau"]{--a1:#f9e3a0;--a2:#d4a53b;--a3:#93650f;--aText:#2a1c03;--brand:#b8861f;--beam:#e2b44c}
  :root[data-market="xag"]{--a1:#ffffff;--a2:#c3cad3;--a3:#7f8894;--aText:#161b21;--brand:#6c7684;--beam:#8e98a6}
  :root[data-market="usd"]{--a1:#7cd8a6;--a2:#2f8a5b;--a3:#1b5a39;--aText:#ffffff;--brand:#2f8a5b;--beam:#34b874}
  :root[data-theme="dark"][data-market="xau"]{--brand:#e2b85a;--beam:#f0c463}
  :root[data-theme="dark"][data-market="xag"]{--brand:#c6ced8;--beam:#dfe5ec}
  :root[data-theme="dark"][data-market="usd"]{--brand:#5fcf93;--beam:#5fdc9c}
  :root[data-market="xau"]:not([data-theme="dark"]){--ov:linear-gradient(180deg,rgba(252,246,232,.35),rgba(246,240,226,.68))}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:var(--bg)}
  body{color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:color .4s}
  .num{font-variant-numeric:tabular-nums}
  .ltr{direction:ltr;unicode-bidi:isolate}

  /* ===== پس‌زمینه‌ی تمام‌صفحه، بلر و متحرک ===== */
  .mbg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
  .mbg i{position:absolute;inset:-10%;background-size:cover;background-position:center;opacity:0;filter:blur(12px) saturate(1.15);transition:opacity 1.2s cubic-bezier(.16,1,.3,1);animation:kb 28s ease-in-out infinite alternate}
  .mbg i[data-m="xau"]{background-image:url(img/bg-xau.webp)}
  .mbg i[data-m="xag"]{background-image:url(img/bg-xag.webp);animation-duration:32s}
  .mbg i[data-m="usd"]{background:url(https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/1000_Afghanis_%282022_-_top%29.jpg/960px-1000_Afghanis_%282022_-_top%29.jpg) center 78%/150% auto no-repeat,url(img/bg-usd.webp) center 22%/150% auto no-repeat,#cfe0d8;animation-duration:36s}
  .mbg i.on{opacity:1}
  .mbg b{position:absolute;inset:0;background:var(--ov);transition:background .8s}
  @keyframes kb{0%{transform:scale(1.06) translate(0,0)}50%{transform:scale(1.16) translate(-3%,2%) rotate(1deg)}100%{transform:scale(1.1) translate(2%,-2%) rotate(-1deg)}}

  .app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
  .glass{background:var(--gl);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--stroke);box-shadow:var(--sh)}

  /* ===== نور گردان دور شکل‌ها ===== */
  @property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
  .glow{position:relative}
  .glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;
    background:conic-gradient(from var(--ang),transparent 0deg,transparent 250deg,color-mix(in srgb,var(--beam) 35%,transparent) 300deg,var(--beam) 340deg,transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
    opacity:.75;animation:beam var(--bd,7s) linear infinite;animation-delay:var(--bdl,0s)}
  @keyframes beam{to{--ang:360deg}}

  /* ===== حرکت ===== */
  .rise{opacity:0;transform:translateY(18px);animation:rise .85s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0) * 70ms)}
  @keyframes rise{to{opacity:1;transform:none}}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .8s cubic-bezier(.16,1,.3,1) forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(3.2);opacity:0}}
  @keyframes pulse{0%{box-shadow:0 0 0 0 var(--pc,rgba(15,157,88,.45))}70%{box-shadow:0 0 0 9px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
  @keyframes rot{to{transform:rotate(360deg)}}
  @keyframes shim{to{background-position:-150% 0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}

  /* ===== دکمه‌ها ===== */
  .cta{position:relative;overflow:hidden;width:100%;height:58px;border:0;border-radius:20px;cursor:pointer;font-family:inherit;font-size:17px;font-weight:800;color:var(--aText);
    background:linear-gradient(180deg,var(--a1) 0%,var(--a2) 50%,var(--a3) 100%);
    box-shadow:0 16px 28px -10px var(--a2),0 4px 0 var(--a3),inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 6px rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .15s}
  .cta:active{transform:translateY(3px);box-shadow:0 8px 16px -10px var(--a2),0 1px 0 var(--a3),inset 0 2px 0 rgba(255,255,255,.45)}
  .cta:disabled{opacity:.75}
  .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(0,0,0,.15);border-top-color:currentColor;animation:rot .7s linear infinite}
  .ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:13px;border:1px solid var(--stroke);background:var(--tile);box-shadow:var(--raise);display:grid;place-items:center;cursor:pointer;color:var(--text);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
  .ib:active{transform:scale(.92)}
  .ib svg{width:19px;height:19px}

  /* ===== سربرگ ===== */
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 12px}
  .brand{display:flex;align-items:center;gap:11px}
  .lgo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tile);box-shadow:var(--raise);border:1px solid var(--stroke)}
  .lgo img{width:30px;height:30px}
  :root[data-theme="dark"] .lgo img,:root[data-theme="dark"] .logo img{filter:invert(1) hue-rotate(180deg)}
  .wm{display:flex;flex-direction:column;line-height:1.05}
  .wm b{font-family:Montserrat,Arial,sans-serif;font-weight:600;letter-spacing:2.5px;font-size:15px;direction:ltr;text-align:start;border-bottom:1.5px solid currentColor;padding-bottom:2px}
  .wm small{font-family:Montserrat,Arial,sans-serif;letter-spacing:5px;font-size:8.5px;font-weight:600;direction:ltr;text-align:start;margin-top:2px;color:var(--muted)}
  .icons{display:flex;gap:8px;position:relative}

  .langs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--field);box-shadow:var(--sh-in)}
  .langs button{position:relative;overflow:hidden;border:0;background:none;border-radius:12px;padding:8px 4px;font-family:inherit;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;transition:all .35s cubic-bezier(.16,1,.3,1)}
  .langs button.on{background:var(--tile);color:var(--text);box-shadow:var(--raise)}
  .pop{position:absolute;top:48px;inset-inline-end:0;z-index:40;width:230px;padding:8px;border-radius:18px;opacity:0;transform:translateY(-8px) scale(.96);pointer-events:none;transition:all .4s cubic-bezier(.16,1,.3,1)}
  .pop.show{opacity:1;transform:none;pointer-events:auto}

  /* ===== بازارها ===== */
  .mk{display:flex;gap:8px;margin:0 0 14px;align-items:stretch}
  .mk button{position:relative;flex:1 1 0;min-width:0;border:1px solid var(--stroke);border-radius:20px;padding:9px 6px;cursor:pointer;font-family:inherit;color:var(--text);
    background:var(--gl);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--sh);
    display:flex;align-items:center;justify-content:center;gap:8px;opacity:.8;
    transition:flex-grow .6s cubic-bezier(.34,1.3,.5,1),padding .5s,opacity .4s}
  .mk button img{width:30px;height:30px;border-radius:10px;object-fit:cover;flex:none;box-shadow:0 4px 10px -4px rgba(0,0,0,.45);transition:all .55s cubic-bezier(.34,1.4,.5,1)}
  .mk .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;min-width:0}
  .mk b{font-size:13px;font-weight:900;white-space:nowrap;transition:font-size .4s}
  .mk small{font-family:Montserrat,Arial,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.4px;color:var(--muted);direction:ltr;white-space:nowrap}
  .mk button.on{flex-grow:1.9;opacity:1;padding:14px 10px}
  .mk button.on img{width:46px;height:46px;border-radius:14px}
  .mk button.on b{font-size:16px}
  .mk button:not(.on) small{display:none}
  .mk button:not(.on).glow::before{display:none}
  .mk .dual{position:relative;width:34px;height:30px;flex:none;transition:all .5s}
  .mk .dual img{position:absolute;width:26px!important;height:19px!important;border-radius:5px!important}
  .mk .dual img:first-child{top:0;inset-inline-end:0;transform:rotate(6deg)} .mk .dual img:last-child{bottom:0;inset-inline-start:0;transform:rotate(-6deg)}
  .mk button.on .dual{width:50px;height:44px} .mk button.on .dual img{width:38px!important;height:27px!important}
  .mk .dot{position:absolute;top:7px;inset-inline-start:7px;width:9px;height:9px;border-radius:50%;background:var(--sell);--pc:rgba(229,72,77,.5);animation:pulse 1.6s infinite;display:none}
  .mk button.new .dot{display:block}

  .sline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 6px 14px;font-size:12px;color:var(--muted)}
  .sline .lv2{display:flex;align-items:center;gap:7px;cursor:pointer}
  .sline .lv2 b{color:var(--buy);font-weight:800}
  .ldot{width:8px;height:8px;border-radius:50%;background:var(--buy);--pc:rgba(15,157,88,.45);animation:pulse 2s infinite;flex:none}
  .sline.busy .ldot{background:var(--brand)}
  .sline.off .ldot{background:var(--sell);animation:none} .sline.off .lv2 b{color:var(--sell)}
  .sline .subtxt b{color:var(--text)}
  .sline.warn .subtxt,.sline.warn .subtxt b{color:var(--amber)}

  .offline{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px;margin-bottom:16px;animation:rise .6s cubic-bezier(.16,1,.3,1)}
  .offline .oi{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--sell-bg);color:var(--sell)}
  .offline .oi svg{width:22px;height:22px}
  .offline b{display:block;font-size:15px}
  .offline span{font-size:12.5px;color:var(--muted)}

  h3{font-size:12.5px;color:var(--muted);font-weight:700;margin:4px 6px 10px}

  /* ===== کارت اصلی ===== */
  .hero{position:relative;border-radius:28px;padding:18px;margin-bottom:24px;animation:rise .85s cubic-bezier(.16,1,.3,1) forwards,drift 10s ease-in-out 1s infinite}
  .hero.buy{--c:var(--buy);--cb:var(--buy-bg)} .hero.sell{--c:var(--sell);--cb:var(--sell-bg)}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .hero .shine{position:absolute;inset:0;pointer-events:none;border-radius:inherit;overflow:hidden}
  .hero .shine::after{content:"";position:absolute;top:-60%;height:220%;width:55%;left:0;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 65%);opacity:0;animation:arc 7s cubic-bezier(.45,.05,.55,.95) infinite}
  :root[data-theme="dark"] .hero .shine::after{background:radial-gradient(ellipse,rgba(255,255,255,.07),transparent 65%)}
  @keyframes arc{0%{transform:translate(-80%,30%) rotate(-25deg);opacity:0}15%{opacity:1}50%{transform:translate(120%,8%) rotate(10deg)}75%{opacity:1}90%,100%{transform:translate(260%,20%) rotate(30deg);opacity:0}}
  .hero.fresh{animation:rise .85s cubic-bezier(.16,1,.3,1) forwards,fresh 1.2s ease-out 3}
  @keyframes fresh{0%{box-shadow:var(--sh),0 0 0 0 var(--beam)}60%{box-shadow:var(--sh),0 0 0 14px rgba(0,0,0,0)}}
  .hh{display:flex;align-items:center;justify-content:space-between}
  .side{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;color:var(--c)}
  .arrow{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--cb);color:var(--c)}
  .arrow svg{width:22px;height:22px}
  .chip{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--field);color:var(--muted);white-space:nowrap}
  .chip.active{background:var(--cb,var(--buy-bg));color:var(--c,var(--buy))}
  .chip.win{background:var(--buy-bg);color:var(--buy)} .chip.lose{background:var(--sell-bg);color:var(--sell)}
  .entry{margin:16px 2px 2px;color:var(--muted);font-size:13px}
  .entry b{display:block;font-size:34px;font-weight:900;color:var(--text);line-height:1.3;letter-spacing:-.3px;text-align:start}
  .lvls{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-radius:18px;background:var(--field);box-shadow:var(--sh-in)}
  .lv{text-align:center;padding:11px 6px}
  .lv+.lv{border-inline-start:1px solid var(--line)}
  .lv small{display:block;font-size:11px;color:var(--muted)}
  .lv b{font-size:18px;font-weight:800}
  .lv.tp b{color:var(--buy)} .lv.sl b{color:var(--sell)}
  .res{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:18px}
  .res .ri{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900}
  .res b{display:block;font-size:15px;font-weight:900}
  .res small{font-size:12px;color:var(--muted)}
  .res.win{background:var(--buy-bg)} .res.win b{color:var(--buy)} .res.win .ri{background:linear-gradient(180deg,#34d896,#0b8a4c)}
  .res.lose{background:var(--sell-bg)} .res.lose b{color:var(--sell)} .res.lose .ri{background:linear-gradient(180deg,#ff7a7e,#c93036)}
  .res.neutral{background:var(--field)} .res.neutral .ri{background:linear-gradient(180deg,#9aa4bd,#6b7593)}
  .note{margin-top:14px;padding:10px 12px 12px;border-radius:18px;background:var(--field);border:1px solid var(--line)}
  .trbar{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;margin-bottom:10px;border-radius:14px;background:var(--field);box-shadow:var(--sh-in)}
  .trbar .tp{position:absolute;top:4px;bottom:4px;inset-inline-start:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--tile);box-shadow:var(--raise);transition:transform .6s cubic-bezier(.34,1.45,.5,1)}
  .trbar button{position:relative;z-index:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:6px 0;cursor:pointer;transition:color .3s}
  .trbar button.on{color:var(--text)}
  .ntext{white-space:pre-wrap;font-size:14.5px;line-height:1.9;transition:opacity .35s,transform .45s cubic-bezier(.16,1,.3,1),filter .35s}
  .ntext.fade{opacity:0;transform:translateY(6px);filter:blur(3px)}
  .ntext[dir="ltr"]{text-align:left}
  .ntext.load{color:transparent!important;border-radius:10px;background:linear-gradient(100deg,var(--field) 30%,rgba(120,130,160,.22) 50%,var(--field) 70%);background-size:300% 100%;animation:shim 1.2s infinite}
  .trsrc{display:block;margin-top:6px;font-size:11px;color:var(--soft)}
  .when{margin-top:12px;font-size:12px;color:var(--soft);text-align:center}

  .vp{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:18px;background:var(--field);border:1px solid var(--line)}
  .vplay{position:relative;overflow:hidden;flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:var(--aText);background:linear-gradient(180deg,var(--a1),var(--a2) 55%,var(--a3));box-shadow:0 8px 16px -8px var(--a2),inset 0 2px 0 rgba(255,255,255,.5);display:grid;place-items:center;transition:transform .2s}
  .vplay:active{transform:scale(.9)}
  .vplay svg{width:18px;height:18px}
  .vwave{flex:1;height:34px;display:flex;align-items:center;gap:3px;direction:ltr;cursor:pointer}
  .vwave i{flex:1;border-radius:3px;background:rgba(120,130,160,.35)}
  .vwave i.on{background:var(--brand)}
  .vt{font-size:12px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

  .list{border-radius:24px;padding:4px}
  .it{position:relative;overflow:hidden;border-radius:18px;cursor:pointer;transition:background .35s}
  .it.open{background:var(--field)}
  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 10px}
  .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
  .av svg{width:19px;height:19px}
  .av.buy{background:var(--buy-bg);color:var(--buy)} .av.sell{background:var(--sell-bg);color:var(--sell)}
  .row .t{font-weight:800;font-size:15px}
  .row .s{font-size:12px;color:var(--muted)}
  .row .e{text-align:end;font-size:11px;color:var(--soft)}
  .more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s cubic-bezier(.16,1,.3,1)}
  .it.open .more{grid-template-rows:1fr}
  .more>div{overflow:hidden;padding:0 10px}
  .more>div>*:last-child{margin-bottom:12px}

  .empty,.msg{text-align:center;padding:36px 20px;border-radius:26px;color:var(--muted)}
  .empty img{width:64px;height:64px;border-radius:18px;object-fit:cover;box-shadow:var(--raise)}
  .empty h2,.msg h2{color:var(--text);font-size:18px;margin:8px 0 4px}
  .msg .big{font-size:40px}
  .sk{border-radius:26px;height:250px;margin-bottom:22px;background:linear-gradient(100deg,var(--field) 30%,rgba(120,130,160,.18) 50%,var(--field) 70%);background-size:300% 100%;animation:shim 1.4s infinite}
  .disc{text-align:center;color:var(--soft);font-size:11px;margin:20px 10px 0}

  .banner{position:fixed;z-index:80;top:calc(12px + env(safe-area-inset-top));left:50%;width:min(428px,calc(100% - 24px));transform:translate(-50%,-150%);transition:transform .7s cubic-bezier(.34,1.4,.5,1);display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;cursor:pointer}
  .banner.show{transform:translate(-50%,0)}
  .banner .bi{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:21px;background:linear-gradient(180deg,var(--a1),var(--a2) 55%,var(--a3));animation:bell 1s ease-in-out 2}
  @keyframes bell{20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
  .banner b{display:block;font-size:14.5px}
  .banner span{font-size:12px;color:var(--muted)}

  /* ===== ورود ===== */
  .login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 4px}
  .logo{width:120px;height:120px;margin:0 auto 18px;border-radius:36px;display:grid;place-items:center}
  .logo img{width:84px;height:84px;animation:bob 5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  .bigwm{text-align:center;margin:0 0 4px}
  .bigwm b{display:inline-block;font-family:Montserrat,Arial,sans-serif;font-weight:600;letter-spacing:7px;font-size:25px;border-bottom:2px solid currentColor;padding:0 0 4px 7px;direction:ltr}
  .bigwm small{display:block;font-family:Montserrat,Arial,sans-serif;letter-spacing:11px;font-size:12.5px;font-weight:600;margin-top:4px;padding-left:11px;direction:ltr;color:var(--muted)}
  .login h1{text-align:center;font-size:22px;font-weight:900;margin:14px 0 0}
  .login .tag{text-align:center;color:var(--muted);font-size:13.5px;margin:2px 0 20px}
  .login .langs{margin-bottom:14px}
  .field{display:flex;align-items:center;gap:10px;padding:0 16px;height:58px;border-radius:20px;margin-bottom:12px;transition:box-shadow .3s,border-color .3s}
  .field:focus-within{border-color:var(--brand)}
  .field svg{width:21px;height:21px;color:var(--soft);flex:none}
  .field input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-family:inherit;font-size:16px;color:var(--text);direction:ltr;text-align:start}
  :root[dir="rtl"] .field input{text-align:right}
  .field input::placeholder{color:var(--soft)}
  .eye{background:none;border:0;padding:4px;cursor:pointer;color:var(--soft);display:grid}
  .err{min-height:24px;text-align:center;color:var(--sell);font-size:13px;margin-top:10px}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .foot{text-align:center;color:var(--soft);font-size:11px;margin-top:26px}

  /* ===== گفتگو با استاد ===== */
  .fab{position:fixed;z-index:50;width:62px;height:62px;border-radius:50%;border:0;cursor:grab;touch-action:none;display:grid;place-items:center;color:var(--aText);
    background:linear-gradient(180deg,var(--a1),var(--a2) 55%,var(--a3));box-shadow:0 18px 30px -10px rgba(0,0,0,.45),0 4px 0 var(--a3),inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),left .55s cubic-bezier(.34,1.3,.5,1);user-select:none;-webkit-user-select:none}
  .fab.drag{cursor:grabbing;transform:scale(1.1)}
  .fab svg{width:27px;height:27px}
  .fab .badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--sell);color:#fff;font-size:12px;font-weight:800;display:none;place-items:center;font-family:Montserrat,Arial,sans-serif;box-shadow:0 0 0 3px var(--bg)}
  .fab .badge.show{display:grid;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .chat{position:fixed;z-index:70;left:50%;bottom:0;width:100%;max-width:460px;height:min(640px,88vh);transform:translate(-50%,105%);transition:transform .65s cubic-bezier(.16,1,.3,1);border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--stroke);box-shadow:0 -10px 40px rgba(0,0,0,.25);background:linear-gradient(160deg,rgba(255,255,255,.98),rgba(244,248,246,.98))}
  :root[data-theme="dark"] .chat{background:linear-gradient(160deg,rgba(24,30,41,.98),rgba(16,20,28,.98))}
  .chat.show{transform:translate(-50%,0)}
  .cveil{position:fixed;inset:0;z-index:65;background:rgba(10,15,20,.35);opacity:0;pointer-events:none;transition:opacity .45s}
  .cveil.show{opacity:1;pointer-events:auto}
  .chead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .pp{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:none;background:linear-gradient(180deg,var(--a1),var(--a3));display:grid;place-items:center;color:var(--aText);font-weight:900;box-shadow:var(--raise)}
  .chead b{display:block;font-size:15px}
  .chead small{font-size:12px;color:var(--muted)}
  .chead .x{margin-inline-start:auto}
  .cbody{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px}
  .bub{max-width:80%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word;animation:rise .45s cubic-bezier(.16,1,.3,1) forwards;opacity:0}
  .bub small{display:block;font-size:10.5px;opacity:.75;margin-top:2px}
  .bub.me{align-self:flex-start;background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--aText);border-end-start-radius:6px}
  .bub.him{align-self:flex-end;background:var(--field);border:1px solid var(--line);border-end-end-radius:6px}
  .cstate{text-align:center;font-size:12px;color:var(--muted);padding:4px 0 2px}
  .cstate.wait{color:var(--amber)} .cstate.seen{color:var(--buy)}
  .cfoot{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  .cfoot textarea{flex:1;resize:none;height:46px;max-height:120px;padding:11px 14px;border-radius:16px;border:1px solid var(--line);background:var(--field);color:var(--text);font-family:inherit;font-size:15px;outline:none}
  .cfoot .send{width:46px;height:46px;flex:none;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:var(--aText);background:linear-gradient(180deg,var(--a1),var(--a2) 55%,var(--a3));box-shadow:0 8px 16px -8px var(--a2)}
  .cfoot .send svg{width:20px;height:20px}
  :root[dir="rtl"] .cfoot .send svg{transform:scaleX(-1)}
  .cempty{margin:auto;text-align:center;color:var(--muted);font-size:13px;padding:20px}

  /* خوانایی متن روی پس‌زمینه */
  :root{--ts:0 1px 1px rgba(255,255,255,.75),0 0 8px rgba(255,255,255,.45)}
  :root[data-theme="dark"]{--ts:0 1px 2px rgba(0,0,0,.8),0 0 14px rgba(0,0,0,.6)}
  h3,.wm,.disc,.foot,.bigwm,.login h1,.login .tag{text-shadow:var(--ts)}
  h3{color:var(--text);opacity:.8}
  .sline{display:flex;width:fit-content;max-width:100%;margin:0 auto 14px;padding:6px 14px;border-radius:999px;gap:14px;background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--stroke);box-shadow:var(--raise)}
  .chat{visibility:hidden;transition:transform .65s cubic-bezier(.16,1,.3,1),visibility 0s .65s}
  .chat.show{visibility:visible;transition:transform .65s cubic-bezier(.16,1,.3,1),visibility 0s 0s}
  .top{position:relative;z-index:30}
  .pop{z-index:60;background:linear-gradient(145deg,#ffffff,#f1f5f3)!important;box-shadow:0 20px 40px -12px rgba(0,0,0,.35)!important}
  :root[data-theme="dark"] .pop{background:linear-gradient(145deg,#1f2734,#161c26)!important}
  .fablab{position:fixed;z-index:49;padding:7px 13px;border-radius:14px;font-size:13px;font-weight:800;white-space:nowrap;color:var(--text);background:var(--tile);box-shadow:var(--sh);border:1px solid var(--stroke);opacity:0;transform:scale(.85);transition:opacity .5s,transform .6s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
  .fablab.show{opacity:1;transform:none}
  .ib .hb{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sell);color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;font-family:Montserrat,Arial,sans-serif}
  .ib .hb.show{display:grid}
  .top .ib{overflow:visible}
  /* ===== رسانه در گفتگو ===== */
  .cimg{min-width:140px;min-height:100px;display:grid;place-items:center;border-radius:14px;overflow:hidden;margin:-2px -6px 2px;cursor:zoom-in}
  .cimg img{display:block;max-width:230px;max-height:280px;width:100%;object-fit:cover;border-radius:14px}
  .cload{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(127,127,127,.3);border-top-color:currentColor;animation:rot .8s linear infinite}
  .bub .vp{margin:0 -4px 2px;min-width:220px;background:rgba(255,255,255,.35);border:0}
  .iview{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:grid;place-items:center;opacity:0;transition:opacity .35s;cursor:zoom-out}
  .iview.show{opacity:1}
  .iview img{max-width:96vw;max-height:90vh;border-radius:12px;transform:scale(.92);transition:transform .45s cubic-bezier(.16,1,.3,1)}
  .iview.show img{transform:none}
  .ctool{width:42px;height:46px;flex:none;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);border-radius:14px}
  .ctool svg{width:22px;height:22px}
  .ctool input{display:none}
  .recbar{flex:1;display:none;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:16px;background:rgba(229,72,77,.1);color:#e5484d;font-weight:800;font-size:14px}
  .recbar i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:recp 1s ease-in-out infinite}
  @keyframes recp{50%{opacity:.25}}
  .recbar .rx{margin-inline-start:auto;border:0;background:none;color:inherit;font-family:inherit;font-weight:800;cursor:pointer}
  .cfoot.recording textarea,.cfoot.recording .ctool{display:none}
  .cfoot.recording .recbar{display:flex}
  .upl{opacity:.6}
  .nolink{display:block;margin:18px auto 0;border:0;background:none;cursor:pointer;font-family:inherit;font-size:13px;color:var(--muted);text-shadow:var(--ts)}
  .nolink b{color:var(--text)}

  /* ===== حالت اپ اندروید: سبک و روان ===== */
  html.app .glass,html.app .mk button,html.app .sline,html.app .pop{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  html.app .glass,html.app .mk button,html.app .sline{background:var(--tile)!important}
  html.app .mbg i{filter:blur(8px)!important;animation:none!important;transform:scale(1.08)}
  html.app .hero{animation:rise .6s cubic-bezier(.16,1,.3,1) forwards!important}
  html.app .hero .shine,html.app .blob,html.app .shine{display:none!important}
  html.app .glow:not(.hero):not(.on)::before{display:none}
  html.app .sw>.shine{display:none}
  html.app *{-webkit-tap-highlight-color:transparent}
  html.app body{overscroll-behavior:none}

  /* ===== ناوبری پایین ===== */
  .bnav{position:fixed;z-index:45;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(440px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:24px;background:var(--tile);border:1px solid var(--stroke);box-shadow:0 18px 40px -14px rgba(0,0,0,.4)}
  .bnav button{position:relative;border:0;background:none;cursor:pointer;font-family:inherit;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:18px;font-size:11px;font-weight:800;transition:color .3s,background .4s}
  .bnav button span{font-size:19px;line-height:1;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
  .bnav button.on{color:var(--aText);background:linear-gradient(180deg,var(--a1),var(--a2) 60%,var(--a3))}
  .bnav button.on span{transform:translateY(-2px) scale(1.12)}
  .app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
  .fab{bottom:auto}
  #pg{animation:rise .5s cubic-bezier(.16,1,.3,1)}

  /* ===== نوار فیلتر و آمار ===== */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 0 8px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;border:1px solid var(--stroke);border-radius:14px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--muted);background:var(--tile);box-shadow:var(--raise);cursor:pointer;transition:all .35s}
  .chips button.on{color:var(--aText);background:linear-gradient(180deg,var(--a1),var(--a2) 60%,var(--a3));border-color:transparent}
  .chips select{flex:none;border:1px solid var(--stroke);border-radius:14px;padding:7px 10px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--text);background:var(--tile)}
  .stats{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:14px;border-radius:24px;margin-bottom:16px}
  .ring{width:86px;height:86px;position:relative}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:9;stroke-linecap:round}
  .ring .bg{stroke:var(--field)} .ring .fg{stroke:var(--buy);transition:stroke-dashoffset 1.2s cubic-bezier(.16,1,.3,1)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px;font-weight:900;font-family:Montserrat,Arial,sans-serif}
  .ring small{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted)}
  .sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .sgrid div{text-align:center;padding:6px 2px;border-radius:14px;background:var(--field)}
  .sgrid small{display:block;font-size:10.5px;color:var(--muted)}
  .sgrid b{font-size:17px;font-weight:900;font-family:Montserrat,Arial,sans-serif}
  .sgrid .w b{color:var(--buy)} .sgrid .l b{color:var(--sell)}
  .pnl{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .pnl b{font-family:Montserrat,Arial,sans-serif;font-size:14px}
  .pnl .pos{color:var(--buy)} .pnl .neg{color:var(--sell)}
  .sharebtn{border:0;border-radius:12px;padding:7px 12px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;color:var(--aText);background:linear-gradient(180deg,var(--a1),var(--a2) 60%,var(--a3))}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag2{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--field);color:var(--muted);font-family:Montserrat,Vazirmatn,Arial,sans-serif}
  .tag2.rr{color:var(--text)}
  .lvls.n4{grid-template-columns:repeat(4,1fr)} .lvls.n4 .lv b{font-size:16px}
  .stars{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:12px}
  .stars button{border:0;background:none;font-size:22px;cursor:pointer;color:rgba(127,127,127,.35);padding:0 1px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),color .2s}
  .stars button.on{color:#f2b630} .stars button:active{transform:scale(1.3)}
  .stars small{font-size:11px;color:var(--muted);margin-inline-start:6px}

  /* ===== قیمت‌ها ===== */
  .pcard{border-radius:24px;padding:16px;margin-bottom:14px;position:relative}
  .pcard .ph{display:flex;align-items:center;gap:10px}
  .pcard .ph img{width:40px;height:40px;border-radius:12px;object-fit:cover}
  .pcard .ph b{font-size:16px;font-weight:900} .pcard .ph small{display:block;font-size:11px;color:var(--muted);font-family:Montserrat,Arial,sans-serif;direction:ltr;text-align:start}
  .pcard .pv{margin-inline-start:auto;text-align:end}
  .pcard .pv b{display:block;font-size:24px;font-weight:900;font-family:Montserrat,Arial,sans-serif;direction:ltr}
  .chg{font-size:12px;font-weight:800;font-family:Montserrat,Arial,sans-serif;direction:ltr;display:inline-block}
  .chg.up{color:var(--buy)} .chg.dn{color:var(--sell)}
  .spark{width:100%;height:46px;margin-top:8px;display:block}
  .prow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .prow div{padding:9px 10px;border-radius:14px;background:var(--field)}
  .prow small{display:block;font-size:11px;color:var(--muted)}
  .prow b{font-size:15px;font-weight:900;font-family:Montserrat,Arial,sans-serif;direction:ltr;display:inline-block}
  .cities{display:grid;gap:6px;margin-top:10px}
  .cities div{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--field);font-size:13px}
  .cities b{font-family:Montserrat,Arial,sans-serif;direction:ltr}
  .upd{text-align:center;font-size:11.5px;color:var(--soft);margin:6px 0 14px;text-shadow:var(--ts)}

  /* ===== ابزارها و آکادمی ===== */
  .tool{border-radius:22px;margin-bottom:12px;overflow:hidden}
  .tool>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-weight:900;font-size:15px}
  .tool>summary::-webkit-details-marker{display:none}
  .tool>summary .ti{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:var(--field)}
  .tool>summary small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
  .tool>summary::after{content:"⌄";margin-inline-start:auto;color:var(--muted);transition:transform .4s}
  .tool[open]>summary::after{transform:rotate(180deg)}
  .tool .tb{padding:0 16px 16px;animation:rise .45s cubic-bezier(.16,1,.3,1)}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fgrid label,.fl{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
  .inp{width:100%;height:46px;margin-top:4px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--text);font-family:inherit;font-size:16px;outline:none}
  .inp:focus{border-color:var(--brand)}
  textarea.inp{height:80px;padding:10px 12px;resize:vertical}
  .tvbox{border-radius:18px;overflow:hidden;margin:0 0 12px;min-height:46px;background:var(--field)}
  .tvbox .tradingview-widget-copyright{display:none}
  .pv b.fl-up{animation:flu 1.2s ease}.pv b.fl-dn{animation:fld 1.2s ease}
  @keyframes flu{0%{color:var(--buy);text-shadow:0 0 14px rgba(0,160,80,.5)}100%{}}
  @keyframes fld{0%{color:var(--sell);text-shadow:0 0 14px rgba(220,40,40,.5)}100%{}}
  .seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:14px;background:var(--field);margin-bottom:10px}
  .seg2 button{border:0;border-radius:11px;padding:9px;font-family:inherit;font-weight:800;font-size:13px;color:var(--muted);background:none;cursor:pointer}
  .seg2 button.on{background:var(--card,#fff);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
  :root[data-theme="dark"] .seg2 button.on{background:rgba(255,255,255,.12)}
  .qchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .qchips button{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:6px 10px;font-family:inherit;font-size:12px;font-weight:800;color:var(--text);cursor:pointer}
  .rrows{margin-top:10px;border-radius:16px;background:var(--field);padding:4px 12px}
  .cw[hidden],.cmn[hidden]{display:none!important}
  .rrows b:has(.wt){direction:rtl;font-family:inherit;font-size:14px}
  .wt bdi{font-family:Montserrat,Arial,sans-serif;font-weight:900;direction:ltr;unicode-bidi:isolate}
  .rrows div{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .rrows div:first-child{border-top:0}
  .rrows b{font-family:Montserrat,Arial,sans-serif;direction:ltr;unicode-bidi:isolate;font-size:16px;font-weight:900}
  .qtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
  .qtab th{color:var(--muted);font-weight:700;padding:6px 4px;text-align:start}
  .qtab td{padding:7px 4px;border-top:1px solid var(--line);font-family:Montserrat,Arial,sans-serif;direction:ltr;unicode-bidi:isolate;text-align:start;font-weight:700}

  /* ================= SOFT UI (نئومورفیسم سفید با نور گرم) ================= */
  :root{
    --bg:#e8ebf0; --text:#141a2b; --muted:#6a7183; --soft:#9aa1b0;
    --navy:#11162c; --navy2:#232a4a; --onNavy:#ffffff;
    --glowc:color-mix(in srgb,var(--beam) 70%,#ff9d3c);
    --gl:linear-gradient(145deg,#f4f6f9,#e4e7ed);
    --tile:linear-gradient(145deg,#f7f8fb,#e2e5eb);
    --line:rgba(30,40,70,.08); --stroke:rgba(255,255,255,.75); --field:#e8ebf0;
    --sh:14px 16px 32px -6px rgba(150,160,182,.55),-12px -12px 26px rgba(255,255,255,.95),inset 1px 1px 0 rgba(255,255,255,.9);
    --raise:6px 7px 14px rgba(150,160,182,.5),-5px -5px 12px rgba(255,255,255,.95);
    --sh-in:inset 4px 4px 9px rgba(150,160,182,.45),inset -4px -4px 9px rgba(255,255,255,.95);
  }
  :root[data-theme="dark"]{
    --bg:#181b22; --text:#eef0f6; --muted:#9aa2b4; --soft:#6d7486;
    --navy:#eef1f7; --navy2:#d9deea; --onNavy:#11162c;
    --gl:linear-gradient(145deg,#1f232c,#15181e);
    --tile:linear-gradient(145deg,#222630,#171a21);
    --line:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.05); --field:#181b22;
    --sh:12px 14px 28px -6px rgba(0,0,0,.7),-8px -8px 20px rgba(255,255,255,.035),inset 1px 1px 0 rgba(255,255,255,.05);
    --raise:5px 6px 12px rgba(0,0,0,.6),-4px -4px 10px rgba(255,255,255,.035);
    --sh-in:inset 4px 4px 9px rgba(0,0,0,.6),inset -3px -3px 8px rgba(255,255,255,.04);
  }
  html,body{background:var(--bg)}
  /* پس‌زمینه‌ی ساده با یک نور گرم ملایم به‌جای عکس */
  .mbg i{display:none}
  .mbg{background:radial-gradient(60% 38% at 50% 8%,color-mix(in srgb,var(--glowc) 22%,transparent),transparent 70%),radial-gradient(50% 30% at 85% 95%,color-mix(in srgb,var(--glowc) 12%,transparent),transparent 70%),var(--bg)}

  .cta{color:var(--onNavy)!important;background:linear-gradient(180deg,var(--navy2),var(--navy))!important;border-radius:999px!important;
    box-shadow:0 14px 26px -12px rgba(17,22,44,.55),0 10px 30px -10px var(--glowc),inset 0 1px 0 rgba(255,255,255,.18)!important}

  .ib,.lgo{border-radius:50%!important;background:var(--tile)!important;box-shadow:var(--raise)!important;border:0!important}
  .ib:active{box-shadow:var(--sh-in)!important}

  /* بازارها */
  .mk button{background:var(--gl)!important;backdrop-filter:none!important;box-shadow:var(--raise)!important;border:0!important;border-radius:999px!important;opacity:1!important}
  .mk button.on{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;color:var(--onNavy)!important;

  .field,.inp,.chips select,textarea{background:var(--field)!important;box-shadow:var(--sh-in)!important;border:0!important}

  .langs{box-shadow:var(--sh-in);background:var(--field);border-radius:999px}

  .ring{border-radius:50%;background:var(--tile);box-shadow:var(--raise),0 10px 26px -10px var(--glowc)}

  .chat{background:var(--bg)!important}
  .banner,.pop{background:var(--gl)!important;box-shadow:var(--sh)!important}

  .rise{animation-duration:1.25s!important;animation-delay:calc(var(--i,0) * 110ms)!important;transform:translateY(26px)}
  #pg{animation:rise 1s cubic-bezier(.22,1,.36,1)!important}
  .hero{animation-duration:1.25s,14s!important}

  .mk button img,.mk .dual{transition:all .9s cubic-bezier(.22,1,.36,1)!important}
  .bnav button,.chips button,.langs button,.seg2 button,.tfc button{transition:background .6s ease,color .6s ease,box-shadow .6s ease!important}
  .bnav button span{transition:transform .8s cubic-bezier(.22,1,.36,1)!important}
  .it .more{transition:grid-template-rows .75s cubic-bezier(.22,1,.36,1)!important}
  .it{transition:background .6s ease!important}
  .chat{transition:transform 1s cubic-bezier(.22,1,.36,1),visibility 0s 1s!important}
  .chat.show{transition:transform 1s cubic-bezier(.22,1,.36,1),visibility 0s!important}
  .banner{transition:transform 1s cubic-bezier(.22,1,.36,1)!important}
  .pop{transition:all .65s cubic-bezier(.22,1,.36,1)!important}
  .fab{transition:transform .6s cubic-bezier(.22,1,.36,1),left .9s cubic-bezier(.22,1,.36,1)!important}
  .tool>summary::after{transition:transform .6s ease!important}
  .ring .fg{transition:stroke-dashoffset 2s cubic-bezier(.22,1,.36,1)!important}
  .glow::before{animation-duration:calc(var(--bd,7s) * 1.6)!important}
  .ripple{animation-duration:1.2s!important}
  html.app .rise{animation-duration:1s!important}

const mmss = t => { t = Math.max(0, Math.round(t || 0)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
function voiceHTML(path, bucket = "voices"){

let curAudio = null, curVp = null;
function paintVp(vp, a){
  const d = isFinite(a.duration) ? a.duration : 0, bars = vp.querySelectorAll(".vwave i"), n = Math.round((d ? a.currentTime / d : 0) * bars.length);
  bars.forEach((b, i) => b.classList.toggle("on", i < n));

}

async function gTranslate(text, tl){
  const parts = []; let cur = "";
  for (const line of String(text).split(/(\n)/)) { if ((cur + line).length > 1500 && cur) { parts.push(cur); cur = ""; } cur += line; }
  if (cur) parts.push(cur);
  const one = async p => {
    try { const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl=" + tl + "&q=" + encodeURIComponent(p));
      if (r.ok) { const j = await r.json(); const t = (j[0] || []).map(x => x[0]).join(""); if (t) return t; } } catch {}
    try { const src = /[؀-ۿ]/.test(p) ? (tl === "fa" ? "ps" : "fa") : "en";
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(p) + "&langpair=" + src + "|" + (tl === "ps" ? "ps-AF" : tl));
      if (r.ok) { const j = await r.json(); const t = j?.responseData?.translatedText; if (t && !/MYMEMORY WARNING|INVALID/i.test(t)) return t; } } catch {}
    throw new Error("tr_failed");
  };
  const out = []; for (const p of parts) out.push(await one(p)); return out.join("");
}

}

}

document.addEventListener("pointerdown", () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }, {passive:true});
function ding(){ try { if (!actx) return; const t = actx.currentTime;
  [[880,0],[1320,.16]].forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.25, t + d + .02); g.gain.exponentialRampToValueAtTime(.001, t + d + .45);
    o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + .5); }); } catch {} }
function banner(icon, title, sub, onTap){
  let b = $("banner");
  if (!b) { b = document.createElement("div"); b.id = "banner"; b.className = "banner glass"; document.body.appendChild(b); }
  b.onclick = () => { b.classList.remove("show"); onTap && onTap(); };
  b.innerHTML = `<span class="bi">${icon}</span><div><b>${title}</b><span>${sub}</span></div>`;
  requestAnimationFrame(() => b.classList.add("show"));
  clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("show"), 6000);
  try { navigator.vibrate && navigator.vibrate([220, 90, 220]); } catch {}
  ding();
  if (document.hidden) { let on = false; clearInterval(titleT); titleT = setInterval(() => { document.title = (on = !on) ? "🔔 " + title : "Market Analysts"; }, 1000); }
}

async function loadFeed(){
  if (loading || view !== "feed") return; loading = true; statusLine("busy");
  const t0 = Date.now();
  const { data, error } = await sb.from("signals").select("*").order("created_at",{ascending:false}).limit(40);
  await new Promise(r => setTimeout(r, Math.max(0, 400 - (Date.now() - t0))));
  loading = false;
  if (view !== "feed") return;
  if (error) { if (!offline) { offline = true; drawFeed(); } statusLine("off"); return; }
  const wasOff = offline; offline = false;
  const list = data || [], nsig = sigOf(list);
  if (sig !== null && list[0] && !all.some(x => x.id === list[0].id)) {
    const n = list[0], nm = n.market || "xag"; freshId = n.id;
    if (nm !== market) document.querySelector(`.mk button[data-m="${nm}"]`)?.classList.add("new");
    banner("🔔", `${T.newA} · ${T.m[nm]}: ${n.type === "buy" ? T.buy : T.sell} ${range(n)}`,
      `${n.tp1 != null ? T.tp1 + " " + fa(n.tp1) : ""}${n.sl != null ? " · " + T.sl + " " + fa(n.sl) : ""} — ${T.tapView}`, () => { if (nm !== market) selectMarket(nm); scrollTo({top: 0, behavior: "smooth"}); });
  } else if (sig !== null && nsig !== sig) {
    const ch = list.find(x => { const o = all.find(y => y.id === x.id); return o && o.status !== x.status; });
    if (ch) banner("📣", `${T.upd}: ${T.st[ch.status]}`, `${T.m[ch.market || "xag"]} · ${ch.type === "buy" ? T.buy : T.sell} ${range(ch)}`);
  }
  if (nsig !== sig || wasOff) { all = list; sig = nsig; store.set("cache_sig", list); drawFeed(); setTimeout(() => { freshId = null; }, 4000); }
  statusLine("idle");
}

const chatUrl = {};
async function chatFileUrl(path){
  if (chatUrl[path]) return chatUrl[path];
  const { data, error } = await sb.storage.from("chat").download(path);
  if (error || !data) throw error || new Error("download");
  return chatUrl[path] = URL.createObjectURL(data);
}
async function compressImage(file, max = 1600){
  let bmp = null; try { bmp = await createImageBitmap(file); } catch {}
  if (!bmp) return file;
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .82));
}
async function toWav(blob, sr = 16000){
  const AC = window.AudioContext || window.webkitAudioContext; const ctx = new AC(); let buf;
  try { buf = await ctx.decodeAudioData(await blob.arrayBuffer()); } finally { ctx.close && ctx.close(); }
  const len = Math.ceil(buf.duration * sr), off = new OfflineAudioContext(1, len, sr), src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start();
  const d = (await off.startRendering()).getChannelData(0), v = new DataView(new ArrayBuffer(44 + d.length * 2));
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + d.length * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) { const x = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([v], { type: "audio/wav" });
}
function makeRecorder(onTick, maxSec = 60){
  let mr = null, chunks = [], stream = null, t0 = 0, timer = null, resolveStop = null;
  return {
    active: () => !!mr,
    async start(){
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported?.(m)) || "";
      mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); chunks = [];
      mr.ondataavailable = e => e.data.size && chunks.push(e.data);
      mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(timer); const b = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); mr = null; resolveStop && resolveStop(b); };
      mr.start(); t0 = Date.now(); timer = setInterval(() => { const s = (Date.now() - t0) / 1000; onTick && onTick(s); if (s >= maxSec && mr) this.stop().then(b => this.onAuto && this.onAuto(b)); }, 250);
    },
    stop(){ return new Promise(r => { if (!mr) return r(null); resolveStop = r; mr.stop(); }); },
    cancel(){ if (!mr) return; resolveStop = null; mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(timer); mr = null; }; mr.stop(); },
  };
}
function mediaHTML(m){
  if (m.kind === "image" && m.file_path) return `<div class="cimg" data-cpath="${esc(m.file_path)}"><span class="cload"></span></div>`;
  if (m.kind === "voice" && m.file_path) return voiceHTML(m.file_path, "chat");
  return "";
}
function hydrateImages(root){
  root.querySelectorAll(".cimg[data-cpath]:not([data-done])").forEach(async el => {
    el.dataset.done = 1;
    try { const u = await chatFileUrl(el.dataset.cpath); el.innerHTML = `<img src="${u}" alt="">`; } catch { el.innerHTML = "🖼"; }
  });
}

  const pos = store.get("fabpos", null);

const rec = makeRecorder(s => { const el = $("rtime"); if (el) el.textContent = mmss(Math.min(s, 60)) + " / 1:00"; }, 60);
rec.onAuto = async raw => { $("cform")?.classList.remove("recording"); if (!raw || raw.size < 800) return; let w = raw; try { w = await toWav(raw); } catch {} sendMedia("voice", w, w.type === "audio/wav" ? "wav" : "webm"); };
async function sendMedia(kind, blob, ext){
  const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const temp = { id: "t" + Date.now(), member_id: me.id, sender: "member", kind, file_path: null, body: null, created_at: new Date().toISOString(), seen_at: null, _up: true };
  msgs.push(temp); drawChat();
  const up = await sb.storage.from("chat").upload(path, blob, { contentType: blob.type || (kind === "image" ? "image/jpeg" : "audio/wav") });
  if (up.error) { msgs = msgs.filter(m => m !== temp); drawChat(); return banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); }
  chatUrl[path] = URL.createObjectURL(blob);
  const { error } = await sb.from("messages").insert({ member_id: me.id, sender: "member", kind, file_path: path });
  if (error) { msgs = msgs.filter(m => m !== temp); drawChat(); sb.storage.from("chat").remove([path]); return banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); }
  loadChat();
}
function openChat(){ chatOpen = true; $("cveil").classList.add("show"); $("chat").classList.add("show"); drawChat(); markSeen(); }
function closeChat(){ chatOpen = false; $("cveil")?.classList.remove("show"); $("chat")?.classList.remove("show"); drawChat(); }
function drawChat(){
  const b = $("cbody");
  const unread = msgs.filter(m => m.sender === "admin" && !m.seen_at).length, bd = $("fbadge");
  if (bd) { bd.textContent = unread; bd.classList.toggle("show", unread > 0 && !chatOpen); }
  const hb = $("hbadge"); if (hb) { hb.textContent = unread; hb.classList.toggle("show", unread > 0 && !chatOpen); }
  if (!b) return;
  if (!msgs.length) { b.innerHTML = `<div class="cempty">${T.chatEmpty}</div>`; return; }
  b.innerHTML = msgs.map(m => `<div class="bub ${m.sender==="member"?"me":"him"} ${m._up?"upl":""}">${m._up ? `<span class="cload"></span> ${T.uploading}` : mediaHTML(m)}${m.body ? esc(m.body) : ""}<small class="num">${fmtFull(m.created_at)}</small></div>`).join("");
  hydrateImages(b);
  const last = msgs[msgs.length - 1];
  if (last.sender === "member") b.insertAdjacentHTML("beforeend", `<div class="cstate ${last.seen_at?"seen":"wait"}">${last.seen_at ? "✓✓ " + T.seen : "⏳ " + T.waiting}</div>`);
  b.scrollTop = b.scrollHeight;
}
async function loadTeacher(){
  const { data } = await sb.from("settings").select("value").eq("key", "teacher").maybeSingle();
  const v = data?.value || {}; const changed = v.name !== teacher.name || v.photo !== teacher.photo;
  teacher = { name: v.name || null, photo: v.photo || null }; store.set("teacher", teacher);
  if (changed && $("chat") && !chatOpen) refreshChatTexts();
}
teacher = store.get("teacher", teacher);
async function loadChat(){
  if (!me || me.role === "admin" || (view !== "feed" && view !== "msg")) return;
  if (!msgsLoaded) loadTeacher();
  const { data, error } = await sb.from("messages").select("*").eq("member_id", me.id).order("created_at", {ascending:true});
  if (error) return;
  const known = new Set(msgs.map(m => m.id));
  const fresh = (data || []).filter(m => m.sender === "admin" && !m.seen_at && !known.has(m.id));
  const first = !msgsLoaded; msgsLoaded = true;
  const keep = new Set((data || []).map(m => m.file_path).filter(Boolean));
  const gone = msgs.filter(m => m.file_path && !keep.has(m.file_path) && !String(m.id).startsWith("t")).map(m => m.file_path);
  if (!first && gone.length) sb.storage.from("chat").remove(gone);
  const sg = (data || []).map(m => m.id + ":" + (m.seen_at ? 1 : 0)).join("|");
  msgs = data || []; store.set("cache_msgs", msgs);
  if (sg !== chatSig) { chatSig = sg; drawChat(); }
  if (chatOpen) markSeen();
  else if (!first && fresh.length) { const f = fresh[fresh.length - 1]; banner("💬", T.newMsg, f.kind === "image" ? "🖼 " + T.photo : f.kind === "voice" ? "🎙 " + T.voice : esc(f.body).slice(0, 80), openChat); }
}
async function markSeen(){
  if (!msgs.some(m => m.sender === "admin" && !m.seen_at)) return;
  await sb.rpc("mark_seen", { p_member: me.id });
  msgs.forEach(m => { if (m.sender === "admin" && !m.seen_at) m.seen_at = new Date().toISOString(); }); drawChat();
}
async function sendMsg(e){
  e.preventDefault();
  if (rec.active()) {
    $("cform").classList.remove("recording");
    const raw = await rec.stop(); $("rtime").textContent = "0:00";
    if (!raw || raw.size < 800) return;
    let wav = raw; try { wav = await toWav(raw); } catch {}
    return sendMedia("voice", wav, wav.type === "audio/wav" ? "wav" : "webm");
  }
  const inp = $("cin"), body = inp.value.trim(); if (!body) return;
  const temp = { id: "t" + Date.now(), member_id: me.id, sender: "member", body, created_at: new Date().toISOString(), seen_at: null };
  msgs.push(temp); while (msgs.length > 10) msgs.shift(); inp.value = ""; inp.style.height = "46px"; drawChat();
  const { error } = await sb.from("messages").insert({ member_id: me.id, sender: "member", kind: "text", body });
  if (error) { msgs = msgs.filter(m => m !== temp); drawChat(); inp.value = body; banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); return; }
  loadChat();
}

    const { error } = await sb.from("contact_requests").insert({ name: $("kn").value.trim(), contact: toEn($("kc").value.trim()), body: $("kb").value.trim() });
    if (error) { b.disabled = false; b.textContent = T.cSend; $("kerr").textContent = T.cErr; return; }
    $("cfm").innerHTML = `<div class="cempty" style="padding:40px 10px"><div style="font-size:44px">✅</div>${T.cOk}</div><button type="button" class="cta" id="kclose">${T.close}</button>`;
    $("kclose").onclick = close;
  };
}

/* ===== مسیر ===== */
async function boot(){ const { data: { session } } = await sb.auth.getSession(); return route(session); }
async function route(session){
  stopLive();
  if (!session) { me = null; return renderLogin(); }
  let { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) {
    const cached = store.get("cache_me", null);
    if (cached && cached.id === session.user.id) { data = cached; offline = true; }
    else return renderMsg("📡", T.offTitle, T.firstOnline);
  } else store.set("cache_me", data);
  me = data;
  if (!me) return renderMsg("🔒", T.noAcc, T.contact);
  if (me.role !== "admin") {
    if (me.deleted_at) return renderMsg("🗂", T.removed, "", true);
    if (me.disabled) return renderMsg("⛔", T.disabled, "", true);
    if (!me.expires_at || new Date(me.expires_at) < Date.now())
      return renderMsg("⏳", T.expired, `${me.expires_at ? T.endDate + ": " + fmtDate(me.expires_at) + "<br>" : ""}${T.contact}`, true);
  }
  if (!all.length) all = store.get("cache_sig", []);
  if (!msgs.length) msgs = store.get("cache_msgs", []);
  renderFeed();
}
let lastUid;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session?.user?.id ?? null;
  if (event === "TOKEN_REFRESHED" && uid === lastUid) return;
  if (uid !== lastUid) { all = []; sig = null; msgs = []; msgsLoaded = false; removeChat(); }
  lastUid = uid;
  setTimeout(() => route(session), 0);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
