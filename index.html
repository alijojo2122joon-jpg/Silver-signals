  .fxhead span:not(:first-child){text-align:center}
  .fxr{border-radius:20px;margin-top:6px;background:var(--field);box-shadow:var(--sh-in);overflow:hidden}
  .fxr.nil{opacity:.6}
  .fxrow{width:100%;border:0;background:none;padding:10px 8px;font:inherit;color:var(--text);text-align:start;cursor:pointer}

  .fxd{padding:2px 10px 12px}

  /* ===== داشبورد ===== */
  .dash{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  .dcard{min-width:0}
  .dcard{padding:18px 16px;border-radius:30px}
  .dcard h3{margin:0 0 12px;font-size:16px;font-weight:900}
  .dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .dstats div{padding:10px 6px;border-radius:18px;background:var(--field);box-shadow:var(--sh-in);text-align:center}
  .dstats .big{grid-column:span 3;display:flex;align-items:baseline;justify-content:center;gap:10px}
  .dstats b{display:block;font:900 22px/1.1 Montserrat,Arial,sans-serif;color:var(--text)}
  .dstats .big b{font-size:34px}
  .dstats small{font-size:11px;font-weight:700;color:var(--muted)}
  .dstats .w b{color:var(--buy)} .dstats .l b{color:var(--sell)}
  .dmk,.dsplit{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;font-weight:700;color:var(--muted)}
  .dmk span{padding:6px 12px;border-radius:999px;background:var(--tile);box-shadow:var(--raise)}
  .dmk b,.dsplit b{color:var(--text);font-family:Montserrat,Arial,sans-serif}
  .dd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:1px;flex:none}
  .dd.live{background:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.18)} .dd.delayed{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18)}
  .dd.closed{background:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.18)} .dd.down{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.18)}

  .dst{text-align:end;font-size:12px;font-weight:900;white-space:nowrap}

  .rkspec b{font:800 13px Montserrat,Arial,sans-serif}

  .rkgrid small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)}
  .rkgrid b{font:800 13.5px Montserrat,Arial,sans-serif}
  .pos{color:var(--buy)!important} .neg{color:var(--sell)!important}
  .pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pstats div{padding:10px 6px;border-radius:16px;background:var(--field);box-shadow:var(--sh-in);text-align:center}
  .pstats small{display:block;font-size:10.5px;font-weight:700;color:var(--muted)} .pstats b{font:900 16px Montserrat,Arial,sans-serif}

  .npi{padding:12px 14px;border-radius:20px;background:var(--field);box-shadow:var(--sh-in)}

async function gTranslate(text, tl){
  const parts = []; let cur = "";
  for (const line of String(text).split(/(\n)/)) { if ((cur + line).length > 1500 && cur) { parts.push(cur); cur = ""; } cur += line; }
  if (cur) parts.push(cur);
  const one = async p => {
    try { const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl=" + tl + "&q=" + encodeURIComponent(p));
      if (r.ok) { const j = await r.json(); const t = (j[0] || []).map(x => x[0]).join(""); if (t) return t; } } catch {}
    try { const src = /[؀-ۿ]/.test(p) ? (tl === "fa" ? "ps" : "fa") : "en";
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(p) + "&langpair=" + src + "|" + (tl === "ps" ? "ps-AF" : tl));
      if (r.ok) { const j = await r.json(); const t = j?.responseData?.translatedText; if (t && !/MYMEMORY WARNING|INVALID/i.test(t)) return t; } } catch {}
    throw new Error("tr_failed");
  };
  const out = []; for (const p of parts) out.push(await one(p)); return out.join("");
}

function renderLogin(){
  view = "login"; stopLive(); removeChat();
  $app.innerHTML = `<form class="login" id="f">
    <div class="logo glass glow rise" style="--bd:9s"><img src="logo-mark.png" alt="Market Analysts"></div>
    <div class="bigwm rise" style="--i:1"><b>MARKET</b><small>ANALYSTS</small></div>
    <h1 class="rise" style="--i:2">${T.welcome}</h1>
    <div class="tag rise" style="--i:2">${T.loginSub}</div>
    <div class="rise" style="--i:3">${langsHTML()}</div>
    <label class="field glass glow rise" style="--i:4;--bd:8s">${I.user}<input id="em" type="email" required placeholder="${T.email}" autocomplete="username"></label>
    <label class="field glass glow rise" style="--i:5;--bd:8s;--bdl:-4s">${I.lock}<input id="pw" type="password" required placeholder="${T.password}" autocomplete="current-password">
      <button type="button" class="eye" id="eye">${I.eye}</button></label>
    <button class="cta rise" style="--i:6" id="go">${T.login}</button>
    <div class="err" id="er">${esc(loginNote)}</div>
    <button type="button" class="nolink rise" style="--i:7" id="noacc">${T.noAccQ} <b>${T.cTitle} 💬</b></button>
    <div class="foot rise" style="--i:7">${T.foot}</div>
  </form>`;
  loginNote = "";
  $("f").querySelector(".langs").onclick = e => { const b = e.target.closest("[data-lang]"); if (!b) return; setLang(b.dataset.lang); };
  $("eye").onclick = () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; };
  $("noacc").onclick = openContact;
  $("f").onsubmit = async e => {
    e.preventDefault();
    const go = $("go"), er = $("er"); er.textContent = ""; go.disabled = true; go.innerHTML = '<span class="spin"></span>';
    const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
    if (error) {
      go.disabled = false; go.textContent = T.login;
      sfx("caution", .45); er.textContent = (!navigator.onLine || /fetch|network/i.test(error.message || "")) ? T.noNet : T.badLogin;
      const f = $("f"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    }
  };
}

function renderMsg(icon, title, text, chat = false){
  view = "msg"; stopLive(); removeChat();
  $app.innerHTML = topbar() + `<div class="msg glass glow rise" style="margin-top:30px"><div class="big">${icon}</div><h2>${title}</h2><div>${text}</div>
    ${chat && title === T.expired ? `<button class="cta" id="mrenew" style="margin-top:16px">${PT().renew}</button>` : ""}
    ${chat ? `<p style="margin:14px 0 4px;font-size:13px">${T.chatHint}</p><button class="cta" id="mchat" style="margin-top:12px">💬 ${T.msgBtn}</button>` : ""}</div>`;
  bindTop();
  if (chat && me) {
    setupChat();
    $("mchat").onclick = () => openChat();
    if ($("mrenew")) $("mrenew").onclick = openPlans;
    clearInterval(pollT); pollT = setInterval(() => { if (!document.hidden && !chatOpen) loadChat(); }, 8000);
  }
}

function sortList(list){

}

const SFX_BASE = "https://cdn.jsdelivr.net/npm/snd-lib@1.1.2/assets/sounds/sprite/02/audioSprite.";

  $("csrch").onclick = () => { const bar = $("csbar"); bar.hidden = !bar.hidden; chatQ = ""; if (!bar.hidden) { $("csq").value = ""; $("csq").focus(); } drawChat(); };

    const blob = await compressImage(f); sendMedia("image", blob, "jpg"); };

const rec = makeRecorder(s => { const el = $("rtime"); if (el) el.textContent = mmss(Math.min(s, 60)) + " / 1:00"; }, 60);
rec.onAuto = async raw => { $("cform")?.classList.remove("recording"); if (!raw || raw.size < 800) return; let w = raw; try { w = await toWav(raw); } catch {} sendMedia("voice", w, w.type === "audio/wav" ? "wav" : "webm"); };
async function sendMedia(kind, blob, ext){
  const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const temp = { id: "t" + Date.now(), member_id: me.id, sender: "member", kind, file_path: null, body: null, created_at: new Date().toISOString(), seen_at: null, _up: true };
  msgs.push(temp); drawChat();
  const up = await sb.storage.from("chat").upload(path, blob, { contentType: blob.type || (kind === "image" ? "image/jpeg" : "audio/wav") });
  if (up.error) { msgs = msgs.filter(m => m !== temp); drawChat(); return banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); }
  chatUrl[path] = URL.createObjectURL(blob);
  const { error } = await sb.from("messages").insert({ member_id: me.id, sender: "member", kind, file_path: path });
  if (error) { msgs = msgs.filter(m => m !== temp); drawChat(); sb.storage.from("chat").remove([path]); return banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); }
  loadChat();
}
function openChat(){ if (chatOpen) return; chatOpen = true; teacherStatus(); try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch {} sfx("select", .32); overlayPush(closeChatNow); lockBody(); $("cveil").classList.add("show"); $("chat").classList.add("show"); drawChat(); markSeen(); }
function closeChatNow(){ if (!chatOpen) return; chatOpen = false;  unlockBody(); try { rec?.cancel?.(); $("cform")?.classList.remove("recording"); } catch {} $("cveil")?.classList.remove("show"); $("chat")?.classList.remove("show"); document.activeElement?.blur?.(); drawChat(); }
function closeChat(){ if (overlays.length && overlays[overlays.length - 1] === closeChatNow) history.back(); else closeChatNow(); }
function drawChat(keepScroll){
  const b = $("cbody"), L = CL();
  const vis = msgs.filter(m => !m.hidden_for_member);
  const unread = vis.filter(m => m.sender === "admin" && !m.seen_at && !m.deleted_at).length, bd = $("fbadge");
  if (bd) { bd.textContent = unread; bd.classList.toggle("show", unread > 0 && !chatOpen); }
  const hb = $("hbadge"); if (hb) { hb.textContent = unread; hb.classList.toggle("show", unread > 0 && !chatOpen); }
  if (!b) return;
  const q = chatQ.toLowerCase(), list = q ? vis.filter(m => (m.body || "").toLowerCase().includes(q)) : vis;
  if ($("csn")) $("csn").textContent = q ? `${list.length} ${L.found}` : "";
  if (!list.length) { b.innerHTML = `<div class="cempty">${q ? L.noFound : T.chatEmpty}</div>`; return; }
  let lastDay = "";
  b.innerHTML = list.map(m => { const day = fmtDate(m.created_at), sep = day !== lastDay ? `<div class="cday"><span>${day}</span></div>` : ""; lastDay = day;
    const t = new Date(m.created_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: false });
    const tick = m.sender === "member" && !m._up ? (m.seen_at ? `<i class="tk seen">✓✓</i>` : String(m.id).startsWith("t") ? `<i class="tk">🕓</i>` : `<i class="tk">✓</i>`) : "";
    const body = m.deleted_at ? `<span class="cdel">🚫 ${m.deleted_by === "admin" ? L.delByAdmin : L.deleted}</span>`
      : (m._up ? `<span class="cload"></span> ${T.uploading}` : mediaHTML(m)) + (m.story_id ? `<span class="strep">↩ ${T.storyReply}</span>` : "") + (m.body ? hl(esc(m.body), q) : "");
    return sep + `<div class="bub ${m.sender === "member" ? "me" : "him"} ${m._up ? "upl" : ""} ${m.deleted_at ? "gone" : ""}" ${m.sender === "member" && !m.deleted_at && !String(m.id).startsWith("t") ? `data-id="${m.id}"` : ""}>${body}<small class="num">${t}${tick}</small></div>`; }).join("");
  hydrateImages(b);
  if (!keepScroll) b.scrollTop = b.scrollHeight;
}
const hl = (h, q) => q ? h.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), x => `<mark>${x}</mark>`) : h;
let chatQ = "";

const CLL = { fa: { search: "جست‌وجو در پیام‌ها…", found: "پیام پیدا شد", noFound: "پیامی پیدا نشد", deleted: "این پیام حذف شد", delByAdmin: "این پیام توسط مدیر حذف شد", del: "🗑 حذف پیام", copy: "📋 کپی متن", clear: "🧹 پاک کردن گفتگو از گوشی من", clearQ: "همه‌ی پیام‌های این گفتگو از صفحه‌ی شما پاک شود؟ (استاد همچنان آن‌ها را دارد)", online: "🟢 آنلاین", lastSeen: "آخرین بازدید", copied: "کپی شد", cancel: "انصراف" },
  ps: { search: "په پیغامونو کې لټون…", found: "پیغام وموندل شو", noFound: "پیغام ونه موندل شو", deleted: "دا پیغام ړنګ شو", delByAdmin: "دا پیغام د مدیر لخوا ړنګ شو", del: "🗑 پیغام ړنګول", copy: "📋 کاپي", clear: "🧹 خبرې اترې پاکول", clearQ: "ټول پیغامونه ستاسو له پاڼې پاک شي؟", online: "🟢 آنلاین", lastSeen: "وروستی ځل", copied: "کاپي شو", cancel: "لغوه" },
  en: { search: "Search messages…", found: "found", noFound: "No messages found", deleted: "This message was deleted", delByAdmin: "Deleted by the admin", del: "🗑 Delete message", copy: "📋 Copy text", clear: "🧹 Clear this chat on my device", clearQ: "Clear all messages from your view? (the teacher keeps them)", online: "🟢 Online", lastSeen: "Last seen", copied: "Copied", cancel: "Cancel" } };
const CL = () => CLL[lang] || CLL.fa;
function actionSheet(items){ return new Promise(res => { const v = document.createElement("div"); v.className = "asheet"; v.innerHTML = `<div class="asb">${items.map((t, i) => `<button data-i="${i}">${t}</button>`).join("")}<button data-i="-1" class="ac">${CL().cancel}</button></div>`;
  document.body.appendChild(v); requestAnimationFrame(() => v.classList.add("show"));
  v.onclick = e => { const b = e.target.closest("[data-i]"); if (!b && e.target !== v) return; v.classList.remove("show"); setTimeout(() => v.remove(), 300); res(b ? Number(b.dataset.i) : -1); }; }); }
async function msgMenu(id){ const m = msgs.find(x => x.id === id); if (!m) return; const L = CL();
  const items = [L.del]; if (m.body) items.push(L.copy);
  const k = await actionSheet(items);
  if (k === 0) { const { error } = await sb.rpc("delete_my_message", { p_id: id }); if (!error) { if (m.file_path) sb.storage.from("chat").remove([m.file_path]); m.deleted_at = new Date().toISOString(); m.deleted_by = "member"; m.body = null; drawChat(true); } }
  if (k === 1) { try { await navigator.clipboard.writeText(m.body); banner("📋", L.copied, ""); } catch {} } }
async function chatMenu(){ const L = CL(); const k = await actionSheet([L.clear]); if (k !== 0) return; if (!confirm(L.clearQ)) return;
  await sb.rpc("clear_my_chat"); msgs.forEach(m => m.hidden_for_member = true); drawChat(); }
async function teacherStatus(){ const el = $("tstat"); if (!el) return; const { data } = await sb.rpc("teacher_status"); const L = CL();
  el.textContent = data && Date.now() - new Date(data) < 3 * 60000 ? L.online : data ? `${L.lastSeen}: ${agoTxt(data)}` : el.textContent; }
async function loadTeacher(){
  const { data } = await sb.from("settings").select("value").eq("key", "teacher").maybeSingle();
  const v = data?.value || {}; const changed = v.name !== teacher.name || v.photo !== teacher.photo;
  teacher = { name: v.name || null, photo: v.photo || null }; store.set("teacher", teacher);
  if (changed && $("chat") && !chatOpen) refreshChatTexts();
}
teacher = store.get("teacher", teacher);
async function loadChat(){
  if (!me || me.role === "admin" || (view !== "feed" && view !== "msg")) return;
  if (!msgsLoaded || Date.now() - (window._tAt || 0) > 60000) { window._tAt = Date.now(); loadTeacher(); }
  const { data, error } = await sb.from("messages").select("*").eq("member_id", me.id).order("created_at", {ascending:true});
  if (error) return;
  const known = new Set(msgs.map(m => m.id));
  const fresh = (data || []).filter(m => m.sender === "admin" && !m.seen_at && !m.deleted_at && !known.has(m.id));
  const first = !msgsLoaded; msgsLoaded = true;
  const keep = new Set((data || []).map(m => m.file_path).filter(Boolean));
  const gone = msgs.filter(m => m.file_path && !keep.has(m.file_path) && !String(m.id).startsWith("t")).map(m => m.file_path);
  if (!first && gone.length) sb.storage.from("chat").remove(gone);
  const sg = (data || []).map(m => m.id + ":" + (m.seen_at ? 1 : 0) + (m.deleted_at ? "d" : "") + (m.hidden_for_member ? "h" : "")).join("|");
  msgs = data || []; store.set("cache_msgs", msgs);
  if (sg !== chatSig) { chatSig = sg; drawChat(); }
  if (chatOpen) markSeen();
  else if (!first && fresh.length) { const f = fresh[fresh.length - 1]; webNotify(T.newMsg, f.kind === "image" ? "🖼 " + T.photo : f.kind === "voice" ? "🎙 " + T.voice : (f.body || "").slice(0, 80)); banner("💬", T.newMsg, f.kind === "image" ? "🖼 " + T.photo : f.kind === "voice" ? "🎙 " + T.voice : esc(f.body).slice(0, 80), openChat); }
}
async function markSeen(){
  if (!msgs.some(m => m.sender === "admin" && !m.seen_at)) return;
  await sb.rpc("mark_seen", { p_member: me.id });
  msgs.forEach(m => { if (m.sender === "admin" && !m.seen_at) m.seen_at = new Date().toISOString(); }); drawChat();
}
async function sendMsg(e){
  e.preventDefault();
  if (rec.active()) {
    $("cform").classList.remove("recording");
    const raw = await rec.stop(); $("rtime").textContent = "0:00";
    if (!raw || raw.size < 800) return;
    let wav = raw; try { wav = await toWav(raw); } catch {}
    return sendMedia("voice", wav, wav.type === "audio/wav" ? "wav" : "webm");
  }
  const inp = $("cin"), body = inp.value.trim(); if (!body) return;
  const temp = { id: "t" + Date.now(), member_id: me.id, sender: "member", body, created_at: new Date().toISOString(), seen_at: null };
  msgs.push(temp); while (msgs.length > 10) msgs.shift(); inp.value = ""; inp.style.height = "46px"; drawChat();
  const { error } = await sb.from("messages").insert({ member_id: me.id, sender: "member", kind: "text", body });
  if (error) { msgs = msgs.filter(m => m !== temp); drawChat(); inp.value = body; banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); return; }
  loadChat();
}

  const box = document.createElement("div"); box.id = "chat"; box.className = "chat";
  box.innerHTML = `<div class="chead"><span class="pp">💬</span><div><b>${T.cTitle}</b><small>${T.cSub}</small></div><button class="ib x" id="cx">${I.x}</button></div>
    <form id="cfm" style="padding:14px 16px;overflow:auto;flex:1">
      <label class="field glass" style="margin-bottom:10px">${I.user}<input id="kn" required maxlength="80" placeholder="${T.cName}" style="direction:auto"></label>
      <label class="field glass" style="margin-bottom:10px">☎<input id="kc" required maxlength="120" placeholder="${T.cContact}" inputmode="tel"></label>
      <textarea id="kb" required maxlength="1500" placeholder="${T.cMsg}" style="width:100%;min-height:130px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--field);color:var(--text);font-family:inherit;font-size:15px;outline:none;resize:vertical"></textarea>

/* ===== مسیر ===== */
async function boot(){ const { data: { session } } = await sb.auth.getSession(); return route(session); }
async function route(session){
  stopLive();
  if (!session) { me = null; return renderLogin(); }
  let { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) {
    const cached = store.get("cache_me", null);
    if (cached && cached.id === session.user.id) { data = cached; offline = true; }
    else return renderMsg("📡", T.offTitle, T.firstOnline);
  } else store.set("cache_me", data);
  me = data;
  if (!me) return renderMsg("🔒", T.noAcc, T.contact);
  if (me.role !== "admin") {
    if (me.deleted_at) return renderMsg("🗂", T.removed, "", true);
    if (me.disabled) return renderMsg("⛔", T.disabled, "", true);
    if (!me.expires_at || new Date(me.expires_at) < Date.now())
      return renderMsg("⏳", T.expired, `${me.expires_at ? T.endDate + ": " + fmtDate(me.expires_at) + "<br>" : ""}${T.contact}`, true);
  }
  if (!all.length) all = store.get("cache_sig", []);
  if (!msgs.length) msgs = store.get("cache_msgs", []);
  renderFeed(); handlePayReturn();
}
let lastUid;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session?.user?.id ?? null;
  if (event === "TOKEN_REFRESHED" && uid === lastUid) return;
  if (uid !== lastUid) { all = []; sig = null; msgs = []; msgsLoaded = false; removeChat(); }
  lastUid = uid;
  setTimeout(() => route(session), 0);
});
