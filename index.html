async function squareJpeg(file, size = 400){
  const bmp = await createImageBitmap(file); const s = Math.min(bmp.width, bmp.height);
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return await new Promise((r, j) => c.toBlob(b => b ? r(b) : j(), "image/jpeg", .86));
}
function openProfile(){
  if ($("prof")) return;
  const veil = document.createElement("div"); veil.className = "cveil"; veil.id = "pveil";
  const box = document.createElement("div"); box.className = "chat prof"; box.id = "prof";
  const days = me.role === "admin" ? null : Math.max(0, Math.ceil((new Date(me.expires_at) - Date.now()) / DAY));
  let pick = null;
  const draw = () => {
    box.innerHTML = `<div class="chead"><b style="flex:1">${T.myProfile}</b><button class="ib x" id="px">${I.x}</button></div>
      <div class="pbody">
        <label class="bigav" id="pav">${pick ? `<img src="${URL.createObjectURL(pick)}" alt="">` : myAvatarHTML()}<span class="cam">📷 ${T.changePhoto}</span>
          <input type="file" accept="image/*" id="pfile" hidden></label>
        <h2>${esc(me.name || "")}</h2><div class="pmail ltr">${esc(me.email || "")}</div>
        ${days != null ? `<div class="pdays">${tt(T.subDays, { n: `<b class="num">${days}</b>` })}</div>` : ""}
        ${pick ? `<button class="cta" id="psave">${T.savePhoto}</button>` : ""}
        ${me.avatar && !pick ? `<button class="ghost2" id="pdel">${T.removePhoto}</button>` : ""}
        <div class="err" id="perr"></div></div>`;
    $("px").onclick = () => history.back();
    $("pfile").onchange = async e => { const f = e.target.files[0]; if (!f) return; try { pick = await squareJpeg(f); draw(); } catch { $("perr").textContent = T.badPhoto; } };
    if ($("psave")) $("psave").onclick = async () => {
      const b = $("psave"); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
      const path = `${me.id}/${Date.now()}.jpg`;
      const up = await sb.storage.from("avatars").upload(path, pick, { contentType: "image/jpeg", upsert: true });
      if (up.error) { b.disabled = false; b.textContent = T.savePhoto; $("perr").textContent = T.sendFail2; return; }
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      const { error } = await sb.rpc("set_my_avatar", { p_url: url });
      if (error) { b.disabled = false; b.textContent = T.savePhoto; $("perr").textContent = T.sendFail2; return; }
      const old = me.avatar; me.avatar = url; store.set("cache_me", me); pick = null; sfx("button", .4);
      if (old) { const m = old.split("/avatars/")[1]; if (m && m.startsWith(me.id + "/")) sb.storage.from("avatars").remove([m]); }
      document.querySelectorAll("#meav").forEach(x => x.innerHTML = myAvatarHTML()); draw(); };
    if ($("pdel")) $("pdel").onclick = async () => { const old = me.avatar; const { error } = await sb.rpc("set_my_avatar", { p_url: null }); if (error) return;
      me.avatar = null; store.set("cache_me", me); const m = old?.split("/avatars/")[1]; if (m && m.startsWith(me.id + "/")) sb.storage.from("avatars").remove([m]);
      document.querySelectorAll("#meav").forEach(x => x.innerHTML = myAvatarHTML()); draw(); };
  };
  document.body.append(veil, box); draw();
  let closed = false; const close = () => { if (closed) return; closed = true; veil.id = box.id = ""; veil.classList.remove("show"); box.classList.remove("show"); unlockBody(); setTimeout(() => { veil.remove(); box.remove(); }, 700); };
  veil.onclick = () => history.back(); overlayPush(close); lockBody();
  requestAnimationFrame(() => { veil.classList.add("show"); box.classList.add("show"); });
}

function bindTop(){

}

function renderMsg(icon, title, text, chat = false){
  view = "msg"; stopLive(); removeChat();
  $app.innerHTML = topbar() + `<div class="msg glass glow rise" style="margin-top:30px"><div class="big">${icon}</div><h2>${title}</h2><div>${text}</div>
    ${chat ? `<p style="margin:14px 0 4px;font-size:13px">${T.chatHint}</p><button class="cta" id="mchat" style="margin-top:12px">💬 ${T.msgBtn}</button>` : ""}</div>`;
  bindTop();
  if (chat && me) {
    setupChat();
    $("mchat").onclick = () => openChat();
    clearInterval(pollT); pollT = setInterval(() => { if (!document.hidden && !chatOpen) loadChat(); }, 8000);
  }
}

let alerts = store.get("alerts", []);
const curPrice = a => a === "xau" ? prices?.xau?.price : a === "xag" ? prices?.xag?.price : a === "dxy" ? prices?.dxy?.price : usdAfn();
function checkAlerts(){
  let hit = false;
  alerts.forEach(al => {
    if (al.done) return; const v = curPrice(al.asset); if (v == null) return;
    if ((al.cond === "ge" && v >= al.value) || (al.cond === "le" && v <= al.value)) {
      al.done = true; hit = true;
      const name = al.asset === "dxy" ? "DXY" : T.m[al.asset];
      banner("⏰", `${T.alertHit}: ${name} ${nf(v)}`, `${al.cond === "ge" ? "≥" : "≤"} ${nf(al.value)}`);
      try { if (Notification?.permission === "granted") new Notification(`${T.alertHit}: ${name} ${nf(v)}`); } catch {}
    }
  });
  if (hit) { store.set("alerts", alerts); if (page === "tool") drawAlerts(); }
}
function drawAlerts(){
  const el = $("alist"); if (!el) return;
  el.innerHTML = alerts.length ? alerts.map((a, i) => `<div class="lrow"><span>${a.done ? "✅" : "⏳"}</span><span>${a.asset === "dxy" ? "DXY" : T.m[a.asset]} ${a.cond === "ge" ? "≥" : "≤"} <b class="ltr">${nf(a.value)}</b></span><span class="tag2">${T.lastUpd.split(" ")[0] ? nf(curPrice(a.asset)) : ""}</span><button class="x2" data-ad="${i}">✕</button></div>`).join("") : `<div class="lrow" style="color:var(--muted)">${T.noAlerts}</div>`;
}

      mr.start(); t0 = Date.now(); timer = setInterval(() => { const s = (Date.now() - t0) / 1000; onTick && onTick(s); if (s >= maxSec && mr) this.stop().then(b => this.onAuto && this.onAuto(b)); }, 250);
    },
    stop(){ return new Promise(r => { if (!mr) return r(null); resolveStop = r; mr.stop(); }); },
    cancel(){ if (!mr) return; resolveStop = null; mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(timer); mr = null; }; mr.stop(); },
  };
}
function mediaHTML(m){
  if (m.kind === "image" && m.file_path) return `<div class="cimg" data-cpath="${esc(m.file_path)}"><span class="cload"></span></div>`;
  if (m.kind === "voice" && m.file_path) return voiceHTML(m.file_path, "chat");
  return "";
}
function hydrateImages(root){

    el.dataset.done = 1;

document.addEventListener("click", e => {

/* ===== گفتگو با استاد ===== */
let msgs = [], msgsLoaded = false, chatOpen = false, chatSig = "";
function removeChat(){ ["fab","chat","cveil","fablab"].forEach(id => $(id)?.remove()); if (chatOpen) unlockBody(); chatOpen = false; }
function setupChat(){
  if ($("fab")) return;
  const isAdmin = me.role === "admin";
  const fab = document.createElement("button"); fab.id = "fab"; fab.className = "fab glow"; fab.style.setProperty("--bd", "5s");
  fab.innerHTML = I.chat + '<span class="badge" id="fbadge"></span>';
  const veil = document.createElement("div"); veil.id = "cveil"; veil.className = "cveil";
  const chat = document.createElement("div"); chat.id = "chat"; chat.className = "chat";
  document.body.append(fab, veil, chat);
  const place = (x, y) => { x = Math.min(Math.max(8, x), innerWidth - 70); y = Math.min(Math.max(70, y), innerHeight - 80); fab.style.left = x + "px"; fab.style.top = y + "px"; };
  const pos = store.get("fabpos", null);
  place(pos ? pos.x * innerWidth : (T.dir === "rtl" ? 14 : innerWidth - 76), pos ? pos.y * innerHeight : innerHeight - 150);
  let drag = null;
  fab.addEventListener("pointerdown", e => { drag = { sx: e.clientX, sy: e.clientY, x: fab.offsetLeft, y: fab.offsetTop, moved: false }; fab.setPointerCapture(e.pointerId); });
  fab.addEventListener("pointermove", e => { if (!drag) return; const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; fab.classList.add("drag"); fab.style.transition = "transform .2s"; }
    if (drag.moved) place(drag.x + dx, drag.y + dy); });
  fab.addEventListener("pointerup", () => { if (!drag) return; const moved = drag.moved; drag = null; fab.classList.remove("drag"); fab.style.transition = "";
    if (moved) { const x = fab.offsetLeft + 31 < innerWidth / 2 ? 12 : innerWidth - 74; place(x, fab.offsetTop); store.set("fabpos", { x: x / innerWidth, y: fab.offsetTop / innerHeight }); }
    else if (isAdmin) location.href = "modir.html?tab=msgs"; else openChat(); });
  fab.addEventListener("pointercancel", () => { drag = null; fab.classList.remove("drag"); fab.style.transition = ""; });
  veil.onclick = closeChat;
  const lab = document.createElement("div"); lab.id = "fablab"; lab.className = "fablab";
  lab.textContent = isAdmin ? T.inbox : T.msgTeacher; document.body.appendChild(lab);
  const posLabel = () => { const left = fab.offsetLeft + 31 < innerWidth / 2;
    lab.style.top = (fab.offsetTop + 16) + "px";
    lab.style.left = left ? (fab.offsetLeft + 72) + "px" : ""; lab.style.right = left ? "" : (innerWidth - fab.offsetLeft + 10) + "px"; };
  window._fabResize && removeEventListener("resize", window._fabResize);
  window._fabResize = () => { if (!fab.isConnected) return; place(fab.offsetLeft, fab.offsetTop); posLabel(); }; addEventListener("resize", window._fabResize);
  posLabel(); setTimeout(() => lab.classList.add("show"), 900); setTimeout(() => lab.classList.remove("show"), 7000);
  fab.addEventListener("pointerdown", () => lab.classList.remove("show"));
  fab.addEventListener("pointerup", () => setTimeout(posLabel, 600));
  if (isAdmin) return;
  refreshChatTexts();
  if (!chatCh) chatCh = sb.channel("msgs").on("postgres_changes", {event:"*", schema:"public", table:"messages", filter:`member_id=eq.${me.id}`}, () => loadChat()).subscribe();
  loadChat();
}
function refreshChatTexts(){
  const c = $("chat"); if (!c) return;
  $("fab")?.setAttribute("aria-label", T.chatTo);
  const draft = $("cin")?.value || "";
  const tn = teacher.name || T.teacher;
  c.innerHTML = `<div class="chead">${teacher.photo ? `<img class="pp" src="${esc(teacher.photo)}" alt="">` : `<span class="pp">${esc([...tn].find(ch => /\S/.test(ch) && !"استاد ".includes(ch)) || "م")}</span>`}
      <div><b>${esc(tn)}</b><small>${tt(T.chatTo, {n: esc(tn)})}</small></div><button class="ib x" id="cx">${I.x}</button></div>
    <div class="cbody" id="cbody"></div>
    <form class="cfoot" id="cform">
      <label class="ctool" aria-label="${T.photo}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg><input type="file" accept="image/*" id="cimgf"></label>
      <button type="button" class="ctool" id="cmic" aria-label="${T.voice}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <textarea id="cin" rows="1" placeholder="${T.typeMsg}" maxlength="2000"></textarea>
      <div class="recbar"><i></i><span>${T.recording}</span><span class="num" id="rtime">0:00</span><button type="button" class="rx" id="rcancel">${T.cancel}</button></div>
      <button class="send" id="csend">${I.send}</button></form>`;
  $("cin").value = draft;
  $("cx").onclick = closeChat;
  $("cin").oninput = e => { e.target.style.height = "46px"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px"; };
  $("cin").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && innerWidth > 700) { e.preventDefault(); $("cform").requestSubmit(); } };
  $("cform").onsubmit = sendMsg;
  $("cimgf").onchange = async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    const blob = await compressImage(f); sendMedia("image", blob, "jpg"); };
  $("cmic").onclick = async () => {
    try { await rec.start(); } catch { return banner("⚠️", T.micDenied, ""); }
    $("cform").classList.add("recording");
  };
  $("rcancel").onclick = () => { rec.cancel(); $("cform").classList.remove("recording"); $("rtime").textContent = "0:00"; };
  drawChat();
}
const rec = makeRecorder(s => { const el = $("rtime"); if (el) el.textContent = mmss(Math.min(s, 60)) + " / 1:00"; }, 60);
rec.onAuto = async raw => { $("cform")?.classList.remove("recording"); if (!raw || raw.size < 800) return; let w = raw; try { w = await toWav(raw); } catch {} sendMedia("voice", w, w.type === "audio/wav" ? "wav" : "webm"); };
async function sendMedia(kind, blob, ext){
  const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const temp = { id: "t" + Date.now(), member_id: me.id, sender: "member", kind, file_path: null, body: null, created_at: new Date().toISOString(), seen_at: null, _up: true };
  msgs.push(temp); drawChat();
  const up = await sb.storage.from("chat").upload(path, blob, { contentType: blob.type || (kind === "image" ? "image/jpeg" : "audio/wav") });
  if (up.error) { msgs = msgs.filter(m => m !== temp); drawChat(); return banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); }
  chatUrl[path] = URL.createObjectURL(blob);
  const { error } = await sb.from("messages").insert({ member_id: me.id, sender: "member", kind, file_path: path });
  if (error) { msgs = msgs.filter(m => m !== temp); drawChat(); sb.storage.from("chat").remove([path]); return banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); }
  loadChat();
}
function openChat(){ if (chatOpen) return; chatOpen = true; sfx("select", .32); overlayPush(closeChatNow); lockBody(); $("cveil").classList.add("show"); $("chat").classList.add("show"); drawChat(); markSeen(); }
function closeChatNow(){ if (!chatOpen) return; chatOpen = false;  unlockBody(); try { rec?.cancel?.(); $("cform")?.classList.remove("recording"); } catch {} $("cveil")?.classList.remove("show"); $("chat")?.classList.remove("show"); document.activeElement?.blur?.(); drawChat(); }
function closeChat(){ if (overlays.length && overlays[overlays.length - 1] === closeChatNow) history.back(); else closeChatNow(); }
function drawChat(){
  const b = $("cbody");
  const unread = msgs.filter(m => m.sender === "admin" && !m.seen_at).length, bd = $("fbadge");
  if (bd) { bd.textContent = unread; bd.classList.toggle("show", unread > 0 && !chatOpen); }
  const hb = $("hbadge"); if (hb) { hb.textContent = unread; hb.classList.toggle("show", unread > 0 && !chatOpen); }
  if (!b) return;
  if (!msgs.length) { b.innerHTML = `<div class="cempty">${T.chatEmpty}</div>`; return; }
  b.innerHTML = msgs.map(m => `<div class="bub ${m.sender==="member"?"me":"him"} ${m._up?"upl":""}">${m._up ? `<span class="cload"></span> ${T.uploading}` : mediaHTML(m)}${m.story_id ? `<span class="strep">↩ ${T.storyReply}</span>` : ""}${m.body ? esc(m.body) : ""}<small class="num">${fmtFull(m.created_at)}</small></div>`).join("");
  hydrateImages(b);
  const last = msgs[msgs.length - 1];
  if (last.sender === "member") b.insertAdjacentHTML("beforeend", `<div class="cstate ${last.seen_at?"seen":"wait"}">${last.seen_at ? "✓✓ " + T.seen : "⏳ " + T.waiting}</div>`);
  b.scrollTop = b.scrollHeight;
}
async function loadTeacher(){
  const { data } = await sb.from("settings").select("value").eq("key", "teacher").maybeSingle();
  const v = data?.value || {}; const changed = v.name !== teacher.name || v.photo !== teacher.photo;
  teacher = { name: v.name || null, photo: v.photo || null }; store.set("teacher", teacher);
  if (changed && $("chat") && !chatOpen) refreshChatTexts();
}
teacher = store.get("teacher", teacher);
async function loadChat(){
  if (!me || me.role === "admin" || (view !== "feed" && view !== "msg")) return;
  if (!msgsLoaded || Date.now() - (window._tAt || 0) > 60000) { window._tAt = Date.now(); loadTeacher(); }
  const { data, error } = await sb.from("messages").select("*").eq("member_id", me.id).order("created_at", {ascending:true});
  if (error) return;
  const known = new Set(msgs.map(m => m.id));
  const fresh = (data || []).filter(m => m.sender === "admin" && !m.seen_at && !known.has(m.id));
  const first = !msgsLoaded; msgsLoaded = true;
  const keep = new Set((data || []).map(m => m.file_path).filter(Boolean));
  const gone = msgs.filter(m => m.file_path && !keep.has(m.file_path) && !String(m.id).startsWith("t")).map(m => m.file_path);
  if (!first && gone.length) sb.storage.from("chat").remove(gone);
  const sg = (data || []).map(m => m.id + ":" + (m.seen_at ? 1 : 0)).join("|");
  msgs = data || []; store.set("cache_msgs", msgs);
  if (sg !== chatSig) { chatSig = sg; drawChat(); }
  if (chatOpen) markSeen();
  else if (!first && fresh.length) { const f = fresh[fresh.length - 1]; banner("💬", T.newMsg, f.kind === "image" ? "🖼 " + T.photo : f.kind === "voice" ? "🎙 " + T.voice : esc(f.body).slice(0, 80), openChat); }
}
async function markSeen(){
  if (!msgs.some(m => m.sender === "admin" && !m.seen_at)) return;
  await sb.rpc("mark_seen", { p_member: me.id });
  msgs.forEach(m => { if (m.sender === "admin" && !m.seen_at) m.seen_at = new Date().toISOString(); }); drawChat();
}
async function sendMsg(e){
  e.preventDefault();
  if (rec.active()) {
    $("cform").classList.remove("recording");
    const raw = await rec.stop(); $("rtime").textContent = "0:00";
    if (!raw || raw.size < 800) return;
    let wav = raw; try { wav = await toWav(raw); } catch {}
    return sendMedia("voice", wav, wav.type === "audio/wav" ? "wav" : "webm");
  }
  const inp = $("cin"), body = inp.value.trim(); if (!body) return;
  const temp = { id: "t" + Date.now(), member_id: me.id, sender: "member", body, created_at: new Date().toISOString(), seen_at: null };
  msgs.push(temp); while (msgs.length > 10) msgs.shift(); inp.value = ""; inp.style.height = "46px"; drawChat();
  const { error } = await sb.from("messages").insert({ member_id: me.id, sender: "member", kind: "text", body });
  if (error) { msgs = msgs.filter(m => m !== temp); drawChat(); inp.value = body; banner("⚠️", navigator.onLine ? T.sendFail2 : T.sendFail, ""); return; }
  loadChat();
}

/* ===== مسیر ===== */
async function boot(){ const { data: { session } } = await sb.auth.getSession(); return route(session); }
async function route(session){
  stopLive();
  if (!session) { me = null; return renderLogin(); }
  let { data, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) {
    const cached = store.get("cache_me", null);
    if (cached && cached.id === session.user.id) { data = cached; offline = true; }
    else return renderMsg("📡", T.offTitle, T.firstOnline);
  } else store.set("cache_me", data);
  me = data;
  if (!me) return renderMsg("🔒", T.noAcc, T.contact);
  if (me.role !== "admin") {
    if (me.deleted_at) return renderMsg("🗂", T.removed, "", true);
    if (me.disabled) return renderMsg("⛔", T.disabled, "", true);
    if (!me.expires_at || new Date(me.expires_at) < Date.now())
      return renderMsg("⏳", T.expired, `${me.expires_at ? T.endDate + ": " + fmtDate(me.expires_at) + "<br>" : ""}${T.contact}`, true);
  }
  if (!all.length) all = store.get("cache_sig", []);
  if (!msgs.length) msgs = store.get("cache_msgs", []);
  renderFeed();
}
let lastUid;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session?.user?.id ?? null;
  if (event === "TOKEN_REFRESHED" && uid === lastUid) return;
  if (uid !== lastUid) { all = []; sig = null; msgs = []; msgsLoaded = false; removeChat(); }
  lastUid = uid;
  setTimeout(() => route(session), 0);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
