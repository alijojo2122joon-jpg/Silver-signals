      const up = await sb.storage.from("avatars").upload(path, blob, { contentType: "image/jpeg", upsert: true }); if (up.error) throw up.error;
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl;
      await sb.from("profiles").update({ avatar: url }).eq("id", m.id); m.avatar = url; toast("عکس پروفایل عوض شد ✓"); loadMembers(); sheetMember(m);
    } catch (x) { toast("خطا در آپلود عکس: " + (x.message || x), true); } };
  $("m_save").onclick = async () => { const b = $("m_save"), g = id => $(id).value.trim();
    const until = g("m_until"), patch = { name: g("m_name") || m.name, phone: g("m_phone") || null, whatsapp: g("m_wa") || null, telegram: g("m_tg") || null, country: g("m_country") || null, city: g("m_city") || null,
      experience_years: g("m_exp") === "" ? null : Math.max(0, Math.min(80, parseInt(g("m_exp")) || 0)), level: g("m_lv") || null, skills: g("m_skills") || null, bio: g("m_bio") || null,
      plan: g("m_plan") || null, chat_muted: $("m_cm").checked, comments_muted: $("m_km").checked, expires_at: until ? new Date(until + "T23:59:00").toISOString() : m.expires_at };
    busy(b, true);
    try { const { error } = await sb.from("profiles").update(patch).eq("id", m.id); if (error) throw error;
      const em = g("m_email").toLowerCase(); if (em && em !== (m.email || "").toLowerCase()) await callFn({ action: "email", id: m.id, email: em });
      toast("ذخیره شد ✓"); closeSheet(); loadMembers();
    } catch (x) { busy(b, false, "ذخیره‌ی تغییرات"); toast("خطا: " + (x.message || x), true); } };
  $("sheet").onclick = async e => {
    const b = e.target.closest("[data-a]"); if (!b) return;
    const a = b.dataset.a;
    try {
      if (a === "ext") {
        const base = Math.max(Date.now(), m.expires_at ? new Date(m.expires_at).getTime() : 0);
        await sb.from("profiles").update({ expires_at: new Date(base + 30*DAY).toISOString() }).eq("id", m.id);
        toast("یک ماه تمدید شد ✓");
      } else if (a === "tog") {
        await sb.from("profiles").update({ disabled: !m.disabled }).eq("id", m.id);
        toast(m.disabled ? "حساب فعال شد ✓" : "حساب غیرفعال شد");
      } else if (a === "pw") {
        const pw = prompt(`رمز جدید برای «${m.name}» (حداقل 6 حرف):`); if (!pw) return;
        await callFn({ action: "password", id: m.id, password: pw }); toast("رمز عوض شد ✓");
      } else if (a === "del") {
        if (!confirm(`حساب «${m.name}» حذف شود؟\n(عضو دیگر تحلیل‌ها را نمی‌بیند ولی می‌تواند به شما پیام بدهد و بعداً می‌توانید حسابش را برگردانید.)`)) return;
        await sb.from("profiles").update({ deleted_at: new Date().toISOString(), disabled: true }).eq("id", m.id); toast("حساب حذف شد");
      } else if (a === "restore") {
        await sb.from("profiles").update({ deleted_at: null, disabled: false }).eq("id", m.id);
        toast(m.expires_at && new Date(m.expires_at) > Date.now() ? "حساب برگشت ✓" : "حساب برگشت ✓ — اشتراکش تمام شده، «تمدید» را بزنید");
      } else if (a === "purge") {
        if (!confirm(`حساب «${m.name}» برای همیشه و بدون بازگشت حذف شود؟`)) return;
        await callFn({ action: "delete", id: m.id }); toast("حساب برای همیشه حذف شد");
      }
      closeSheet(); loadMembers();
    } catch (x) { toast("خطا: " + x.message, true); }
  };
}

/* مسیر */
let pendingNote = "";
async function route(session){
  if (channel) { sb.removeChannel(channel); channel = null; }
  clearInterval(window._poll);
  closeSheet();
  if (!session) { const n = pendingNote; pendingNote = ""; return renderLogin(n); }
  const { data: me } = await sb.from("profiles").select("role,name").eq("id", session.user.id).maybeSingle();
  if (me?.role !== "admin") { pendingNote = "این صفحه فقط برای مدیر است."; await sb.auth.signOut(); return; }
  renderPanel();
}
let lastUid;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session?.user?.id ?? null;
  if (event === "TOKEN_REFRESHED" && uid === lastUid) return;
  lastUid = uid;
  setTimeout(() => route(session), 0);
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
