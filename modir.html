<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیر</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1116; --card:#171b22; --line:#262c36; --text:#e8ebf0; --muted:#8b94a3;
    --silver:#c9d1dc; --accent:#b8c4d4; --buy:#22c55e; --sell:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#11151b;position:sticky;top:0;z-index:5}
  .logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,#fff,#9aa6b6);-webkit-background-clip:text;color:transparent}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
  h2{margin:0 0 10px;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1318;color:var(--text);font-family:inherit;font-size:15px}
  textarea{min-height:70px}
  button{font-family:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#0e1116}
  button:disabled{opacity:.6}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.red{background:var(--sell);color:#fff}
  button.small{padding:6px 10px;font-size:12px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tabs{display:flex;gap:8px;margin-top:12px}
  .tabs button{flex:1}
  .tabs button.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .err{color:var(--sell);font-size:13px;min-height:20px;margin-top:6px}
  .ok{color:var(--buy);font-size:13px;min-height:20px;margin-top:6px}
  .muted{color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .b-buy{background:rgba(34,197,94,.15);color:var(--buy)}
  .b-sell{background:rgba(239,68,68,.15);color:var(--sell)}
  .b-st{background:#232a35;color:var(--silver)}
  .sig-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
  .box{background:#0f1318;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .box small{display:block;color:var(--muted);font-size:12px}
  .box b{font-size:17px;direction:ltr;display:inline-block}
  .tp b{color:var(--buy)} .sl b{color:var(--sell)}
  .note{margin-top:10px;white-space:pre-wrap;font-size:14px}
  .mem{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px 0}
  .mem:first-child{border-top:0}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .center{max-width:400px;margin:8vh auto}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
  @media (max-width:520px){ .row{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"><p style="text-align:center;padding:40px;color:#8b94a3">در حال بارگذاری…</p></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ====== تنظیمات ====== */
const SUPABASE_URL = "https://segfazxjglbawdhopnra.supabase.co";
const SUPABASE_KEY = "sb_publishable_VfSrjufay_d3__oseWrv2Q_UaCXJn5F";
const SITE_NAME = "سیگنال نقره";
const CONTACT   = "برای تمدید اشتراک با مدیر تماس بگیرید: 07XXXXXXXX";
/* ===================== */

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString("fa-AF",{year:"numeric",month:"long",day:"numeric"}) : "-";
const fmtTime = d => d ? new Date(d).toLocaleString("fa-AF",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const num = v => (v === "" || v == null) ? null : Number(v);
const DAY = 86400000;
const STATUS = { active:"فعال", tp1:"تارگت ۱ خورد", tp2:"تارگت ۲ خورد", sl:"استاپ خورد", closed:"بسته شد" };

let channel = null;
const stopLive = () => { if (channel) { sb.removeChannel(channel); channel = null; } };

function header(name){
  return `<header><div class="logo">${esc(SITE_NAME)}</div>
    <div class="actions"><span class="muted">${esc(name||"")}</span>
    <button class="ghost small" id="logout">خروج</button></div></header>`;
}
const bindLogout = () => document.getElementById("logout").onclick = () => sb.auth.signOut();

async function callFn(body){
  const { data, error } = await sb.functions.invoke("manage-members", { body });
  if (error) {
    let code = error.message;
    try { code = (await error.context.json()).error || code; } catch {}
    throw new Error(code);
  }
  return data;
}

/* ---------- ورود ---------- */
function renderLogin(){
  $app.innerHTML = `<div class="wrap"><div class="card center">
    <div class="logo" style="font-size:24px;text-align:center">${esc(SITE_NAME)}</div>
    <p class="muted" style="text-align:center">ورود مدیر</p>
    <form id="f">
      <label>ایمیل</label><input id="em" type="email" required dir="ltr" autocomplete="username">
      <label>رمز</label><input id="pw" type="password" required dir="ltr" autocomplete="current-password">
      <div class="err" id="er"></div>
      <button style="width:100%">ورود</button>
    </form></div></div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const er = document.getElementById("er"); er.textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) er.textContent = "ایمیل یا رمز اشتباه است.";
  };
}

function renderMessage(name, msg){
  $app.innerHTML = header(name) + `<div class="wrap"><div class="card"><p>${msg}</p></div></div>`;
  bindLogout();
}

/* ---------- کارت سیگنال ---------- */
function signalCard(s, admin=false){
  const buy = s.type === "buy";
  const entry = s.entry_to != null && s.entry_to !== s.entry_from ? `${s.entry_from} – ${s.entry_to}` : `${s.entry_from}`;
  return `<div class="card">
    <div class="sig-head">
      <div><span class="badge ${buy?"b-buy":"b-sell"}">${buy?"خرید":"فروش"}</span>
        <span class="badge b-st">${STATUS[s.status]||esc(s.status)}</span></div>
      <span class="muted">${fmtTime(s.created_at)}</span>
    </div>
    <div class="grid">
      <div class="box"><small>${buy?"قیمت خرید":"قیمت فروش"}</small><b>${esc(entry)}</b></div>
      ${s.tp1!=null?`<div class="box tp"><small>تارگت ۱ (تیک پروفیت)</small><b>${esc(s.tp1)}</b></div>`:""}
      ${s.tp2!=null?`<div class="box tp"><small>تارگت ۲</small><b>${esc(s.tp2)}</b></div>`:""}
      ${s.sl!=null?`<div class="box sl"><small>حد ضرر (استاپ لاس)</small><b>${esc(s.sl)}</b></div>`:""}
    </div>
    ${s.note?`<div class="note">${esc(s.note)}</div>`:""}
    ${admin?`<div class="actions" style="margin-top:10px">
      <select data-status="${s.id}" style="width:auto">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${k===s.status?"selected":""}>${v}</option>`).join("")}</select>
      <button class="red small" data-del="${s.id}">حذف</button></div>`:""}
  </div>`;
}

async function loadSignals(el, admin){
  const { data, error } = await sb.from("signals").select("*").order("created_at",{ascending:false}).limit(admin?100:50);
  if (error) { el.innerHTML = `<div class="card">${esc(CONTACT)}</div>`; return; }
  el.innerHTML = data.length ? data.map(s => signalCard(s, admin)).join("")
    : `<div class="card muted">فعلاً تحلیلی ثبت نشده است.</div>`;
}
function liveSignals(el, admin){
  stopLive();
  loadSignals(el, admin);
  channel = sb.channel("signals-live")
    .on("postgres_changes", { event:"*", schema:"public", table:"signals" }, () => loadSignals(el, admin))
    .subscribe();
}

/* ---------- صفحهٔ عضو ---------- */
function renderMember(me){
  const daysLeft = Math.ceil((new Date(me.expires_at) - Date.now()) / DAY);
  $app.innerHTML = header(me.name) + `<div class="wrap">
    <div class="card"><b>اشتراک شما فعال است</b>
      <div class="muted">تا ${fmtDate(me.expires_at)} — ${daysLeft} روز باقی مانده</div></div>
    <div id="list"><p class="muted">در حال بارگذاری…</p></div>
    <footer>این تحلیل‌ها نظر کارشناسی است و تضمین سود نیست؛ مسئولیت معامله با خود شماست.</footer></div>`;
  bindLogout();
  liveSignals(document.getElementById("list"), false);
}

/* ---------- پنل مدیر ---------- */
function renderAdmin(me){
  $app.innerHTML = header(me.name + " (مدیر)") + `<div class="wrap">
    <div class="tabs"><button id="t1">تحلیل‌ها</button><button id="t2" class="off">اعضا</button></div>
    <div id="pane"></div></div>`;
  bindLogout();
  const t1 = document.getElementById("t1"), t2 = document.getElementById("t2");
  t1.onclick = () => { t1.className=""; t2.className="off"; adminSignals(); };
  t2.onclick = () => { t2.className=""; t1.className="off"; adminMembers(); };
  adminSignals();
}

function adminSignals(){
  const pane = document.getElementById("pane");
  pane.innerHTML = `<div class="card"><h2>ثبت تحلیل جدید</h2>
    <form id="sf">
      <label>نوع</label><select id="type"><option value="buy">خرید</option><option value="sell">فروش</option></select>
      <div class="row">
        <div><label>قیمت ورود از</label><input id="ef" type="number" step="any" required dir="ltr" placeholder="51"></div>
        <div><label>قیمت ورود تا (اختیاری)</label><input id="et" type="number" step="any" dir="ltr" placeholder="52"></div>
      </div>
      <div class="row">
        <div><label>تارگت ۱ / تیک پروفیت</label><input id="tp1" type="number" step="any" dir="ltr" placeholder="54"></div>
        <div><label>تارگت ۲ (اختیاری)</label><input id="tp2" type="number" step="any" dir="ltr"></div>
      </div>
      <label>حد ضرر / استاپ لاس</label><input id="sl" type="number" step="any" dir="ltr" placeholder="49">
      <label>توضیح (اختیاری)</label><textarea id="note"></textarea>
      <div class="ok" id="msg"></div>
      <button style="width:100%">انتشار برای همهٔ اعضا</button>
    </form></div><div id="list"></div>`;
  const list = document.getElementById("list");
  document.getElementById("sf").onsubmit = async e => {
    e.preventDefault();
    const g = id => document.getElementById(id).value;
    const msg = document.getElementById("msg");
    const { error } = await sb.from("signals").insert({
      type:g("type"), entry_from:num(g("ef")), entry_to:num(g("et")), tp1:num(g("tp1")), tp2:num(g("tp2")),
      sl:num(g("sl")), note:g("note").trim() || null
    });
    if (error) { msg.className="err"; msg.textContent = "خطا: " + error.message; return; }
    e.target.reset(); msg.className="ok"; msg.textContent = "منتشر شد ✓";
    loadSignals(list, true);
  };
  list.onchange = async e => {
    const id = e.target.dataset.status;
    if (id) { await sb.from("signals").update({ status:e.target.value }).eq("id", id); loadSignals(list, true); }
  };
  list.onclick = async e => {
    const id = e.target.dataset.del;
    if (id && confirm("این تحلیل حذف شود؟")) { await sb.from("signals").delete().eq("id", id); loadSignals(list, true); }
  };
  liveSignals(list, true);
}

function adminMembers(){
  stopLive();
  const pane = document.getElementById("pane");
  pane.innerHTML = `<div class="card"><h2>عضو جدید (صراف)</h2>
    <form id="mf">
      <label>نام</label><input id="mn" required>
      <div class="row">
        <div><label>ایمیل</label><input id="me" type="email" required dir="ltr"></div>
        <div><label>رمز (حداقل ۶ حرف)</label><input id="mp" type="text" required minlength="6" dir="ltr"></div>
      </div>
      <label>مدت اشتراک (ماه)</label><input id="mm" type="number" min="1" value="1" required dir="ltr">
      <div class="err" id="merr"></div>
      <button id="mbtn" style="width:100%">ساختن حساب</button>
    </form></div>
    <div class="card"><h2>لیست اعضا</h2><div id="mlist"><p class="muted">در حال بارگذاری…</p></div></div>`;

  const mlist = document.getElementById("mlist");
  let members = {};

  async function loadMembers(){
    const { data, error } = await sb.from("profiles").select("*").eq("role","member").order("expires_at",{ascending:true});
    if (error) { mlist.innerHTML = `<p class="err">${esc(error.message)}</p>`; return; }
    members = {}; data.forEach(m => members[m.id] = m);
    mlist.innerHTML = data.length ? data.map(m => {
      const active = !m.disabled && m.expires_at && new Date(m.expires_at) > Date.now();
      return `<div class="mem"><div><b>${esc(m.name)}</b> <span class="badge ${active?"b-buy":"b-sell"}">${m.disabled?"غیرفعال":active?"فعال":"تمام‌شده"}</span>
        <div class="muted" dir="ltr" style="text-align:right">${esc(m.email)}</div>
        <div class="muted">اعتبار تا: ${fmtDate(m.expires_at)}</div></div>
        <div class="actions">
          <button class="small" data-act="extend" data-id="${m.id}">+۱ ماه</button>
          <button class="ghost small" data-act="toggle" data-id="${m.id}">${m.disabled?"فعال کن":"غیرفعال کن"}</button>
          <button class="ghost small" data-act="pw" data-id="${m.id}">رمز جدید</button>
          <button class="red small" data-act="del" data-id="${m.id}">حذف</button>
        </div></div>`;
    }).join("") : `<p class="muted">هنوز عضوی ثبت نشده است.</p>`;
  }

  document.getElementById("mf").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("merr"), btn = document.getElementById("mbtn");
    err.className="err"; err.textContent = "در حال ساختن…"; btn.disabled = true;
    const name = mn.value.trim(), email = me.value.trim(), password = mp.value, months = Number(mm.value)||1;
    try {
      await callFn({ action:"create", name, email, password, months });
      e.target.reset(); mm.value = 1;
      err.className="ok"; err.textContent = `حساب ساخته شد ✓ ایمیل: ${email} — رمز: ${password}`;
      loadMembers();
    } catch (x) {
      err.textContent = x.message === "email_exists" ? "این ایمیل قبلاً ثبت شده است."
        : x.message === "invalid_input" ? "ایمیل درست و رمز حداقل ۶ حرفی وارد کنید." : "خطا: " + x.message;
    } finally { btn.disabled = false; }
  };

  mlist.onclick = async e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.id, m = members[id];
    b.disabled = true;
    try {
      if (b.dataset.act === "extend") {
        const base = Math.max(Date.now(), m.expires_at ? new Date(m.expires_at).getTime() : 0);
        await sb.from("profiles").update({ expires_at: new Date(base + 30*DAY).toISOString() }).eq("id", id);
      } else if (b.dataset.act === "toggle") {
        await sb.from("profiles").update({ disabled: !m.disabled }).eq("id", id);
      } else if (b.dataset.act === "pw") {
        const pw = prompt(`رمز جدید برای «${m.name}» (حداقل ۶ حرف):`);
        if (pw) { await callFn({ action:"password", id, password: pw }); alert("رمز عوض شد ✓"); }
      } else if (b.dataset.act === "del" && confirm(`حساب «${m.name}» کامل حذف شود؟`)) {
        await callFn({ action:"delete", id });
      }
    } catch (x) { alert("خطا: " + x.message); }
    loadMembers();
  };

  loadMembers();
}

/* ---------- مسیر اصلی ---------- */
async function route(session){
  stopLive();
  if (!session) return renderLogin();
  const { data: me, error } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  if (error) return renderMessage("", "خطا در اتصال: " + esc(error.message));
  if (!me) return renderMessage("", "این حساب فعال نیست. " + esc(CONTACT));
  if (me.role === "admin") renderAdmin(me);
  else { await sb.auth.signOut(); }
}

let lastUid;
sb.auth.onAuthStateChange((event, session) => {
  const uid = session?.user?.id ?? null;
  if (event === "TOKEN_REFRESHED" && uid === lastUid) return;
  lastUid = uid;
  setTimeout(() => route(session), 0);
});
</script>
</body>
</html>
