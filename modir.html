<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#eef3ef">
<title>پنل مدیریت · Market Analysts</title>
<link rel="manifest" href="manifest-admin.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MA مدیر">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/estedad@5.3.0/index.css">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#eef2fb; --bg2:#dfe7f8; --glass:rgba(255,255,255,.66); --glass2:rgba(255,255,255,.88);
    --stroke:rgba(255,255,255,.95); --text:#0f1733; --muted:#6b7593; --soft:#8f99b5;
    --blue:#3566ff; --blue2:#1b3fd1; --glow:rgba(53,102,255,.35);
    --buy:#12a46b; --buy-bg:rgba(18,164,107,.12); --sell:#e5484d; --sell-bg:rgba(229,72,77,.12); --amber:#d8911c; --amber-bg:rgba(216,145,28,.14);
    --sh:0 12px 32px rgba(46,72,160,.13), 0 2px 6px rgba(46,72,160,.06);
    --sh-in:inset 0 2px 6px rgba(46,72,160,.08), inset 0 -1px 0 rgba(255,255,255,.9);
    --blob1:#c9d7ff; --blob2:#d9e3ff; --field:rgba(255,255,255,.75);
  }
  :root[data-theme="dark"]{
    --bg:#0c1122; --bg2:#121a33; --glass:rgba(28,37,66,.62); --glass2:rgba(36,47,84,.92);
    --stroke:rgba(255,255,255,.08); --text:#edf1ff; --muted:#97a2c3; --soft:#7480a3;
    --sh:0 12px 32px rgba(0,0,0,.35); --sh-in:inset 0 2px 6px rgba(0,0,0,.3), inset 0 -1px 0 rgba(255,255,255,.04);
    --blob1:#1d2d66; --blob2:#18234d; --field:rgba(12,17,34,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  html{background:var(--bg2)}
  body{background:linear-gradient(180deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body.lock{overflow:hidden}
  html:has(body.lock){overflow:hidden;overscroll-behavior:none}
  .sheet{overscroll-behavior:contain}
  .blob{position:fixed;border-radius:50%;z-index:0;pointer-events:none;animation:float 14s ease-in-out infinite}
  .b1{width:260px;height:260px;top:-90px;right:-90px;background:radial-gradient(circle at 30% 30%,#fff,var(--blob1) 70%);opacity:.8}
  .b2{width:170px;height:170px;top:40%;left:-70px;background:radial-gradient(circle at 60% 40%,#fff,var(--blob2) 70%);opacity:.7;animation-delay:-5s}
  :root[data-theme="dark"] .blob{opacity:.5}
  @keyframes float{50%{transform:translate(14px,-18px) scale(1.04)}}

  .app{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100vh;padding:0 16px calc(110px + env(safe-area-inset-bottom))}
  .glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--stroke);box-shadow:var(--sh)}
  .num{font-variant-numeric:tabular-nums}
  .ltr{direction:ltr;unicode-bidi:isolate}

  .rise{opacity:0;transform:translateY(16px);animation:rise .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0) * 60ms)}
  @keyframes rise{to{opacity:1;transform:none}}
  .press{transition:transform .18s cubic-bezier(.3,.7,.4,1.4)}
  .press:active{transform:scale(.95)}
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
  @keyframes rip{to{transform:scale(3.2);opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1;transform:none}}

  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 2px 10px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
  .mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4a7bff,var(--blue2));box-shadow:0 8px 18px var(--glow)}
  .mark svg{width:20px;height:20px}
  .role{font-size:11px;font-weight:800;color:var(--blue);background:rgba(53,102,255,.12);padding:2px 10px;border-radius:999px}
  .icons{display:flex;gap:8px}
  .ib{position:relative;overflow:hidden;width:40px;height:40px;border-radius:13px;border:1px solid var(--stroke);background:var(--glass2);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .ib svg{width:19px;height:19px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
  .stat{border-radius:20px;padding:12px 12px 10px}
  .stat small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
  .stat b{font-size:26px;font-weight:900;line-height:1.4}
  .stat.g b{color:var(--buy)} .stat.r b{color:var(--sell)} .stat.b b{color:var(--blue)}

  .sec{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
  .sec h3{font-size:15px;font-weight:900;margin:0}
  .add{position:relative;overflow:hidden;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:13px;color:#fff;padding:8px 14px;border-radius:14px;background:linear-gradient(135deg,#4a7bff,var(--blue2));box-shadow:0 8px 18px var(--glow);display:flex;align-items:center;gap:6px}
  .add svg{width:16px;height:16px}

  .list{border-radius:24px;padding:6px}
  .it{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px;border-radius:18px;cursor:pointer;transition:background .25s}
  .it:hover{background:rgba(255,255,255,.35)}
  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:17px;box-shadow:var(--sh-in);flex:none}
  .av svg{width:20px;height:20px}
  .av.buy{background:var(--buy-bg);color:var(--buy)} .av.sell{background:var(--sell-bg);color:var(--sell)}
  .t{font-weight:800;font-size:15px}
  .s{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .chip.on{background:var(--buy-bg);color:var(--buy)} .chip.off{background:var(--sell-bg);color:var(--sell)} .chip.warn{background:var(--amber-bg);color:var(--amber)} .chip.mute{background:rgba(120,130,160,.13);color:var(--muted)}
  .empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:14px}
  .empty .big{font-size:34px}

  .search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:18px;margin-bottom:12px}
  .search svg{width:19px;height:19px;color:var(--soft)}
  .search input{flex:1;border:0;background:none;outline:none;font-family:inherit;font-size:15px;color:var(--text)}

  .nav{position:fixed;z-index:20;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(300px,calc(100% - 32px));display:grid;grid-template-columns:1fr 1fr;padding:6px;border-radius:26px}
  .nav .pill{position:absolute;top:6px;bottom:6px;right:6px;width:calc(50% - 6px);border-radius:20px;background:linear-gradient(135deg,#4a7bff,var(--blue2));box-shadow:0 8px 18px var(--glow);transition:transform .5s cubic-bezier(.3,1.3,.4,1)}
  .nav button{position:relative;overflow:hidden;z-index:1;border:0;background:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:14px;color:var(--muted);height:48px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:7px;transition:color .3s}
  .nav button svg{width:19px;height:19px}
  .nav button.on{color:#fff}

  .veil{position:fixed;inset:0;z-index:30;background:rgba(15,23,51,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
  .veil.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;z-index:31;left:50%;bottom:0;width:100%;max-width:460px;max-height:92vh;overflow:auto;transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.2,.9,.2,1);border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));background:var(--glass2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--stroke);box-shadow:0 -10px 40px rgba(20,30,80,.2)}
  .sheet.show{transform:translate(-50%,0)}
  .grab{width:44px;height:5px;border-radius:9px;background:rgba(120,130,160,.35);margin:2px auto 12px}
  .sheet h2{font-size:19px;font-weight:900;margin:0 0 2px}
  .sheet .hint{color:var(--muted);font-size:12px;margin:0 0 10px}
  label.l{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 4px 6px}
  .in{width:100%;height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--stroke);background:var(--field);box-shadow:var(--sh-in);color:var(--text);font-family:inherit;font-size:16px;outline:none;transition:box-shadow .25s,border-color .25s}
  textarea.in{height:auto;min-height:120px;padding:12px 16px;resize:vertical;line-height:1.8}
  .in:focus{border-color:rgba(53,102,255,.5);box-shadow:0 0 0 4px rgba(53,102,255,.12)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tog{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:5px;border-radius:18px;background:var(--field);box-shadow:var(--sh-in)}
  .tog .k{position:absolute;top:5px;bottom:5px;right:5px;width:calc(50% - 5px);border-radius:14px;transition:transform .45s cubic-bezier(.3,1.3,.4,1),background .3s;background:var(--buy)}
  .tog.sell .k{transform:translateX(-100%);background:var(--sell)}
  .tog button{position:relative;z-index:1;border:0;background:none;font-family:inherit;font-size:15px;font-weight:900;height:44px;cursor:pointer;color:var(--muted);transition:color .3s}
  .tog button.on{color:#fff}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips button{border:1px solid var(--stroke);background:var(--field);box-shadow:var(--sh-in);border-radius:14px;padding:9px 14px;font-family:inherit;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer;transition:all .25s}
  .chips button.on{background:var(--blue);color:#fff;box-shadow:0 6px 14px var(--glow);border-color:transparent}
  .cta{position:relative;overflow:hidden;width:100%;height:56px;margin-top:18px;border:0;border-radius:20px;cursor:pointer;font-family:inherit;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4a7bff,var(--blue2));box-shadow:0 14px 30px var(--glow);display:flex;align-items:center;justify-content:center;gap:8px}
  .cta:disabled{opacity:.7}
  .ghost{width:100%;height:50px;margin-top:10px;border-radius:18px;border:1px solid var(--stroke);background:var(--field);font-family:inherit;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;position:relative;overflow:hidden}
  .ghost.red{color:var(--sell)}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acts .ghost{margin-top:0}
  .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .box{margin-top:12px;padding:14px;border-radius:18px;background:var(--field);border:1px solid var(--stroke);font-size:14px}
  .share{margin-top:14px;padding:14px;border-radius:18px;background:rgba(53,102,255,.08);border:1px dashed rgba(53,102,255,.4);white-space:pre-wrap;font-size:14px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .stlist{display:grid;gap:8px;margin-top:4px}
  .stlist button{text-align:right;border:1px solid var(--stroke);background:var(--field);border-radius:16px;padding:12px 14px;font-family:inherit;font-size:14px;font-weight:700;color:var(--text);cursor:pointer;display:flex;justify-content:space-between;transition:all .25s;position:relative;overflow:hidden}
  .stlist button.on{border-color:var(--blue);box-shadow:0 0 0 3px rgba(53,102,255,.15);color:var(--blue)}

  .toast{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);transition:transform .5s cubic-bezier(.3,1.3,.4,1);padding:12px 18px;border-radius:18px;font-weight:700;font-size:14px;white-space:nowrap}
  .toast.show{transform:translate(-50%,0)}
  .toast.bad{color:var(--sell)}

  .login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 6px}
  .logo{width:112px;height:112px;margin:0 auto 22px;border-radius:34px;display:grid;place-items:center}
  .logo .mark{width:64px;height:64px;border-radius:22px;animation:bob 4s ease-in-out infinite}
  .logo .mark svg{width:32px;height:32px}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
  .login h1{text-align:center;font-size:28px;font-weight:900;margin:0}
  .login .tag{text-align:center;color:var(--muted);font-size:14px;margin:2px 0 24px}
  .field{display:flex;align-items:center;gap:10px;padding:0 16px;height:60px;border-radius:20px;margin-bottom:14px;transition:box-shadow .3s,border-color .3s}
  .field:focus-within{border-color:rgba(53,102,255,.5);box-shadow:0 0 0 4px rgba(53,102,255,.12),var(--sh)}
  .field svg{width:21px;height:21px;color:var(--soft);flex:none}
  .field input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-family:inherit;font-size:16px;color:var(--text);direction:ltr;text-align:right}
  .field input::placeholder{color:var(--soft);direction:rtl}
  .eye{background:none;border:0;padding:4px;cursor:pointer;color:var(--soft);display:grid}
  .err{min-height:24px;text-align:center;color:var(--sell);font-size:13px;margin-top:10px}
  .shake{animation:shake .45s}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

  /* voice player */
  .vp{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 12px;border-radius:18px;background:var(--glass2);border:1px solid var(--stroke);box-shadow:var(--sh-in)}
  .vplay{position:relative;overflow:hidden;flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4a7bff,#1b3fd1);box-shadow:0 8px 18px rgba(53,102,255,.35);display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,.7,.4,1.4)}
  .vplay:active{transform:scale(.9)}
  .vplay svg{width:18px;height:18px}
  .vwave{flex:1;height:34px;display:flex;align-items:center;gap:3px;direction:ltr;cursor:pointer;position:relative}
  .vwave i{flex:1;border-radius:3px;background:rgba(120,130,160,.35);transition:background .2s}
  .vwave i.on{background:var(--blue,#3566ff)}
  .vp.playing .vwave i.on{animation:vb 1s ease-in-out infinite alternate}
  @keyframes vb{to{opacity:.6}}
  .vt{font-size:12px;color:var(--muted);min-width:38px;text-align:left;font-variant-numeric:tabular-nums}
  .vlab{font-size:11px;font-weight:800;color:var(--muted);margin:14px 4px -8px}

  .rec{margin-top:12px;padding:12px;border-radius:18px;background:var(--field);border:1px solid var(--stroke);box-shadow:var(--sh-in)}
  .recrow{display:flex;align-items:center;gap:10px}
  .mic{position:relative;overflow:hidden;flex:none;width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ff6b6f,#e5484d);box-shadow:0 8px 18px rgba(229,72,77,.35);display:grid;place-items:center;transition:transform .2s}
  .mic svg{width:22px;height:22px}
  .mic.live{animation:ring 1.4s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 16px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
  .rectxt{flex:1;font-size:13px;color:var(--muted)}
  .rectxt b{display:block;color:var(--text);font-size:15px}
  .recfile{font-size:12px;color:var(--blue);font-weight:700;cursor:pointer}
  .recfile input{display:none}
  .xbtn{border:0;background:var(--sell-bg);color:var(--sell);font-family:inherit;font-weight:800;font-size:12px;border-radius:12px;padding:8px 12px;cursor:pointer}
  .rec .vp{margin-top:0;flex:1}

  /* ===== عمق سه‌بعدی ===== */
  :root{
    --sh:0 22px 44px -14px rgba(38,64,160,.30),0 8px 18px -8px rgba(38,64,160,.20),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -3px 6px rgba(38,64,160,.07);
    --raise:7px 9px 18px rgba(78,98,170,.20),-5px -5px 12px rgba(255,255,255,.95),inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(78,98,170,.08);
    --sh-in:inset 3px 4px 8px rgba(78,98,170,.14),inset -3px -3px 7px rgba(255,255,255,.95);
    --tile:linear-gradient(145deg,#ffffff,#e7edfb);
    --gl:linear-gradient(160deg,rgba(255,255,255,.92),rgba(236,242,255,.58));
  }
  :root[data-theme="dark"]{
    --sh:0 22px 44px -14px rgba(0,0,0,.6),0 8px 18px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.10),inset 0 -3px 6px rgba(0,0,0,.25);
    --raise:6px 8px 16px rgba(0,0,0,.45),-4px -4px 10px rgba(255,255,255,.035),inset 0 1px 0 rgba(255,255,255,.08);
    --sh-in:inset 3px 4px 8px rgba(0,0,0,.4),inset -2px -2px 6px rgba(255,255,255,.04);
    --tile:linear-gradient(145deg,#26315a,#18203d);
    --gl:linear-gradient(160deg,rgba(40,52,92,.85),rgba(22,30,58,.6));
  }
  .glass{background:var(--gl)}
  .ib,.coin,.lv,.av,.arrow,.chips button,.stlist button,.ghost,.vp,.note,.box,.st{background:var(--tile);box-shadow:var(--raise);border:1px solid rgba(255,255,255,.7)}
  :root[data-theme="dark"] .ib,:root[data-theme="dark"] .coin,:root[data-theme="dark"] .lv,:root[data-theme="dark"] .av,:root[data-theme="dark"] .arrow,:root[data-theme="dark"] .vp,:root[data-theme="dark"] .note,:root[data-theme="dark"] .ghost,:root[data-theme="dark"] .box{border-color:rgba(255,255,255,.06)}
  .av.buy,.arrow.buy,.hero.buy .arrow{background:linear-gradient(145deg,#e9fbf3,#c9f0dd);color:var(--buy)}
  .av.sell,.hero.sell .arrow{background:linear-gradient(145deg,#fff0f0,#fbd5d6);color:var(--sell)}
  :root[data-theme="dark"] .av.buy,:root[data-theme="dark"] .hero.buy .arrow{background:linear-gradient(145deg,#1c4a3a,#123327)}
  :root[data-theme="dark"] .av.sell,:root[data-theme="dark"] .hero.sell .arrow{background:linear-gradient(145deg,#4f2229,#35161b)}
  .av svg,.arrow svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
  .lv b,.entry b,.stat b{text-shadow:0 2px 0 rgba(255,255,255,.8),0 6px 14px rgba(38,64,160,.18)}
  :root[data-theme="dark"] .lv b,:root[data-theme="dark"] .entry b,:root[data-theme="dark"] .stat b{text-shadow:0 4px 14px rgba(0,0,0,.5)}
  .in,.field input,.search input{color:var(--text)}
  .in,.tog,.seg,.search{box-shadow:var(--sh-in)}
  .seg{background:rgba(226,233,250,.65)} :root[data-theme="dark"] .seg{background:rgba(10,14,30,.5)}
  .seg .pill,.nav .pill{box-shadow:var(--raise)}
  .seg .pill{background:var(--tile)}
  .cta,.add,.vplay,.mark,.chips button.on{background:linear-gradient(180deg,#5b8aff 0%,#3566ff 45%,#1b3fd1 100%);
    box-shadow:0 16px 28px -8px rgba(40,80,240,.55),0 4px 0 #1530a8,inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,30,.25);transition:transform .15s,box-shadow .15s}
  .cta:active,.add:active,.vplay:active{transform:translateY(3px);box-shadow:0 8px 16px -8px rgba(40,80,240,.55),0 1px 0 #1530a8,inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,30,.25)}
  .cta{margin-bottom:4px}
  .nav .pill{background:linear-gradient(180deg,#5b8aff,#1b3fd1);box-shadow:0 10px 20px -6px rgba(40,80,240,.55),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,30,.25)}
  .mic{background:linear-gradient(180deg,#ff8285,#e5484d 55%,#bf2f35);box-shadow:0 14px 24px -8px rgba(229,72,77,.6),0 4px 0 #a52429,inset 0 2px 0 rgba(255,255,255,.4)}
  .tog .k{box-shadow:0 8px 16px -6px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.35)}
  .tog .k{background:linear-gradient(180deg,#2fd08c,#12a46b)} .tog.sell .k{background:linear-gradient(180deg,#ff7a7e,#d93a40)}
  .hero{transform:perspective(900px) rotateX(0deg);transition:transform .5s}
  .hero{background:linear-gradient(180deg,rgba(255,255,255,.6),transparent 38%),var(--gl)}
  :root[data-theme="dark"] .hero{background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 38%),var(--gl)}
  .coin span,.logo span{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),inset -4px -6px 10px rgba(0,0,0,.22),0 8px 16px rgba(60,70,110,.35)}
  .logo{box-shadow:var(--sh),0 30px 60px -20px rgba(38,64,160,.35)}

  /* ===== نور سوییپ ===== */
  .sw{position:relative;overflow:hidden;isolation:isolate}
  .sw>.shine{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:inherit;overflow:hidden}
  .sw>.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:45%;left:-60%;
    background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,0) 20%,rgba(255,255,255,.42) 50%,rgba(255,255,255,0) 80%,transparent 100%);
    transform:skewX(-18deg);animation:sweep 3.6s cubic-bezier(.4,0,.2,1) infinite;animation-delay:var(--sd,0s)}
  :root[data-theme="dark"] .sw>.shine::after{background:linear-gradient(105deg,transparent,rgba(255,255,255,.14) 50%,transparent)}
  @keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
  .chip,.st{position:relative;overflow:hidden}
  .chip::after,.st::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:chipsw 2.8s ease-in-out infinite}
  @keyframes chipsw{0%{transform:translateX(120%)}50%,100%{transform:translateX(-120%)}}

  /* ===== نتیجه‌ی معامله ===== */
  .res{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:18px;box-shadow:var(--raise);border:1px solid rgba(255,255,255,.6);position:relative;overflow:hidden}
  .res .ri{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900}
  .res b{display:block;font-size:15px;font-weight:900}
  .res small{font-size:12px;color:var(--muted)}
  .res.win{background:linear-gradient(145deg,#ecfbf4,#d2f3e3)} .res.win b{color:var(--buy)}
  .res.win .ri{background:linear-gradient(180deg,#34d896,#0e8f5b);box-shadow:0 8px 16px -6px rgba(18,164,107,.6),inset 0 2px 0 rgba(255,255,255,.4)}
  .res.lose{background:linear-gradient(145deg,#fff1f1,#fbd9da)} .res.lose b{color:var(--sell)}
  .res.lose .ri{background:linear-gradient(180deg,#ff7a7e,#c93036);box-shadow:0 8px 16px -6px rgba(229,72,77,.6),inset 0 2px 0 rgba(255,255,255,.4)}
  .res.neutral{background:var(--tile)} .res.neutral .ri{background:linear-gradient(180deg,#9aa4bd,#6b7593)}
  :root[data-theme="dark"] .res.win{background:linear-gradient(145deg,#173d30,#0f2a21)}
  :root[data-theme="dark"] .res.lose{background:linear-gradient(145deg,#45202a,#2d141a)}
  .res::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(130%);animation:resw 4.5s cubic-bezier(.45,0,.2,1) infinite}
  @keyframes resw{0%{transform:translateX(130%)}45%,100%{transform:translateX(-130%)}}
  .resgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .rb{position:relative;overflow:hidden;border:0;border-radius:18px;padding:14px 10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:900;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,box-shadow .15s}
  .rb span{font-size:22px;line-height:1}
  .rb small{font-size:11px;font-weight:600;opacity:.9}
  .rb.g{background:linear-gradient(180deg,#34d896,#12a46b 55%,#0b7d50);box-shadow:0 14px 24px -10px rgba(18,164,107,.7),0 4px 0 #0a6a44,inset 0 2px 0 rgba(255,255,255,.4)}
  .rb.r{background:linear-gradient(180deg,#ff8286,#e5484d 55%,#b92b31);box-shadow:0 14px 24px -10px rgba(229,72,77,.7),0 4px 0 #9b2227,inset 0 2px 0 rgba(255,255,255,.4)}
  .rb.n{background:linear-gradient(180deg,#a7b0c7,#7a84a1 55%,#5d6683);box-shadow:0 14px 24px -10px rgba(90,100,130,.6),0 4px 0 #4d5571,inset 0 2px 0 rgba(255,255,255,.35)}
  .rb:active{transform:translateY(3px)}
  .rb.cur{outline:3px solid rgba(255,255,255,.9);outline-offset:-6px}

  /* ===== برند Market Analysts ===== */
  :root{
    --bg:#eef3ef; --bg2:#dfe9e2; --text:#0c120e; --muted:#5f6d64; --soft:#8b978f;
    --blue:#00963f; --blue2:#006b2c; --glow:rgba(0,150,63,.35); --brand:#00963f; --ink:#0c120e;
    --buy:#00963f; --buy-bg:rgba(0,150,63,.12);
    --blob1:#cfe8d7; --blob2:#e3efe6;
    --sh:0 22px 44px -14px rgba(20,50,32,.28),0 8px 18px -8px rgba(20,50,32,.18),inset 0 1.5px 0 rgba(255,255,255,1),inset 0 -3px 6px rgba(20,50,32,.06);
    --raise:7px 9px 18px rgba(40,70,52,.18),-5px -5px 12px rgba(255,255,255,.95),inset 0 1.5px 0 #fff,inset 0 -2px 4px rgba(40,70,52,.08);
    --sh-in:inset 3px 4px 8px rgba(40,70,52,.13),inset -3px -3px 7px rgba(255,255,255,.95);
    --tile:linear-gradient(145deg,#ffffff,#e6eee8);
    --gl:linear-gradient(160deg,rgba(255,255,255,.93),rgba(234,243,237,.6));
  }
  :root[data-theme="dark"]{
    --bg:#0b100d; --bg2:#111a14; --text:#eef5f0; --muted:#98a89d; --soft:#748479;
    --blob1:#123d22; --blob2:#0f2a19;
    --tile:linear-gradient(145deg,#1f2b23,#151e18); --gl:linear-gradient(160deg,rgba(32,44,36,.88),rgba(18,26,21,.62));
  }
  .cta,.add,.vplay,.chips button.on,.nav .pill,.banner .bi{background:linear-gradient(180deg,#22c466 0%,#00963f 50%,#006b2c 100%);
    box-shadow:0 16px 28px -8px rgba(0,120,50,.5),0 4px 0 #004d20,inset 0 2px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,30,10,.3)}
  .nav .pill{box-shadow:0 10px 20px -6px rgba(0,120,50,.5),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,30,10,.3)}
  .cta:active,.add:active,.vplay:active{box-shadow:0 8px 16px -8px rgba(0,120,50,.5),0 1px 0 #004d20,inset 0 2px 0 rgba(255,255,255,.4)}
  .field:focus-within,.in:focus{border-color:rgba(0,150,63,.55)!important;box-shadow:0 0 0 4px rgba(0,150,63,.14),var(--sh)!important}
  .ring .fg{stroke:var(--brand)}
  .livebar.busy .ldot{background:var(--brand)}
  .vwave i.on{background:var(--brand)}
  .stat.b b{color:var(--ink)} :root[data-theme="dark"] .stat.b b{color:var(--text)}
  .role{color:#fff;background:linear-gradient(180deg,#2a332d,#0c120e);box-shadow:0 4px 10px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
  .lgo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--tile);box-shadow:var(--raise);border:1px solid rgba(255,255,255,.7)}
  .lgo img{width:30px;height:30px;filter:drop-shadow(0 3px 4px rgba(0,60,25,.3))}
  :root[data-theme="dark"] .lgo img,:root[data-theme="dark"] .logo img{filter:invert(1) hue-rotate(180deg) drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .wm{display:flex;flex-direction:column;line-height:1.05}
  .wm b{font-family:"Montserrat","Segoe UI",Arial,sans-serif;font-weight:500;letter-spacing:2.5px;font-size:15px;direction:ltr;text-align:right;border-bottom:1.5px solid currentColor;padding-bottom:2px}
  .wm small{font-family:"Montserrat","Segoe UI",Arial,sans-serif;letter-spacing:5.2px;font-size:8.5px;font-weight:500;direction:ltr;text-align:right;margin-top:2px;color:var(--muted)}
  .brand{gap:11px}
  .logo{width:132px;height:132px;border-radius:38px}
  .logo img{width:94px;height:94px;filter:drop-shadow(0 10px 14px rgba(0,60,25,.3));animation:bob 5s cubic-bezier(.45,0,.55,1) infinite}
  .bigwm{text-align:center;margin:0 0 4px;color:var(--text)}
  .bigwm b{display:inline-block;font-family:"Montserrat","Segoe UI",Arial,sans-serif;font-weight:500;letter-spacing:7px;font-size:26px;border-bottom:2px solid currentColor;padding:0 0 4px 7px;direction:ltr}
  .bigwm small{display:block;font-family:"Montserrat","Segoe UI",Arial,sans-serif;letter-spacing:11px;font-size:13px;margin-top:4px;padding-left:11px;direction:ltr;color:var(--muted)}
  .login h1{font-size:22px;margin-top:14px}

  /* ===== حرکت نرم و روان ===== */
  .rise{animation:rise .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0) * 80ms);transform:translateY(22px) scale(.98)}
  @keyframes rise{to{opacity:1;transform:none}}
  .blob{animation:morph 18s ease-in-out infinite;will-change:transform,border-radius}
  .b2{animation-duration:22s;animation-delay:-7s} .b3{animation-duration:26s;animation-delay:-13s}
  @keyframes morph{
    0%,100%{transform:translate(0,0) rotate(0) scale(1);border-radius:50% 50% 50% 50%/50% 50% 50% 50%}
    25%{transform:translate(18px,-22px) rotate(25deg) scale(1.06);border-radius:58% 42% 55% 45%/45% 58% 42% 55%}
    50%{transform:translate(-10px,14px) rotate(-10deg) scale(.96);border-radius:42% 58% 45% 55%/58% 42% 58% 42%}
    75%{transform:translate(12px,8px) rotate(15deg) scale(1.03);border-radius:55% 45% 60% 40%/40% 60% 45% 55%}}
  .hero{animation:rise .9s cubic-bezier(.16,1,.3,1) forwards, drift 7s ease-in-out 1s infinite}
  @keyframes drift{0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}33%{transform:translateY(-4px) rotateX(1.2deg) rotateY(-1deg)}66%{transform:translateY(-1px) rotateX(-.8deg) rotateY(1.2deg)}}
  .hero{transform-style:preserve-3d;will-change:transform}
  .stat:nth-child(1){animation:rise .9s cubic-bezier(.16,1,.3,1) .08s forwards, bobs 6s ease-in-out 1s infinite}
  .stat:nth-child(2){animation:rise .9s cubic-bezier(.16,1,.3,1) .16s forwards, bobs 6s ease-in-out 1.8s infinite}
  .stat:nth-child(3){animation:rise .9s cubic-bezier(.16,1,.3,1) .24s forwards, bobs 6s ease-in-out 2.6s infinite}
  @keyframes bobs{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  .lv{animation:bobs 5s ease-in-out infinite}
  .lv:nth-child(2){animation-delay:-1.6s} .lv:nth-child(3){animation-delay:-3.2s}
  .av,.arrow{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
  .it:hover .av,.it:active .av{transform:scale(1.1) rotate(-6deg)}
  .it{transition:background .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}
  .it:active{transform:scale(.985)}
  .press,.ib,.cta,.add,.rb,.ghost,.chips button,.stlist button{transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease,background .35s ease}
  .press:active,.ib:active,.ghost:active,.chips button:active{transform:scale(.94)}
  .seg .pill,.nav .pill,.tog .k{transition:transform .7s cubic-bezier(.34,1.45,.5,1)}
  .sheet{transition:transform .65s cubic-bezier(.16,1,.3,1)}
  .veil{transition:opacity .5s ease}
  .more{transition:grid-template-rows .6s cubic-bezier(.16,1,.3,1)}
  .toast,.banner{transition:transform .75s cubic-bezier(.34,1.45,.5,1)}
  .ripple{animation:rip .8s cubic-bezier(.16,1,.3,1) forwards}

  /* نور منحنی و روان */
  .sw>.shine::after{top:-60%;bottom:auto;height:220%;width:55%;left:0;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(255,255,255,.55) 0%,rgba(255,255,255,.18) 35%,transparent 65%);
    transform:none;animation:arc 6.5s cubic-bezier(.45,.05,.55,.95) infinite;animation-delay:var(--sd,0s);opacity:0}
  :root[data-theme="dark"] .sw>.shine::after{background:radial-gradient(ellipse at center,rgba(140,255,190,.12),transparent 65%)}
  @keyframes arc{
    0%{transform:translate(-80%,30%) rotate(-25deg);opacity:0}
    12%{opacity:1}
    30%{transform:translate(40%,-10%) rotate(-8deg)}
    50%{transform:translate(120%,8%) rotate(10deg)}
    68%{transform:translate(210%,-14%) rotate(22deg);opacity:1}
    80%,100%{transform:translate(260%,20%) rotate(30deg);opacity:0}}
  .chip::after,.st::after{background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.6) 50%,transparent 75%);animation:chipsw 3.8s cubic-bezier(.45,.05,.55,.95) infinite}
  .ldot{animation:pulse 2.2s cubic-bezier(.16,1,.3,1) infinite}
  @media (prefers-reduced-motion:reduce){.hero,.stat,.lv,.blob{animation:none!important}}

  /* ===== ترجمه ===== */
  .note.tr{padding:10px 12px 12px;white-space:normal}
  .trbar{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;margin-bottom:10px;border-radius:14px;background:rgba(120,130,160,.10);box-shadow:var(--sh-in)}
  .trbar .tp{position:absolute;top:4px;bottom:4px;right:4px;width:calc((100% - 8px)/3);border-radius:11px;background:var(--tile);box-shadow:var(--raise);transition:transform .6s cubic-bezier(.34,1.45,.5,1)}
  .trbar button{position:relative;z-index:1;border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);padding:6px 0;cursor:pointer;transition:color .3s}
  .trbar button.on{color:var(--text)}
  .trbar button[data-tl="en"]{font-family:"Montserrat","Segoe UI",Arial,sans-serif;letter-spacing:.3px}
  .ntext{white-space:pre-wrap;font-size:14.5px;line-height:1.9;transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1),filter .35s}
  .ntext.fade{opacity:0;transform:translateY(6px);filter:blur(3px)}
  .ntext[dir="ltr"]{text-align:left;font-family:"Montserrat","Segoe UI",Arial,sans-serif;font-size:14px}
  .ntext.load{color:transparent!important;border-radius:10px;background:linear-gradient(100deg,rgba(120,130,160,.10) 30%,rgba(120,130,160,.25) 50%,rgba(120,130,160,.10) 70%);background-size:300% 100%;animation:shim 1.2s infinite}
  @keyframes shim{to{background-position:-150% 0}}
  .trsrc{display:block;margin-top:8px;font-size:11px;color:var(--soft)}

  /* ===== انتخاب بازار ===== */
  .mksel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .mksel button{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:8px 4px;cursor:pointer;font-family:inherit;color:var(--text);background:var(--tile);box-shadow:var(--raise);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
  .mksel img{width:42px;height:42px;border-radius:13px;object-fit:cover;box-shadow:0 8px 14px -6px rgba(0,0,0,.4)}
  .mksel b{font-size:13px;font-weight:900;line-height:1}
  .mksel small{font-family:"Montserrat",Arial,sans-serif;font-size:10px;font-weight:700;color:var(--muted);direction:ltr}
  .mksel button.on{transform:translateY(-3px);box-shadow:0 0 0 3px var(--brand),var(--raise)}
  .mksel button[data-m="xau"].on{box-shadow:0 0 0 3px #d9ad4a,var(--raise)} .mksel button[data-m="xag"].on{box-shadow:0 0 0 3px #8e96a1,var(--raise)} .mksel button[data-m="usd"].on{box-shadow:0 0 0 3px #2f8a5b,var(--raise)}
  .msym{font-family:"Montserrat",Arial,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}
  .mf{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding:2px 2px 6px;scrollbar-width:none}
  .mf button{flex:none;border:1px solid rgba(255,255,255,.7);border-radius:14px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--muted);background:var(--tile);box-shadow:var(--raise);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .35s}
  .mf button img{width:18px;height:18px;border-radius:6px;object-fit:cover}
  .mf button.on{color:#fff;background:linear-gradient(180deg,#22c466,#00963f 50%,#006b2c);box-shadow:0 8px 16px -6px rgba(0,120,50,.5),inset 0 2px 0 rgba(255,255,255,.4)}

  /* ===== طراحی خلوت‌تر ===== */
  .chip::after,.st::after,.res::after{display:none}
  .stat>.shine,.list>.shine{display:none}
  .stat:nth-child(1),.stat:nth-child(2),.stat:nth-child(3){animation:rise .9s cubic-bezier(.16,1,.3,1) forwards}
  .stat:nth-child(2){animation-delay:.08s} .stat:nth-child(3){animation-delay:.16s}
  .lv{animation:none}
  .av{width:40px;height:40px;box-shadow:none}
  .list{box-shadow:0 12px 30px -16px rgba(30,50,40,.25)}
  .mf button{box-shadow:none;border-color:rgba(120,130,160,.18);background:rgba(255,255,255,.55)}
  .note,.box,.vp{box-shadow:none}
  .res{box-shadow:none}

  /* ===== پیام‌ها ===== */
  .nav{width:min(420px,calc(100% - 24px))!important;grid-template-columns:repeat(4,1fr)!important}
  .nav .pill{width:calc((100% - 12px)/4)!important}
  .nav button{font-size:12.5px!important;gap:4px!important}
  .tfc{display:flex;flex-wrap:wrap;gap:6px}
  .tfc button{border:1px solid var(--stroke);background:var(--field);border-radius:12px;padding:8px 11px;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
  .tfc button.on{background:linear-gradient(180deg,#22c466,#00963f);color:#fff;border-color:transparent}
  .ctile{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
  .ctile .av{font-size:20px}
  .impsel{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px;font-weight:700}
  .impsel .tfc button{padding:6px 9px}
  .rrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
  .nav .nb{position:absolute;top:4px;left:12px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;font-weight:800;display:none;place-items:center;font-family:Montserrat,Arial,sans-serif}
  .nav .nb.show{display:grid}
  .ub{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:#e5484d;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;font-family:Montserrat,Arial,sans-serif}
  .cbody{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:6px 2px 10px}
  .bub{max-width:82%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
  .bub small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
  .bub.mem{align-self:flex-start;background:var(--field);border:1px solid rgba(120,130,160,.18);border-end-start-radius:6px}
  .bub.adm{align-self:flex-end;background:linear-gradient(180deg,#22c466,#00963f);color:#fff;border-end-end-radius:6px}
  .cst{text-align:center;font-size:12px;padding:2px 0}
  .cst.wait{color:#c98a12} .cst.seen{color:#0f9d58}
  .crow{display:flex;gap:8px;margin-top:8px}
  .crow textarea{flex:1;resize:none;height:50px;padding:12px 14px;border-radius:16px;border:1px solid var(--stroke);background:var(--field);color:var(--text);font-family:inherit;font-size:15px;outline:none}
  .crow button{width:50px;height:50px;flex:none;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;background:linear-gradient(180deg,#22c466,#00963f 50%,#006b2c)}
  .crow button svg{width:20px;height:20px;transform:scaleX(-1)}

  /* ===== رفع مشکل آیفون در فرم‌ها ===== */
  .sheet{left:0!important;right:0!important;margin:0 auto;transform:translateY(105%)!important;max-height:88vh;max-height:88dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:linear-gradient(160deg,#ffffff,#f2f6f4)!important}
  :root[data-theme="dark"] .sheet{background:linear-gradient(160deg,#1d2532,#151b25)!important}
  .sheet.show{transform:none!important}
  .sheet .in{font-size:16px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
  .sheet input,.sheet textarea{-webkit-appearance:none;appearance:none}
  body.lock{overflow:hidden}
  .sheet *{touch-action:manipulation}
  /* ===== رسانه در گفتگو ===== */
  .cimg{min-width:140px;min-height:100px;display:grid;place-items:center;border-radius:14px;overflow:hidden;margin:-2px -6px 2px;cursor:zoom-in}
  .cimg img{display:block;max-width:230px;max-height:280px;width:100%;object-fit:cover;border-radius:14px}
  .cload{width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(127,127,127,.3);border-top-color:currentColor;animation:rot .8s linear infinite}
  .bub .vp{margin:0 -4px 2px;min-width:220px;background:rgba(255,255,255,.35);border:0}
  .iview{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:grid;place-items:center;opacity:0;transition:opacity .35s;cursor:zoom-out}
  .iview.show{opacity:1}
  .iview img{max-width:96vw;max-height:90vh;border-radius:12px;transform:scale(.92);transition:transform .45s cubic-bezier(.16,1,.3,1)}
  .iview.show img{transform:none}
  .ctool{width:42px;height:46px;flex:none;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--muted);border-radius:14px}
  .ctool svg{width:22px;height:22px}
  .ctool input{display:none}
  .recbar{flex:1;display:none;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:16px;background:rgba(229,72,77,.1);color:#e5484d;font-weight:800;font-size:14px}
  .recbar i{width:10px;height:10px;border-radius:50%;background:#e5484d;animation:recp 1s ease-in-out infinite}
  @keyframes recp{50%{opacity:.25}}
  .recbar .rx{margin-inline-start:auto;border:0;background:none;color:inherit;font-family:inherit;font-weight:800;cursor:pointer}
  .cfoot.recording textarea,.cfoot.recording .ctool{display:none}
  .cfoot.recording .recbar{display:flex}
  .upl{opacity:.6}

  .bub.adm .vp{background:rgba(255,255,255,.2)}
  .crow .ctool{width:40px;height:50px}
  .crow.recording textarea,.crow.recording .ctool{display:none}
  .crow.recording .recbar{display:flex;height:50px}
  .pfp{width:110px;height:110px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-size:40px;font-weight:900;color:#fff;background:linear-gradient(180deg,#22c466,#006b2c);box-shadow:var(--raise);position:relative;cursor:pointer}
  .pfp img{width:100%;height:100%;object-fit:cover}
  .pfp .cam{position:absolute;inset:auto 0 0 0;height:30px;background:rgba(0,0,0,.45);display:grid;place-items:center;font-size:13px;font-weight:700}

  /* ===== حالت اپ اندروید: سبک و روان ===== */
  html.app .glass,html.app .mk button,html.app .sline,html.app .pop{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  html.app .glass,html.app .mk button,html.app .sline{background:var(--tile)!important}
  html.app .mbg i{filter:blur(8px)!important;animation:none!important;transform:scale(1.08)}
  html.app .hero{animation:rise .6s cubic-bezier(.16,1,.3,1) forwards!important}
  html.app .hero .shine,html.app .blob,html.app .shine{display:none!important}
  html.app .glow:not(.hero):not(.on)::before{display:none}
  html.app .sw>.shine{display:none}
  html.app *{-webkit-tap-highlight-color:transparent}
  html.app body{overscroll-behavior:none}

  /* ================= SOFT UI مدیر ================= */
  :root{--bg:#e8ebf0;--bg2:#e8ebf0;--text:#141a2b;--muted:#6a7183;--soft:#9aa1b0;--field:#e8ebf0;--stroke:rgba(255,255,255,.75);
    --navy:#11162c;--navy2:#232a4a;--onNavy:#fff;--glowc:#ffa04a;--glow:rgba(255,160,74,.45);
    --gl:linear-gradient(145deg,#f4f6f9,#e4e7ed);--tile:linear-gradient(145deg,#f7f8fb,#e2e5eb);
    --sh:14px 16px 32px -6px rgba(150,160,182,.55),-12px -12px 26px rgba(255,255,255,.95);
    --raise:6px 7px 14px rgba(150,160,182,.5),-5px -5px 12px rgba(255,255,255,.95);
    --sh-in:inset 4px 4px 9px rgba(150,160,182,.45),inset -4px -4px 9px rgba(255,255,255,.95)}
  :root[data-theme="dark"]{--bg:#181b22;--bg2:#181b22;--text:#eef0f6;--muted:#9aa2b4;--field:#181b22;--stroke:rgba(255,255,255,.05);
    --navy:#eef1f7;--navy2:#d9deea;--onNavy:#11162c;
    --gl:linear-gradient(145deg,#1f232c,#15181e);--tile:linear-gradient(145deg,#222630,#171a21);
    --sh:12px 14px 28px -6px rgba(0,0,0,.7),-8px -8px 20px rgba(255,255,255,.035);
    --raise:5px 6px 12px rgba(0,0,0,.6),-4px -4px 10px rgba(255,255,255,.035);
    --sh-in:inset 4px 4px 9px rgba(0,0,0,.6),inset -3px -3px 8px rgba(255,255,255,.04)}
  html,body{background:var(--bg)!important}
  body{background:radial-gradient(60% 34% at 50% 6%,rgba(255,160,74,.16),transparent 70%),var(--bg)!important}
  .blob{display:none!important}
  .glass{background:var(--gl)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border:1px solid var(--stroke)!important;box-shadow:var(--sh)!important}
  .sheet{background:var(--bg)!important;backdrop-filter:none!important}
  .cta{color:var(--onNavy)!important;background:linear-gradient(180deg,var(--navy2),var(--navy))!important;border-radius:999px!important;box-shadow:0 14px 26px -12px rgba(17,22,44,.55),0 10px 30px -10px var(--glowc)!important}
  .ib,.lgo{border-radius:50%!important;background:var(--tile)!important;box-shadow:var(--raise)!important;border:0!important}
  .in,.search,.tog,.seg{background:var(--field)!important;box-shadow:var(--sh-in)!important;border:0!important}
  .in{border-radius:18px!important}
  .nav{background:var(--gl)!important;border-radius:999px!important;box-shadow:var(--sh)!important;border:0!important}
  .nav .pill{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;border-radius:999px!important;box-shadow:0 10px 24px -8px var(--glowc)!important}
  .nav button.on{color:var(--onNavy)!important}
  .mf button,.tfc button{border:0!important;border-radius:999px!important;background:var(--tile)!important;box-shadow:var(--raise)!important;color:var(--text)!important}
  .mf button.on,.tfc button.on{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;color:var(--onNavy)!important;box-shadow:0 10px 22px -10px var(--glowc)!important}
  .add{border-radius:999px!important;background:linear-gradient(180deg,var(--navy2),var(--navy))!important;color:var(--onNavy)!important;box-shadow:0 10px 22px -10px var(--glowc)!important;border:0!important}
  .stat,.list,.box,.rb,.ghost,.mksel button{border-radius:24px!important}
  .ghost,.rb,.mksel button{background:var(--tile)!important;box-shadow:var(--raise)!important;border:0!important}
  .box{background:var(--field)!important;box-shadow:var(--sh-in)!important;border:0!important}
  .tog,.tog .k{border-radius:999px!important}
  .mksel button.on{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;color:var(--onNavy)!important;box-shadow:0 12px 26px -10px var(--glowc)!important}
  .mksel button.on small{color:inherit!important;opacity:.7}
  /* حرکت آرام‌تر */
  .rise{animation-duration:1.2s!important;animation-delay:calc(var(--i,0) * 110ms)!important}
  .sheet{transition:transform .9s cubic-bezier(.22,1,.36,1)!important}
  .nav .pill{transition:transform .9s cubic-bezier(.22,1,.36,1)!important}
  .tog .k{transition:transform .8s cubic-bezier(.22,1,.36,1),background .5s!important}
  .it{transition:background .6s ease!important}

  /* فونت هندسی و گرد (شبیه گرافیک) */
  body,button,input,select,textarea{font-family:"Estedad Variable",Vazirmatn,Tahoma,sans-serif!important}
  h1,h2,h3,.side,.mk b,.bnav button,.cta,.sec2 h3,.acard h2{font-weight:800}

  :root{--muted:#565d70;--soft:#6f7689;--buy:#0a8044;--sell:#cf3338;--amber:#a8620a}
  :root[data-theme="dark"]{--muted:#a7aec0;--soft:#8c93a6;--buy:#3fdc8a;--sell:#ff7b80;--amber:#ffbf5e}

  /* ================= طراحی هماهنگ با صفحه‌ی اعضا ================= */
  .hubstats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 10px 12px;border-radius:30px;margin:6px 0 18px}
  .hubstats::before{content:"";position:absolute;left:18%;right:18%;top:48px;height:2px;background:linear-gradient(90deg,transparent,var(--line),transparent);z-index:0}
  .snode{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .snode .nd{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--tile);box-shadow:var(--raise),0 10px 24px -14px var(--ac)}
  .snode .nd i{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 210deg,var(--ac) 0 46%,transparent 46%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
  .snode b{font-family:Montserrat,Arial,sans-serif;font-size:23px;font-weight:800;color:var(--ac);text-shadow:none!important}
  .snode small{font-size:12px;font-weight:800;color:var(--muted)}
  /* سطرها: کپسول جدا با دایره‌ی کمانی */
  .list.glass{background:none!important;box-shadow:none!important;border:0!important;padding:0!important;display:grid;gap:12px}
  .list.glass>.shine{display:none}
  .list .it{background:var(--gl);box-shadow:var(--raise);border-radius:34px!important;padding:10px 12px!important}
  .list .it:active{transform:none!important}
  .it .av{position:relative;width:44px!important;height:44px!important;box-shadow:var(--raise)!important;overflow:visible}
  .it .av::after{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none;background:conic-gradient(from 200deg,var(--ac,var(--glowc)) 0 40%,transparent 40%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}
  .av.buy{--ac:var(--buy)} .av.sell{--ac:var(--sell)}
  .it:hover .av,.it:active .av{transform:none!important}
  .empty{border-radius:30px}
  /* گفتگو */
  .bub.adm{background:linear-gradient(180deg,var(--navy2),var(--navy))!important;color:var(--onNavy)!important;box-shadow:0 10px 22px -12px var(--glowc)}
  .bub.mem{background:var(--gl)!important;border:0!important;box-shadow:var(--raise)}
  .bub.adm .vp{background:rgba(255,255,255,.14)!important}
  /* نتیجه‌ی سیگنال */
  .rb.cur{outline:0!important;border:0!important;box-shadow:var(--sh-in),0 0 0 2px var(--glowc)!important}
  /* حرکت‌ها: یک منحنی نرم و یکسان، بدون نقاشی دائمی */
  .shine,.sw>.shine{display:none!important}
  .rise{animation-duration:.7s!important;animation-timing-function:cubic-bezier(.2,.8,.2,1)!important;animation-delay:calc(var(--i,0) * 60ms)!important}
  .sheet{transition:transform .55s cubic-bezier(.2,.8,.2,1)!important}
  .veil{transition:opacity .4s ease!important}
  .nav .pill{transition:transform .5s cubic-bezier(.2,.8,.2,1)!important}
  .mf button,.tfc button,.tog button{transition:background-color .35s,color .35s,box-shadow .35s!important}
  .tog .k{transition:transform .5s cubic-bezier(.2,.8,.2,1),background .4s!important}
  .chip{box-shadow:var(--raise);font-weight:800}
  input,textarea,select,button{touch-action:manipulation}

  .sprev{margin-top:10px;border-radius:18px;overflow:hidden;max-height:320px;display:grid;place-items:center;background:var(--field)}
  .sprev:empty{display:none}
  .sprev img,.sprev video{max-width:100%;max-height:320px;display:block}
  .strep{display:block;font-size:11.5px;font-weight:800;opacity:.85;margin-bottom:2px}

  .nav{width:min(460px,calc(100% - 16px))!important;grid-template-columns:repeat(5,1fr)!important}
  .nav .pill{width:calc((100% - 12px)/5)!important}
  .nav button{flex-direction:column!important;gap:1px!important;font-size:10.5px!important;height:52px!important}
  .nav button svg{width:18px!important;height:18px!important}
  .nav .nb{position:absolute!important;top:2px!important;left:calc(50% - 24px)!important;right:auto!important}
  .prframe{display:block;width:100%;height:calc(100vh - 290px);min-height:520px;transition:height .35s ease;border:0;border-radius:30px;background:var(--bg)}

  .autoeng .egrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .autoeng .egrid div{padding:8px 10px;border-radius:14px;background:var(--tile);box-shadow:var(--raise);display:flex;flex-direction:column}
  .autoeng .egrid span{font-size:11px;color:var(--muted)}
  .autoeng .egrid b{font-size:13.5px}

  /* ===== مرجع تصویری: دکمه‌ی کشیدنی + سوییچ سه‌بعدی ===== */
  .slide{position:relative;height:64px;margin-top:22px;border-radius:999px;background:var(--field);box-shadow:var(--sh-in);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y;outline:0}
  .slide:focus-visible{box-shadow:var(--sh-in),0 0 0 3px color-mix(in srgb,var(--buy) 40%,transparent)}
  .slide .sfill{position:absolute;top:0;bottom:0;inset-inline-start:0;width:70px;border-radius:999px;background:linear-gradient(180deg,#34d399,#0ea371);opacity:calc(.25 + var(--p,0) * .75)}
  .slide .slab{position:absolute;inset:0;display:grid;place-items:center;padding-inline-start:56px;font-weight:800;font-size:14.5px;color:var(--muted);opacity:calc(1 - var(--p,0) * 1.4);
    background:linear-gradient(90deg,var(--muted) 40%,var(--text) 50%,var(--muted) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:slsh 3.2s linear infinite}
  @keyframes slsh{to{background-position:-250% 0}}
  .slide .sknob{position:absolute;top:6px;inset-inline-start:6px;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:grab;touch-action:none;color:#fff;
    background:radial-gradient(circle at 35% 28%,#5cf0b4,#10b277 55%,#08865a);box-shadow:0 10px 18px -6px rgba(8,134,90,.6),inset 0 2px 1px rgba(255,255,255,.55),inset 0 -3px 6px rgba(0,0,0,.18);z-index:2}
  .slide .sknob svg{width:24px;height:24px}
  [dir="ltr"] .slide .sknob svg{transform:scaleX(-1)}
  .slide.drag .sknob{cursor:grabbing;transform-origin:center}
  .slide.anim .sknob,.slide.anim .sfill{transition:transform .55s cubic-bezier(.22,1.25,.4,1),width .55s cubic-bezier(.22,1.25,.4,1)}
  .slide.done .slab{opacity:0}
  .slide.busy .sknob svg{display:none}
  .slide.busy .sknob::after{content:"";width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* سوییچ خرید/فروش سه‌بعدی: شیار فرورفته + دستگیره‌ی براق */
  .tog{padding:6px!important;background:var(--field)!important;box-shadow:inset 5px 5px 11px rgba(140,150,175,.5),inset -5px -5px 11px rgba(255,255,255,.95)!important}
  :root[data-theme="dark"] .tog{box-shadow:inset 5px 5px 11px rgba(0,0,0,.65),inset -4px -4px 10px rgba(255,255,255,.04)!important}
  .tog .k{top:6px!important;bottom:6px!important;right:6px!important;width:calc(50% - 6px)!important;
    background:radial-gradient(120% 140% at 30% 15%,#6ef3bd,#14b87a 50%,#0a8b5c)!important;
    box-shadow:0 10px 18px -6px rgba(10,139,92,.65),0 3px 5px rgba(0,0,0,.12),inset 0 2px 1px rgba(255,255,255,.6),inset 0 -4px 8px rgba(0,0,0,.18)!important}
  .tog.sell .k{background:radial-gradient(120% 140% at 30% 15%,#ff9a9d,#ee4b51 50%,#b92c32)!important;box-shadow:0 10px 18px -6px rgba(185,44,50,.6),0 3px 5px rgba(0,0,0,.12),inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.18)!important}
  .tog .k::after{content:"";position:absolute;top:3px;left:14%;right:14%;height:38%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
  .tog button{position:relative;z-index:1;font-weight:800}
  .tog button.on{color:#fff!important;text-shadow:0 1px 2px rgba(0,0,0,.25)}

  .fpick{display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px;background:var(--field);box-shadow:var(--sh-in);cursor:pointer;min-height:54px}
  .fpick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .fpick .fb{flex:none;padding:10px 16px;border-radius:999px;font-weight:800;font-size:13px;color:var(--onNavy);background:linear-gradient(180deg,var(--navy2),var(--navy));box-shadow:0 8px 16px -8px var(--glowc)}
  .fpick .fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;font-weight:700;color:var(--muted)}
  .fpick.has .fn{color:var(--text)}

  .mfp{margin-bottom:8px}
  .psum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  .psum span{flex:1 1 auto;text-align:center;padding:8px 10px;border-radius:16px;background:var(--field);box-shadow:var(--sh-in);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  .psum b{display:block;font:800 16px/1.2 Montserrat,Arial,sans-serif;color:var(--text);margin-top:2px}
  .psum .w b{color:var(--buy)} .psum .l b{color:var(--sell)} .psum .r b{color:#ff7a3d}

  /* ===== مدیریت جدول ارزها ===== */
  .fxadm{margin:0 0 14px;padding:14px;border-radius:26px}
  .fxat{display:flex;align-items:center;gap:10px}
  .fxat>span{font-size:24px}
  .fxat b{display:block;font-size:14.5px;font-weight:900}
  .fxat small{font-size:11.5px;color:var(--muted);font-weight:700}
  .fxab{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .fxab button{flex:1 1 auto;border:0;border-radius:999px;padding:10px 12px;font:inherit;font-size:12.5px;font-weight:800;color:var(--text);background:var(--tile);box-shadow:var(--raise);cursor:pointer}
  .fxab button:first-child{color:var(--onNavy);background:linear-gradient(180deg,var(--navy2),var(--navy))}
  .fxnb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--sell);color:#fff;font-size:11px;margin-inline-start:4px}
  .fxal{display:grid;gap:10px;margin-top:8px}
  .fxai{padding:12px;border-radius:20px;background:var(--field);box-shadow:var(--sh-in)}
  .fxah{display:flex;align-items:center;gap:10px}
  .fxah .fl{font-size:22px}
  .fxah b{display:block;font-size:14px;font-weight:800}
  .fxah small{font-size:11px;color:var(--muted)}
  .fxav{margin-inline-start:auto;display:flex;gap:10px;font-size:11px;color:var(--muted);text-align:center}
  .fxav b{display:block;font:800 14px Montserrat,Arial,sans-serif;color:var(--text)}
  .fxav .b b{color:var(--buy)} .fxav .s b{color:var(--sell)}
  .fxatags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
  .fxabtn{display:flex;flex-wrap:wrap;gap:6px}
  .fxabtn button,.fxhr button,.fxdone{border:0;border-radius:999px;padding:7px 11px;font:inherit;font-size:11.5px;font-weight:800;color:var(--text);background:var(--tile);box-shadow:var(--raise);cursor:pointer}
  .fxabtn button:first-child{color:var(--onNavy);background:linear-gradient(180deg,var(--navy2),var(--navy))}
  .fxchk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:700}
  .fxchk{justify-content:space-between;padding:10px 12px;border-radius:18px;background:var(--field);box-shadow:var(--sh-in);line-height:1.7}
  .sheet .fxchk input{order:2;flex:none;position:relative;width:50px;height:28px;margin:0;border-radius:999px;cursor:pointer;background:var(--bg);
    box-shadow:inset 3px 3px 6px rgba(140,150,175,.55),inset -3px -3px 6px rgba(255,255,255,.9);transition:background .4s}
  :root[data-theme="dark"] .sheet .fxchk input{box-shadow:inset 3px 3px 6px rgba(0,0,0,.65),inset -2px -2px 5px rgba(255,255,255,.05)}
  .sheet .fxchk input::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9ecf2 70%,#cfd4de);
    box-shadow:0 3px 6px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
  .sheet .fxchk input:checked{background:linear-gradient(180deg,#3d8bff,#1f6bf0);box-shadow:inset 2px 3px 6px rgba(0,30,90,.45)}

/* ===== استوری ===== */
let cStories = [], cStoryStats = {};
async function loadStoriesAdmin(){
  const { data } = await sb.from("stories").select("*").gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false });
  cStories = data || []; cStoryStats = {};
  if (cStories.length) { const ids = cStories.map(s => s.id);
    const [{ data: v }, { data: l }] = await Promise.all([sb.from("story_views").select("story_id,user_id").in("story_id", ids), sb.from("story_likes").select("story_id,user_id").in("story_id", ids)]);
    for (const s of cStories) cStoryStats[s.id] = { v: (v || []).filter(x => x.story_id === s.id), l: (l || []).filter(x => x.story_id === s.id) }; }
  drawStoryAdmin();
}
function drawStoryAdmin(){
  const el = $("stadm"); if (!el) return;
  if (!cStories.length) { el.innerHTML = ""; return; }
  const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 60 ? m + " دقیقه پیش" : Math.round(m / 60) + " ساعت پیش"; };
  el.innerHTML = `<div class="sec" style="margin-top:18px"><h3>استوری‌های فعال</h3></div><div class="list glass">${cStories.map(s => { const st = cStoryStats[s.id] || { v: [], l: [] };
    return `<div class="it" style="cursor:default"><span class="av" style="--ac:#ff8a3d;background:var(--field)">${s.kind === "video" ? "🎬" : "🖼"}</span>
      <div><div class="t">${esc(s.caption || (s.kind === "video" ? "ویدیو" : "عکس"))}</div><div class="s">👁 ${st.v.length} بازدید · ♥ ${st.l.length} لایک · ${ago(s.created_at)}</div>
      ${st.l.length ? `<div class="s">♥ ${st.l.map(x => esc(members.find(m => m.id === x.user_id)?.name || "")).filter(Boolean).join("، ")}</div>` : ""}</div>
      <button class="ghost red" style="width:auto;height:36px;margin:0;padding:0 12px" data-delst="${s.id}">حذف</button></div>`; }).join("")}</div>`;
  el.onclick = async e => { const b = e.target.closest("[data-delst]"); if (!b || !confirm("این استوری حذف شود؟")) return;
    const s = cStories.find(x => String(x.id) === b.dataset.delst); await sb.from("stories").delete().eq("id", s.id); sb.storage.from("media").remove([s.file_path]); toast("حذف شد"); loadStoriesAdmin(); };
}
function sheetStory(){
  openSheet(`<h2>✨ استوری جدید</h2><p class="hint">۲۴ ساعت برای اعضا نمایش داده می‌شود. ویدیو حداکثر ۱ دقیقه. اعضا می‌توانند لایک کنند و پاسخشان مستقیم به بخش پیام‌ها می‌آید.</p>
    <label class="l">عکس یا ویدیو</label><input class="in" id="sfile" type="file" accept="image/*,video/*" style="padding-top:13px">
    <div id="sprev" class="sprev"></div>
    <label class="l">متن روی استوری (اختیاری)</label><input class="in" id="scap" maxlength="300" placeholder="مثلاً: تحلیل صبح طلا، به سطح 4050 دقت کنید">
    <div class="hint" id="sprog"></div>
    <button class="cta press" id="spub">انتشار استوری</button>`);
  let file = null, kind = null, dur = 7;
  $("sfile").onchange = async e => { file = e.target.files[0]; if (!file) return; kind = file.type.startsWith("video") ? "video" : "image"; const url = URL.createObjectURL(file);
    if (kind === "video") { const v = document.createElement("video"); v.src = url; v.muted = true; v.playsInline = true; v.controls = true;
      await new Promise(r => { v.onloadedmetadata = r; v.onerror = r; }); dur = Math.min(60, Math.ceil(v.duration || 0));
      if ((v.duration || 0) > 61) { file = null; $("sprev").innerHTML = ""; return toast("ویدیو بیشتر از ۱ دقیقه است. یک ویدیوی کوتاه‌تر انتخاب کنید.", true); }
      if (file.size > 50 * 1024 * 1024) { file = null; return toast("ویدیو بیشتر از ۵۰ مگابایت است", true); }
      $("sprev").innerHTML = ""; $("sprev").appendChild(v); }
    else { dur = 7; file = await compressImage(file, 1440); $("sprev").innerHTML = `<img src="${URL.createObjectURL(file)}" alt="">`; } };
  $("spub").onclick = async () => {
    if (!file) return toast("یک عکس یا ویدیو انتخاب کنید", true);
    const b = $("spub"); busy(b, true); $("sprog").textContent = "در حال آپلود…";
    const ext = kind === "video" ? ((file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") || "mp4") : "jpg";
    const path = `stories/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
    const up = await sb.storage.from("media").upload(path, file, { contentType: file.type || (kind === "video" ? "video/mp4" : "image/jpeg") });
    if (up.error) { busy(b, false, "انتشار استوری"); $("sprog").textContent = ""; return toast("آپلود ناموفق: " + up.error.message, true); }
    const { error } = await sb.from("stories").insert({ kind, file_path: path, caption: $("scap").value.trim() || null, duration_sec: dur });
    if (error) { sb.storage.from("media").remove([path]); busy(b, false, "انتشار استوری"); return toast("خطا: " + error.message, true); }
    closeSheet(); sfx("notification", .5); toast("استوری منتشر شد ✓"); loadStoriesAdmin();
  };
}

  el.onclick = async e => {

const nIn = (id, ph = "", v = "") => `<input class="in num" id="${id}" type="text" inputmode="decimal" autocomplete="off" dir="ltr" placeholder="${ph}" value="${v ?? ""}">`;

function sheetPost(kind){

    ${isEv ? `<label class="l">زمان رویداد (به وقت کابل)</label><input class="in" id="pe" type="datetime-local">
      <label class="l">اهمیت</label><div class="tfc" id="pimp">${[["high","🔴 مهم"],["medium","🟠 متوسط"],["low","⚪ کم"]].map(([v, t]) => `<button type="button" data-v="${v}">${t}</button>`).join("")}</div>
      <div class="rrow"><div><label class="l">قبلی</label><input class="in num" id="pp" dir="ltr"></div><div><label class="l">پیش‌بینی</label><input class="in num" id="pf" dir="ltr"></div><div><label class="l">واقعی</label><input class="in num" id="pa" dir="ltr"></div></div>` : ""}

    <label class="l">${isArt ? "متن آموزش" : "توضیح / تحلیل خبر"}${isVid ? " (اختیاری)" : ""}</label><textarea class="in" id="pb" rows="${isArt ? 8 : 4}"></textarea>
    ${!isArt && !isVid ? `<label class="l">تأثیر</label><div class="impsel">${impRow("xau","طلا")}${impRow("xag","نقره")}${impRow("usd","دالر")}</div>` : ""}

    <button class="cta press" id="psave">انتشار</button>`);

  $("sheet").querySelectorAll("[data-imp]").forEach(g => g.onclick = e => { const b = e.target.closest("button"); if (!b) return; const k = g.dataset.imp;
    impact[k] = impact[k] === b.dataset.v ? undefined : b.dataset.v; g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === impact[k])); });
  if (isEv) { const paint = () => $("pimp").querySelectorAll("button").forEach(x => x.classList.toggle("on", x.dataset.v === importance)); paint();
    $("pimp").onclick = e => { const b = e.target.closest("button"); if (b) { importance = b.dataset.v; paint(); } }; }

    const title = $("pt").value.trim(); if (!title) return $("pt").focus();

    if (isEv) { row.importance = importance; if ($("pe").value) row.event_at = new Date($("pe").value).toISOString();
      ["pp:previous","pf:forecast","pa:actual"].forEach(x => { const [id, k] = x.split(":"); const v = toEnA($(id).value.trim()); if (v) row[k] = v; }); }
    const b = $("psave"); busy(b, true);
    if (isVid) { const file = $("pv").files[0]; if (!file) { busy(b, false, "انتشار"); return toast("ویدیو را انتخاب کنید", true); }

      $("pprog").textContent = "در حال آپلود ویدیو…";
      const ext = (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") || "mp4";
      row.file_path = `videos/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${ext}`;
      const up = await sb.storage.from("media").upload(row.file_path, file, { contentType: file.type || "video/mp4" });
      if (up.error) { busy(b, false, "انتشار"); $("pprog").textContent = ""; return toast("آپلود ناموفق: " + up.error.message, true); } }

function sheetFxRate(c, city = "kabul"){
  const d = c.digits ?? 2, midOnly = c.mid != null && c.buy == null && c.sell == null;
  openSheet(`<h2>${c.flag || ""} نرخ دستی · ${esc(c.name_fa)}</h2><p class="hint">${esc(c.note_fa || (c.sym + " به " + c.quote))}. هر کدام را که دارید وارد کنید؛ خانه‌ی خالی ثبت نمی‌شود. خرید = نرخی که صراف می‌خرد، فروش = نرخی که صراف می‌فروشد.</p>
    <form id="fxrf"><label class="l">شهر</label><select class="in" id="fxcity">${fxACities.map(k => `<option value="${k.code}" ${k.code === city ? "selected" : ""}>${esc(k.name_fa)}</option>`).join("")}</select>

      : `<div class="two"><div><label class="l">قیمت خرید</label><input class="in num" id="fxb" inputmode="decimal" dir="ltr" placeholder="${fxN(c.buy, d)}"></div><div><label class="l">قیمت فروش</label><input class="in num" id="fxs" inputmode="decimal" dir="ltr" placeholder="${fxN(c.sell, d)}"></div></div>`}
      <label class="l">یادداشت (اختیاری)</label><input class="in" id="fxnote" maxlength="120" placeholder="مثلاً: اصلاح نرخ اشتباه کانال">
      <label class="fxchk"><input type="checkbox" id="fxlock" ${c.auto ? "" : "checked"}> دریافت خودکار این ارز متوقف شود (فقط نرخ دستی نمایش داده شود)</label>
      <div class="box" id="fxwarn" style="display:none"></div>
      <button class="cta press" id="fxsave">ثبت نرخ</button></form>`);
  $("fxrf").onsubmit = async e => {
    e.preventDefault(); const b = $("fxsave"), w = $("fxwarn");
    const buy = $("fxb") ? num($("fxb").value) : null, sell = $("fxs") ? num($("fxs").value) : null, mid = $("fxm") ? num($("fxm").value) : null;
    if (buy == null && sell == null && mid == null) return toast("حداقل یک نرخ وارد کنید", true);
    const inR = v => v == null || ((c.min_v == null || v >= Number(c.min_v)) && (c.max_v == null || v <= Number(c.max_v)));
    const probs = [];
    if (!inR(buy) || !inR(sell) || !inR(mid)) probs.push(`عدد خارج از محدوده‌ی معمول این ارز است (${fxN(c.min_v, d)} تا ${fxN(c.max_v, d)}).`);
    if (buy != null && sell != null && Math.abs(buy - sell) / Math.max(buy, sell) > .05) probs.push("فاصله‌ی خرید و فروش بیش از ۵٪ است؛ جای خرید و فروش را بررسی کنید.");
    if (probs.length && w.dataset.ok !== "1") { w.style.display = "block"; w.innerHTML = "⚠️ " + probs.join("<br>") + "<br><b>اگر مطمئن هستید دوباره «ثبت نرخ» را بزنید.</b>"; w.dataset.ok = "1"; return; }
    busy(b, true);
    const cityV = $("fxcity").value;
    const { error } = await sb.from("currency_rates").insert({ currency_id: c.id, city: cityV, buy, sell, mid, kind: "manual", source: "manual", posted_at: new Date().toISOString(), note: $("fxnote").value.trim() || null, created_by: (await sb.auth.getUser()).data?.user?.id || null });
    if (error) { busy(b, false, "ثبت نرخ"); return toast("خطا: " + error.message, true); }
    const lock = $("fxlock").checked;
    if (lock === c.auto) await sb.from("currencies").update({ auto: !lock, updated_at: new Date().toISOString() }).eq("id", c.id);
    if (c.code === "USD" && buy != null && sell != null) sb.from("rates").insert({ place: cityV, buy, sell, src: "admin" }).then(() => {});
    sfx("notification", .4); toast("نرخ دستی ثبت شد ✓"); await loadFxAdmin(); closeSheet();
  };
}

/* دکمه‌ی کشیدنی برای تأیید (مثل «بکشید تا باز شود») */
function slideAct(el, onFire){
  const kn = el.querySelector(".sknob"), fill = el.querySelector(".sfill"), rtl = getComputedStyle(el).direction === "rtl";
  let x0 = 0, max = 0, cur = 0, drag = false, fired = false;
  const set = (v, anim) => { cur = v; el.classList.toggle("anim", !!anim); const tx = rtl ? -v : v;
    kn.style.transform = `translateX(${tx}px)`; fill.style.width = `${v + kn.offsetWidth + 6}px`; el.style.setProperty("--p", max ? v / max : 0); };
  const reset = () => { fired = false; el.classList.remove("busy", "done"); set(0, true); };
  const fire = () => { if (fired) return; fired = true; set(max, true); el.classList.add("done", "busy"); try { sfx("toggle_on", .45); } catch {}
    onFire(ok => { if (!ok) reset(); }); };
  kn.addEventListener("pointerdown", e => { if (fired) return; drag = true; x0 = e.clientX; max = el.clientWidth - kn.offsetWidth - 12; kn.setPointerCapture(e.pointerId); el.classList.add("drag"); });
  kn.addEventListener("pointermove", e => { if (!drag) return; const d = (e.clientX - x0) * (rtl ? -1 : 1); set(Math.max(0, Math.min(max, d))); });
  const up = () => { if (!drag) return; drag = false; el.classList.remove("drag"); cur > max * .82 ? fire() : set(0, true); };
  kn.addEventListener("pointerup", up); kn.addEventListener("pointercancel", up);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); max = el.clientWidth - kn.offsetWidth - 12; fire(); } });
  el.addEventListener("click", e => { if (e.target.closest(".sknob") || fired || cur > 0) return; kn.animate([{ transform: "translateX(0)" }, { transform: `translateX(${rtl ? -26 : 26}px)` }, { transform: "translateX(0)" }], { duration: 650, easing: "cubic-bezier(.3,1.4,.5,1)" }); });
}

/* تبدیل صدا به WAV تا روی همه‌ی گوشی‌ها (اندروید و آیفون) پخش شود */
async function toWav(blob){

  const ctx = new AC(); let buf;
  try { buf = await ctx.decodeAudioData(await blob.arrayBuffer()); } finally { ctx.close && ctx.close(); }

  src.buffer = buf; src.connect(off.destination); src.start();
  const d = (await off.startRendering()).getChannelData(0);
  const v = new DataView(new ArrayBuffer(44 + d.length * 2));
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + d.length * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) { const x = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([v], { type: "audio/wav" });
}

    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(timer);
      const b = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); mr = null;
      if (b.size < 800) { toast("صدا خیلی کوتاه بود", true); return idle(); }

      toWav(b).then(setBlob).catch(() => setBlob(b)); };
    mr.start(); t0 = Date.now();

      if (Date.now() - t0 > 5 * 60000 && mr) mr.stop(); }, 250);
  }
  idle();
  return { blob: () => blob, recording: () => !!mr };
}

/* مترجم: اول Google مستقیم از مرورگر، بعد MyMemory، بعد سرور */
async function gTranslate(text, tl){
  const parts = []; let cur = "";
  for (const line of String(text).split(/(\n)/)) { if ((cur + line).length > 1500 && cur) { parts.push(cur); cur = ""; } cur += line; }
  if (cur) parts.push(cur);
  const one = async p => {
    try {
      const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl=" + tl + "&q=" + encodeURIComponent(p));
      if (r.ok) { const j = await r.json(); const t = (j[0] || []).map(x => x[0]).join(""); if (t) return t; }
    } catch {}
    try {
      const src = /[؀-ۿ]/.test(p) ? (tl === "fa" ? "ps" : "fa") : "en";
      const r = await fetch("https://api.mymemory.translated.net/get?q=" + encodeURIComponent(p) + "&langpair=" + src + "|" + (tl === "ps" ? "ps-AF" : tl));
      if (r.ok) { const j = await r.json(); const t = j?.responseData?.translatedText; if (t && !/MYMEMORY WARNING|INVALID/i.test(t)) return t; }
    } catch {}
    throw new Error("tr_failed");
  };
  const out = []; for (const p of parts) out.push(await one(p));
  return out.join("");
}

  gTranslate(el.dataset.orig, lang).then(done).catch(() =>

}

const chatUrl = {};

async function compressImage(file, max = 1600){
  let bmp = null; try { bmp = await createImageBitmap(file); } catch {}
  if (!bmp) return file;
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .82));
}
function makeRecorder(onTick, maxSec = 60){
  let mr = null, chunks = [], stream = null, t0 = 0, timer = null, resolveStop = null;
  return {
    active: () => !!mr,
    async start(){
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported?.(m)) || "";
      mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); chunks = [];
      mr.ondataavailable = e => e.data.size && chunks.push(e.data);
      mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(timer); const b = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); mr = null; resolveStop && resolveStop(b); };
      mr.start(); t0 = Date.now(); timer = setInterval(() => { const s = (Date.now() - t0) / 1000; onTick && onTick(s); if (s >= maxSec && mr) this.stop().then(b => this.onAuto && this.onAuto(b)); }, 250);
    },
    stop(){ return new Promise(r => { if (!mr) return r(null); resolveStop = r; mr.stop(); }); },
    cancel(){ if (!mr) return; resolveStop = null; mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearInterval(timer); mr = null; }; mr.stop(); },
  };
}

  $("cclr").onclick = async () => { if (!confirm(`تمام پیام‌های گفتگو با ${m.name} حذف شود؟`)) return;
    const { error } = await sb.from("messages").update({ deleted_at: new Date().toISOString(), deleted_by: "admin" }).eq("member_id", id).is("deleted_at", null);
    if (error) return toast("انجام نشد: " + error.message, true); toast("گفتگو حذف شد"); loadMsgs(); };
  $("cbody").onclick = async e => { const bb = e.target.closest(".bub[data-mid]"); if (!bb || e.target.closest("audio,button,a,img")) return;
    const mid = Number(bb.dataset.mid); if (!mid || !confirm("این پیام برای هر دو طرف حذف شود؟")) return;
    const { error } = await sb.from("messages").update({ deleted_at: new Date().toISOString(), deleted_by: "admin" }).eq("id", mid);
    if (error) return toast("حذف نشد: " + error.message, true); const x = allMsgs.find(z => z.id === mid); if (x) { x.deleted_at = new Date().toISOString(); x.deleted_by = "admin"; } lastChatSig = ""; drawChatSheet(); };
  const rec = makeRecorder(t => { const el = $("rtime"); if (el) el.textContent = mmss(Math.min(t, 480)) + " / 8:00"; }, 480);
  rec.onAuto = async raw => { $("cf")?.classList.remove("recording"); if (!raw || raw.size < 800) return; let w = raw; try { w = await toWav(raw); } catch {} sendMedia("voice", w, w.type === "audio/wav" ? "wav" : "webm"); };
  const sendMedia = async (kind, blob, ext) => {
    const path = `${id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
    const temp = { id: "t" + Date.now(), member_id: id, sender: "admin", kind, created_at: new Date().toISOString(), seen_at: null, _up: true };
    allMsgs.push(temp); drawChatSheet();
    const up = await sb.storage.from("chat").upload(path, blob, { contentType: blob.type || (kind === "image" ? "image/jpeg" : "audio/wav") });
    if (up.error) { allMsgs = allMsgs.filter(x => x !== temp); drawChatSheet(); return toast("ارسال نشد: " + up.error.message, true); }
    chatUrl[path] = URL.createObjectURL(blob);
    const { error } = await sb.from("messages").insert({ member_id: id, sender: "admin", kind, file_path: path });
    if (error) { allMsgs = allMsgs.filter(x => x !== temp); sb.storage.from("chat").remove([path]); toast("ارسال نشد: " + error.message, true); }
    loadMsgs();

  $("rcancel").onclick = () => { rec.cancel(); $("cf").classList.remove("recording"); $("rtime").textContent = "0:00"; };
  $("cf").onsubmit = async e => {
    e.preventDefault();
    if (rec.active()) { $("cf").classList.remove("recording"); const raw = await rec.stop(); $("rtime").textContent = "0:00";
      if (!raw || raw.size < 800) return; let w = raw; try { w = await toWav(raw); } catch {} return sendMedia("voice", w, w.type === "audio/wav" ? "wav" : "webm"); }
    const body = $("cin").value.trim(); if (!body) return;
    $("cin").value = "";

    if (error) { toast("ارسال نشد: " + error.message, true); $("cin").value = body; }
    loadMsgs();
  };
}
