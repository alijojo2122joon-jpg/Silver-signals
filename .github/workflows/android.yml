name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Signing key
        env: { MA_KEY_PASS: "${{ secrets.MA_KEY_PASS }}" }
        run: |
          test ${#MA_KEY_PASS} -ge 6 || { echo "::error::Add repository secret MA_KEY_PASS (min 6 chars): Settings > Secrets and variables > Actions"; exit 1; }
          KS="$RUNNER_TEMP/ma.jks"
          if [ -f android/ma.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/ma.jks.enc -out "$KS" -pass env:MA_KEY_PASS
          else
            keytool -genkeypair -keystore "$KS" -storepass "$MA_KEY_PASS" -keypass "$MA_KEY_PASS" -alias ma -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Market Analysts, C=AF"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out android/ma.jks.enc -pass env:MA_KEY_PASS
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/ma.jks.enc && git commit -m "Add encrypted signing key [skip ci]" && git push
          fi
          echo "MA_KEYSTORE=$KS" >> "$GITHUB_ENV"
      - name: Build APKs
        env: { MA_KEY_PASS: "${{ secrets.MA_KEY_PASS }}" }
        run: gradle -p android assembleMemberDebug assembleAdminDebug --no-daemon -Pvc=${{ github.run_number }}
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/member/debug/app-member-debug.apk out/MarketAnalysts.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk out/MarketAnalysts-Admin.apk
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: out/*.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android app v${{ github.run_number }}
          files: out/*.apk
