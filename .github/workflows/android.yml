name: Build Android APK
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.7" }
      - name: Build APKs
        run: gradle -p android assembleMemberDebug assembleAdminDebug --no-daemon
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/member/debug/app-member-debug.apk out/MarketAnalysts.apk
          cp android/app/build/outputs/apk/admin/debug/app-admin-debug.apk out/MarketAnalysts-Admin.apk
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: out/*.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Android app v${{ github.run_number }}
          files: out/*.apk
